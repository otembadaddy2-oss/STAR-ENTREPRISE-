<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STAR ENTREPRISE — Jardissa &amp; PIOUPIOU</title>
<meta name="description" content="La pub animée de STAR ENTREPRISE, racontée par Jardissa et PIOUPIOU.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,900&family=Manrope:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy-950:#050914;
  --navy-900:#0a1226;
  --navy-800:#0f1c38;
  --navy-700:#16274a;
  --gold-400:#f3ce7a;
  --gold-500:#e3b34a;
  --gold-600:#c8952b;
  --cream:#fbf6ea;
  --ink:#0a0e18;
  --white:#ffffff;
  --chick-400:#ffd94a;
}

*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--navy-950);
  color:var(--cream);
  font-family:'Manrope',ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

.stage{
  position:relative;
  width:100%;
  height:100dvh;
  min-height:600px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:
    radial-gradient(ellipse 900px 700px at 50% 14%, rgba(227,179,74,.16), transparent 60%),
    radial-gradient(ellipse 1200px 900px at 50% 120%, rgba(22,39,74,.9), transparent 60%),
    linear-gradient(180deg, var(--navy-950) 0%, var(--navy-900) 45%, var(--navy-950) 100%);
}

/* giant watermark star, echoes the lobby backdrop in the brand reference */
.watermark-star{
  position:absolute; left:50%; top:38%; transform:translate(-50%,-50%);
  width:min(120vw,900px); opacity:.05; pointer-events:none;
}

.sparkles{position:absolute; inset:0; overflow:hidden; pointer-events:none;}
.spark{
  position:absolute;
  width:var(--s,4px); height:var(--s,4px);
  background:var(--gold-400);
  border-radius:50%;
  opacity:0;
  box-shadow:0 0 8px 1px rgba(243,206,122,.9);
  animation:twinkle var(--dur,3.2s) ease-in-out var(--delay,0s) infinite;
}
@keyframes twinkle{
  0%,100%{opacity:0; transform:scale(.4);}
  50%{opacity:var(--peak,.9); transform:scale(1);}
}

.vignette{position:absolute; inset:0; pointer-events:none;
  background:radial-gradient(ellipse 70% 60% at 50% 45%, transparent 55%, rgba(2,4,10,.55) 100%);
}

/* ---------- duo rig ---------- */
.duo-rig{
  position:relative;
  width:min(92vw, 480px);
  height:min(78vh, 560px);
  opacity:1;
  transition:opacity .5s ease;
}
.duo-rig.hide{ opacity:0; pointer-events:none; }

.jardissa-wrap{
  position:absolute;
  right:0; top:13%;
  width:66%;
  display:flex; flex-direction:column; align-items:center;
  z-index:2;
}
.shadow-el{
  width:56%; height:20px; border-radius:50%;
  background:radial-gradient(ellipse at center, rgba(0,0,0,.55), transparent 72%);
  margin-top:-4px;
}
.jardissa-shadow{ animation:shadowPulse .62s ease-in-out infinite alternate; }
@keyframes shadowPulse{
  0%{transform:scaleX(1); opacity:.55;}
  100%{transform:scaleX(.74); opacity:.34;}
}

.char-frame{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  border-radius:26px;
  overflow:hidden;
  box-shadow:0 30px 70px -20px rgba(0,0,0,.7), 0 0 0 1px rgba(227,179,74,.25) inset;
  background:linear-gradient(160deg, var(--navy-800), var(--navy-950));
}
.char-frame::after{
  content:"";
  position:absolute; inset:0;
  background:linear-gradient(180deg, transparent 60%, rgba(5,9,20,.75) 100%);
}
.char-img{
  position:absolute; inset:0;
  width:100%; height:100%;
  object-fit:cover;
  object-position:50% 15%;
  opacity:0;
  transform:scale(1.06);
  transition:opacity .35s ease;
}
.char-img.showing{opacity:1;}

.jardissa-wrap.talking .char-frame{ animation:sway 1.1s ease-in-out infinite; }
@keyframes sway{
  0%,100%{transform:rotate(-1deg) translateY(0);}
  50%{transform:rotate(1.1deg) translateY(-6px);}
}
.jardissa-wrap.frozen .char-frame{ animation:none; transform:rotate(-.6deg) translateY(-6px); }

/* ---------- PIOUPIOU ---------- */
.pioupiou-slot{
  position:absolute;
  left:-2%; bottom:4%;
  width:42%;
  z-index:3;
  display:flex; flex-direction:column; align-items:center;
  transition:left 1.05s cubic-bezier(.32,1.4,.4,1), bottom 1.05s cubic-bezier(.32,1.4,.4,1), width 1.05s cubic-bezier(.32,1.4,.4,1);
}
.pioupiou-slot.perched{
  left:31%; bottom:44%; width:18%;
}
.pioupiou-shadow{ width:70%; }
.pioupiou-slot.perched .pioupiou-shadow{ opacity:0; }

.pioupiou-body{
  width:100%;
  transform-origin:50% 90%;
}
.pioupiou-slot.dancing .pioupiou-body{ animation:waddle .5s ease-in-out infinite; }
@keyframes waddle{
  0%,100%{transform:rotate(-6deg) translateY(0);}
  50%{transform:rotate(6deg) translateY(-8px);}
}
.pioupiou-slot.perched .pioupiou-body{ animation:perchBob 1.4s ease-in-out infinite; transform:rotate(0deg); }
@keyframes perchBob{
  0%,100%{transform:translateY(0) rotate(-2deg);}
  50%{transform:translateY(-4px) rotate(2deg);}
}

#wingL, #wingR{ transform-origin:100px 118px; }
.pioupiou-slot.dancing #wingL{ animation:flapL .5s ease-in-out infinite; }
.pioupiou-slot.dancing #wingR{ animation:flapR .5s ease-in-out infinite; }
@keyframes flapL{ 0%,100%{transform:rotate(0deg);} 50%{transform:rotate(-26deg);} }
@keyframes flapR{ 0%,100%{transform:rotate(0deg);} 50%{transform:rotate(26deg);} }
.pioupiou-slot.presenting #wingR{ animation:none; transform:rotate(-52deg); transition:transform .5s cubic-bezier(.3,1.6,.4,1); }

.diamond-gem{
  opacity:0; transform:scale(.2);
  transform-origin:150px 92px;
  transition:opacity .45s ease .15s, transform .45s cubic-bezier(.3,1.7,.4,1) .15s;
}
.pioupiou-slot.presenting .diamond-gem{ opacity:1; transform:scale(1.45); }
.diamond-gem.shine{ animation:gemSpin 2.4s ease-in-out infinite; }
@keyframes gemSpin{
  0%,100%{ filter:drop-shadow(0 0 3px rgba(255,255,255,.7)); }
  50%{ filter:drop-shadow(0 0 10px rgba(255,255,255,1)); }
}

/* ---------- speech bubble ---------- */
.bubble-wrap{
  position:absolute;
  top:0%;
  left:50%;
  transform:translateX(-50%);
  width:min(90vw, 480px);
  display:flex; flex-direction:column; align-items:center; gap:6px;
  pointer-events:none;
  z-index:6;
}
.speaker-tag{
  font-size:11px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  padding:5px 12px; border-radius:999px;
  opacity:0; transform:translateY(-6px);
  transition:opacity .25s ease, transform .25s ease;
  display:flex; align-items:center; gap:6px;
}
.speaker-tag.on{opacity:1; transform:translateY(0);}
.speaker-tag.jardissa{ background:rgba(227,179,74,.16); color:var(--gold-400); border:1px solid rgba(227,179,74,.4); }
.speaker-tag.pioupiou{ background:rgba(255,217,74,.16); color:var(--chick-400); border:1px solid rgba(255,217,74,.4); }

.bubble{
  position:relative;
  max-width:100%;
  background:var(--white);
  color:var(--ink);
  border-radius:20px;
  padding:15px 20px;
  font-weight:700;
  font-size:clamp(15px, 3.4vw, 19px);
  line-height:1.35;
  text-align:center;
  box-shadow:0 18px 40px -12px rgba(0,0,0,.55);
  opacity:0;
  transform:translateY(-10px) scale(.94);
  transition:opacity .28s ease, transform .28s ease;
}
.bubble.on{opacity:1; transform:translateY(0) scale(1);}
.bubble::after{
  content:"";
  position:absolute;
  bottom:-11px; left:50%;
  transform:translateX(-50%);
  border-width:12px 10px 0 10px;
  border-style:solid;
  border-color:var(--white) transparent transparent transparent;
}
.bubble .cursor{
  display:inline-block; width:2px; height:1em; background:var(--gold-600);
  vertical-align:-2px; margin-left:2px;
  animation:blink 0.8s steps(1) infinite;
}
@keyframes blink{50%{opacity:0;}}

.captions{
  position:absolute;
  left:50%; bottom:6%;
  transform:translateX(-50%);
  width:min(92vw,560px);
  text-align:center;
  font-size:13px;
  font-weight:700;
  letter-spacing:.02em;
  color:rgba(251,246,234,.55);
  min-height:1.4em;
}

/* ---------- finale ---------- */
.finale{
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:18px;
  opacity:0; pointer-events:none;
  transition:opacity .5s ease;
  text-align:center;
  padding:0 6vw;
}
.finale.on{opacity:1; pointer-events:auto;}
.slogan{
  font-family:'Fraunces', Georgia, serif;
  font-weight:900;
  font-size:clamp(22px, 5.6vw, 42px);
  line-height:1.16;
  letter-spacing:-.005em;
  background:linear-gradient(100deg, var(--gold-400), var(--cream) 45%, var(--gold-500) 60%, var(--gold-400));
  background-size:220% 100%;
  -webkit-background-clip:text; background-clip:text; color:transparent;
  animation:shine 3.4s linear infinite;
  min-height:1.3em;
  max-width:640px;
}
@keyframes shine{
  0%{background-position:0% 0;}
  100%{background-position:220% 0;}
}
.slogan .cursor{
  display:inline-block; width:.09em; height:.95em; background:var(--gold-400);
  vertical-align:-.08em; margin-left:.05em;
  animation:blink 0.8s steps(1) infinite;
}
.finale-logo{
  width:min(34vw,150px);
  border-radius:26%;
  opacity:0;
  transform:scale(.6) rotate(-8deg);
  box-shadow:0 20px 60px -15px rgba(227,179,74,.55);
}
.finale-logo.pop{ animation:popLogo .7s cubic-bezier(.2,1.4,.4,1) forwards; }
@keyframes popLogo{ to{opacity:1; transform:scale(1) rotate(0deg);} }

.finale-actions{
  display:flex; gap:12px; flex-wrap:wrap; justify-content:center;
  opacity:0; transform:translateY(8px);
  transition:opacity .5s ease .3s, transform .5s ease .3s;
}
.finale-actions.on{opacity:1; transform:translateY(0);}

.btn{
  appearance:none; border:none; cursor:pointer;
  font-family:'Manrope',inherit; font-weight:700; font-size:14.5px;
  padding:13px 22px; border-radius:999px;
  display:inline-flex; align-items:center; gap:8px;
}
.btn-gold{
  background:linear-gradient(135deg, var(--gold-400), var(--gold-600));
  color:var(--ink);
  box-shadow:0 10px 26px -8px rgba(227,179,74,.6);
}
.btn-ghost{
  background:rgba(255,255,255,.08);
  color:var(--cream);
  border:1px solid rgba(251,246,234,.28);
}
.btn:active{transform:translateY(1px);}

.burst{position:absolute; inset:-20%; pointer-events:none; opacity:0;}
.burst.go{opacity:1;}
.burst i{
  position:absolute; left:50%; top:45%;
  width:6px; height:6px; border-radius:1px;
  background:var(--gold-400);
  box-shadow:0 0 6px rgba(243,206,122,.9);
  transform-origin:0 0;
  animation:fly .9s cubic-bezier(.15,.6,.3,1) forwards;
}
@keyframes fly{
  0%{transform:translate(0,0) rotate(var(--rot)) scale(1); opacity:1;}
  100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot)) scale(.2); opacity:0;}
}

.start-overlay{
  position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(5,9,20,.55), rgba(5,9,20,.86));
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
  text-align:center; padding:0 8vw;
  transition:opacity .5s ease, visibility .5s;
  z-index:5;
}
.start-overlay.hide{opacity:0; visibility:hidden; pointer-events:none;}
.start-eyebrow{
  font-size:12px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
  color:var(--gold-400);
}
.start-title{
  font-family:'Fraunces', Georgia, serif; font-weight:900;
  font-size:clamp(21px,5.6vw,32px); max-width:500px; line-height:1.16;
}
.start-title span{color:var(--gold-400);}

.sound-tag{
  position:absolute; top:16px; right:16px;
  font-size:11px; font-weight:700; letter-spacing:.04em;
  padding:7px 12px; border-radius:999px;
  background:rgba(255,255,255,.08); border:1px solid rgba(251,246,234,.22);
  color:var(--cream); opacity:0; transition:opacity .3s ease;
  display:flex; align-items:center; gap:6px;
  z-index:4;
}
.sound-tag.on{opacity:1;}
.sound-dot{width:7px; height:7px; border-radius:50%; background:#3EE07A; box-shadow:0 0 6px #3ee07a;}

@media (min-width:760px){
  .duo-rig{width:min(52vw,540px);}
}
</style>
</head>
<body>
<div class="stage" id="stage">
  <svg class="watermark-star" viewBox="0 0 100 100" aria-hidden="true">
    <polygon points="50,4 61,37 96,37 68,58 79,92 50,71 21,92 32,58 4,37 39,37" fill="#f3ce7a"/>
  </svg>
  <div class="sparkles" id="sparkles"></div>
  <div class="vignette"></div>

  <div class="sound-tag" id="soundTag"><span class="sound-dot"></span><span id="soundTagText">Son actif</span></div>

  <div class="bubble-wrap">
    <div class="speaker-tag jardissa" id="tagJardissa">🗨️ Jardissa</div>
    <div class="speaker-tag pioupiou" id="tagPioupiou">🐣 PIOUPIOU</div>
    <div class="bubble" id="bubble"><span id="bubbleText"></span></div>

  <div class="duo-rig" id="duoRig">

    <div class="jardissa-wrap" id="jardissaWrap">

        <img class="char-img" id="charHero" src="https://deploy-preview-17--star-entreprise.netlify.app/assets/img/jardissa-hero-v2.webp" alt="Jardissa, l'assistante STAR ENTREPRISE">
        <img class="char-img" id="charAvatar" src="https://deploy-preview-17--star-entreprise.netlify.app/assets/img/jardissa-avatar-v2.webp" alt="Jardissa, l'assistante STAR ENTREPRISE">

<script>
(function(){
  "use strict";

  var LINES = [
    { speaker:'jardissa', text:"Où que vous soyez... en Afrique, en Europe, en Angleterre, en Allemagne, en Italie, ou ici même au Canada..." },
    { speaker:'jardissa', text:"STAR ENTREPRISE vous écoute, et construit avec vous... un rêve en réalité." },
    { speaker:'jardissa', text:"Des sites web vitrines, et bien plus que ça : de vraies applications." },
    { speaker:'jardissa', text:"Que vous soyez une société, un groupe, ou un entrepreneur..." },
    { speaker:'pioupiou', text:"...STAR ENTREPRISE est à votre écoute !" },
    { speaker:'jardissa', text:"Et ce que l'on fait de vos idées ?" },
    { speaker:'pioupiou', text:"Un diamant ! ✨", hop:true }
  ];
  var SLOGAN = "Un seul groupe, toutes les solutions pour votre vie.";

  var duoRig = document.getElementById('duoRig');
  var jardissaWrap = document.getElementById('jardissaWrap');
  var charHero = document.getElementById('charHero');
  var charAvatar = document.getElementById('charAvatar');
  var pioupiouSlot = document.getElementById('pioupiouSlot');
  var diamondGem = document.getElementById('diamondGem');
  var bubble = document.getElementById('bubble');
  var bubbleText = document.getElementById('bubbleText');
  var tagJardissa = document.getElementById('tagJardissa');
  var tagPioupiou = document.getElementById('tagPioupiou');
  var captions = document.getElementById('captions');
  var finale = document.getElementById('finale');
  var slogan = document.getElementById('slogan');
  var finaleLogo = document.getElementById('finaleLogo');
  var finaleActions = document.getElementById('finaleActions');
  var startOverlay = document.getElementById('startOverlay');
  var btnStart = document.getElementById('btnStart');
  var btnReplay = document.getElementById('btnReplay');
  var btnDiscover = document.getElementById('btnDiscover');
  var soundTag = document.getElementById('soundTag');
  var soundTagText = document.getElementById('soundTagText');
  var burst = document.getElementById('burst');
  var sparkles = document.getElementById('sparkles');

  var runToken = 0;
  var voices = { jardissa:null, pioupiou:null };

  function buildSparkles(){
    sparkles.innerHTML = "";
    var n = 26;
    for (var i=0;i<n;i++){
      var d = document.createElement('div');
      d.className = 'spark';
      d.style.setProperty('--s', (2+Math.random()*4).toFixed(1)+'px');
      d.style.setProperty('--dur', (2.2+Math.random()*2.6).toFixed(2)+'s');
      d.style.setProperty('--delay', (Math.random()*3).toFixed(2)+'s');
      d.style.setProperty('--peak', (0.5+Math.random()*0.5).toFixed(2));
      d.style.left = (Math.random()*100).toFixed(1)+'%';
      d.style.top = (Math.random()*100).toFixed(1)+'%';
      sparkles.appendChild(d);
    }
  }
  buildSparkles();

  function pickVoices(){
    var list = speechSynthesis.getVoices ? speechSynthesis.getVoices() : [];
    var fr = list.filter(function(v){ return /fr/i.test(v.lang); });
    var female = fr.filter(function(v){ return /female|amelie|audrey|marie|virginie|celine|julie/i.test(v.name); });
    voices.jardissa = female[0] || fr[0] || list[0] || null;
    voices.pioupiou = voices.jardissa;
  }
  if ('speechSynthesis' in window){
    pickVoices();
    speechSynthesis.onvoiceschanged = pickVoices;
  }

  function speak(text, speaker){
    return new Promise(function(resolve){
      if (!('speechSynthesis' in window)){ resolve(); return; }
      try{
        speechSynthesis.cancel();
        var u = new SpeechSynthesisUtterance(text);
        u.lang = 'fr-FR';
        var v = voices[speaker];
        if (v) u.voice = v;
        if (speaker === 'pioupiou'){ u.rate = 1.2; u.pitch = 1.85; }
        else { u.rate = 1.02; u.pitch = 1.08; }
        var done = false;
        var finish = function(){ if(!done){ done=true; resolve(); } };
        u.onend = finish;
        u.onerror = finish;
        speechSynthesis.speak(u);
        setTimeout(finish, Math.max(2600, text.length*90));
      }catch(e){ resolve(); }
    });
  }

  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

  function typeInto(el, text, speed){
    return new Promise(function(resolve){
      el.innerHTML = '';
      var i = 0;
      var cursor = document.createElement('span');
      cursor.className = 'cursor';
      function step(){
        if (i <= text.length){
          el.textContent = text.slice(0, i);
          el.appendChild(cursor);
          i++;
          setTimeout(step, speed);
        } else {
          resolve();
        }
      }
      step();
    });
  }

  function swapShot(){
    var showHero = !charHero.classList.contains('showing');
    charHero.classList.toggle('showing', showHero);
    charAvatar.classList.toggle('showing', !showHero);
  }

  function showBubble(text, speaker){
    captions.textContent = text;
    tagJardissa.classList.toggle('on', speaker === 'jardissa');
    tagPioupiou.classList.toggle('on', speaker === 'pioupiou');
    jardissaWrap.classList.toggle('talking', speaker === 'jardissa');
    bubble.classList.add('on');
    return typeInto(bubbleText, text, 22);
  }
  function hideBubble(){
    bubble.classList.remove('on');
    tagJardissa.classList.remove('on');
    tagPioupiou.classList.remove('on');
  }

  function fireBurst(){
    burst.innerHTML = '';
    var n = 18;
    for (var i=0;i<n;i++){
      var s = document.createElement('i');
      var ang = Math.random()*Math.PI*2;
      var dist = 70 + Math.random()*90;
      s.style.setProperty('--dx', (Math.cos(ang)*dist).toFixed(0)+'px');
      s.style.setProperty('--dy', (Math.sin(ang)*dist).toFixed(0)+'px');
      s.style.setProperty('--rot', (Math.random()*360).toFixed(0)+'deg');
      s.style.animationDelay = (Math.random()*0.15).toFixed(2)+'s';
      burst.appendChild(s);
    }
    burst.classList.add('go');
    setTimeout(function(){ burst.classList.remove('go'); }, 1100);
  }

  async function playSequence(){
    runToken++;
    var myToken = runToken;
    if ('speechSynthesis' in window){ try{ speechSynthesis.cancel(); }catch(e){} }

    finale.classList.remove('on');
    finaleActions.classList.remove('on');
    finaleLogo.classList.remove('pop');
    slogan.textContent = '';
    duoRig.classList.remove('hide');
    jardissaWrap.classList.remove('frozen');
    charHero.classList.add('showing');
    charAvatar.classList.remove('showing');
    pioupiouSlot.classList.remove('perched','presenting');
    pioupiouSlot.classList.add('dancing');
    diamondGem.classList.remove('shine');
    captions.textContent = '';
    hideBubble();

    await wait(500);
    if (myToken !== runToken) return;

    for (var i=0;i<LINES.length;i++){
      var item = LINES[i];
      if (item.speaker === 'jardissa') swapShot();

      if (item.hop){
        pioupiouSlot.classList.remove('dancing');
        pioupiouSlot.classList.add('perched');
        await wait(650);
        if (myToken !== runToken) return;
        pioupiouSlot.classList.add('presenting');
        diamondGem.classList.add('shine');
      }

      var shown = showBubble(item.text, item.speaker);
      var spoken = speak(item.text, item.speaker);
      await shown;
      if (myToken !== runToken) return;
      await spoken;
      if (myToken !== runToken) return;
      hideBubble();
      await wait(180);
      if (myToken !== runToken) return;
    }

    captions.textContent = '';
    jardissaWrap.classList.add('frozen');
    fireBurst();
    await wait(400);
    if (myToken !== runToken) return;

    duoRig.classList.add('hide');
    await wait(400);
    if (myToken !== runToken) return;

    finale.classList.add('on');
    var sloganDone = typeInto(slogan, SLOGAN, 36);
    var sloganSpoken = speak(SLOGAN, 'jardissa');
    await sloganDone;
    if (myToken !== runToken) return;
    finaleLogo.classList.add('pop');
    await wait(200);
    if (myToken !== runToken) return;
    finaleActions.classList.add('on');
    await sloganSpoken;
  }

  btnStart.addEventListener('click', function(){
    startOverlay.classList.add('hide');
    soundTag.classList.add('on');
    if (!('speechSynthesis' in window)){
      soundTagText.textContent = 'Sous-titres (pas de voix ici)';
    }
    playSequence();
  });

  btnReplay.addEventListener('click', function(){
    playSequence();
  });

  btnDiscover.addEventListener('click', function(){
    window.open('https://star-entreprise.netlify.app', '_blank', 'noopener');
  });
})();
</script>
