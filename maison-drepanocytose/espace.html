<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Espace équipe — La Maison de la Drépanocytose</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#132248; --navy-deep:#0B1730; --gold:#C79A45; --gold-deep:#8C6A22;
  --red:#B3202C; --teal:#3E9E92; --cream:#FBF8F3; --white:#FFFFFF;
  --ink:#231F1A; --ink-soft:#5B564E; --ink-faint:#8B8577; --line:#E7DFD2;
  --serif:'Fraunces',Georgia,serif; --sans:'Manrope',system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:var(--cream);min-height:100vh}
h1,h2,h3{font-family:var(--serif);color:var(--navy)}

/* ---- login ---- */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(160deg,var(--navy),var(--navy-deep))}
.login-card{width:100%;max-width:400px;background:var(--white);border-radius:22px;padding:32px 26px;box-shadow:0 30px 60px rgba(0,0,0,.3)}
.login-card h1{font-size:19px;margin-bottom:4px}
.login-card .sub{font-size:12.5px;color:var(--ink-soft);margin-bottom:22px}
.login-error{background:#FBE6E2;border:1px solid #E7B4AA;color:var(--red);border-radius:10px;padding:10px 12px;font-size:12.5px;margin-bottom:16px}
label{display:block;font-size:12px;color:var(--ink-soft);font-weight:600;margin:14px 0 6px}
input{width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--cream);font-size:14px;font-family:var(--sans);color:var(--ink)}
input:focus{outline:none;border-color:var(--gold)}
.field-row{position:relative}
.field-row input{padding-right:66px}
.toggle-eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:var(--white);border:1px solid var(--line);border-radius:7px;color:var(--gold-deep);font-size:11px;padding:6px 10px;cursor:pointer;font-weight:700}
button{cursor:pointer;border:0;font-family:var(--sans)}
.btn-gold{width:100%;margin-top:22px;padding:13px;border-radius:12px;background:linear-gradient(135deg,#E3C377,var(--gold));color:#2a1c02;font-weight:800;font-size:14px}
.btn-gold:disabled{opacity:.6}

/* ---- app shell ---- */
.app{display:none;min-height:100vh}
.topbar{background:var(--navy);color:var(--white);padding:16px 22px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.topbar h1{color:var(--white);font-size:18px}
.topbar .who{font-size:12px;color:#C9D2E8}
.logout-btn{background:rgba(255,255,255,.12);color:var(--white);padding:8px 16px;border-radius:100px;font-size:12.5px;font-weight:700}
.wrap{max-width:900px;margin:0 auto;padding:28px 20px 60px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap}
.count{font-size:13px;color:var(--ink-soft)}
.btn-new{background:var(--navy);color:var(--white);padding:11px 20px;border-radius:100px;font-size:13.5px;font-weight:700}

.card-form{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:22px;display:none}
.card-form.show{display:block}
.card-form h3{font-size:16px;margin-bottom:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 16px}
@media (max-width:560px){.grid2{grid-template-columns:1fr}}
.form-actions{display:flex;gap:10px;margin-top:18px}
.btn-save{background:var(--navy);color:var(--white);padding:11px 22px;border-radius:100px;font-size:13.5px;font-weight:700}
.btn-cancel{background:var(--cream);color:var(--ink-soft);padding:11px 22px;border-radius:100px;font-size:13.5px;font-weight:700;border:1px solid var(--line)}

.list{display:flex;flex-direction:column;gap:10px}
.item{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.item .info b{font-size:15px;color:var(--navy)}
.item .info .meta{font-size:12px;color:var(--ink-faint);margin-top:2px}
.item .info .notes{font-size:12.5px;color:var(--ink-soft);margin-top:6px;max-width:52ch}
.item .actions{display:flex;gap:8px}
.icon-btn{background:var(--cream);border:1px solid var(--line);border-radius:9px;padding:7px 11px;font-size:12px;color:var(--ink-soft);font-weight:700}
.icon-btn.danger{color:var(--red)}
.badge{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.02em;text-transform:uppercase;background:var(--gold-pale,#F3ECD9);color:var(--gold-deep);padding:3px 9px;border-radius:100px;margin-bottom:4px}

.empty{text-align:center;padding:60px 20px;color:var(--ink-faint)}
.empty .ic{font-size:38px;margin-bottom:10px}
</style>
</head>
<body>

<div id="authRoot"></div>

<div class="app" id="app">
  <div class="topbar">
    <h1>🏠 Espace équipe — Drépanocytose</h1>
    <div style="display:flex;align-items:center;gap:14px">
      <span class="who" id="whoLabel"></span>
      <button class="logout-btn" id="logoutBtn">Déconnexion</button>
    </div>
  </div>
  <div class="wrap">
    <div class="toolbar">
      <span class="count" id="countLabel">0 fiche</span>
      <button class="btn-new" id="newBtn">+ Nouvelle fiche</button>
    </div>

    <div class="card-form" id="formCard">
      <h3 id="formTitle">Nouvelle fiche</h3>
      <input type="hidden" id="fId">
      <div class="grid2">
        <div><label>Nom</label><input id="fNom"></div>
        <div><label>Prénom</label><input id="fPrenom"></div>
      </div>
      <div class="grid2">
        <div><label>Type</label>
          <select id="fType" style="width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--cream);font-size:14px;font-family:var(--sans);color:var(--ink)">
            <option value="famille">Famille</option>
            <option value="patient">Patient</option>
            <option value="benevole">Bénévole</option>
          </select>
        </div>
        <div><label>Téléphone</label><input id="fTelephone"></div>
      </div>
      <label>Ville</label><input id="fVille">
      <label>Notes de suivi</label>
      <textarea id="fNotes" rows="3" style="width:100%;padding:11px 13px;border-radius:10px;border:1.5px solid var(--line);background:var(--cream);font-size:14px;font-family:var(--sans);color:var(--ink);resize:vertical"></textarea>
      <div class="form-actions">
        <button class="btn-save" id="saveBtn">Enregistrer</button>
        <button class="btn-cancel" id="cancelBtn">Annuler</button>
      </div>
    </div>

    <div id="listRoot"></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var AUTH_KEY = "so_auth_v1";
  var authRoot = document.getElementById("authRoot");
  var appEl = document.getElementById("app");
  var listRoot = document.getElementById("listRoot");
  var countLabel = document.getElementById("countLabel");
  var formCard = document.getElementById("formCard");
  var formTitle = document.getElementById("formTitle");
  var state = { items: [] };

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]; }); }

  function getAuth(){ try { return JSON.parse(localStorage.getItem(AUTH_KEY)); } catch(e){ return null; } }
  function setAuth(d){ try { localStorage.setItem(AUTH_KEY, JSON.stringify(d)); } catch(e){} }
  function clearAuth(){ try { localStorage.removeItem(AUTH_KEY); } catch(e){} }

  function api(path, opts){
    opts = opts || {};
    var auth = getAuth();
    var headers = Object.assign({ "content-type": "application/json" }, opts.headers || {});
    if (auth && auth.token) headers["authorization"] = "Bearer " + auth.token;
    return fetch(path, Object.assign({}, opts, { headers: headers }))
      .then(function(r){
        if (r.status === 401) { clearAuth(); boot(); return Promise.reject("unauth"); }
        return r.json().then(function(data){ return { ok: r.ok, data: data }; });
      });
  }

  function renderLogin(errorMsg){
    appEl.style.display = "none";
    authRoot.innerHTML =
      '<div class="login-wrap"><div class="login-card">' +
        '<h1>🏠 Espace équipe</h1><p class="sub">La Maison de la Drépanocytose — identifiant STAR ENTREPRISE.</p>' +
        (errorMsg ? '<div class="login-error">' + esc(errorMsg) + '</div>' : '') +
        '<label>Identifiant</label><input id="lUser" autocomplete="username">' +
        '<label>Mot de passe</label>' +
        '<div class="field-row"><input type="password" id="lPass" autocomplete="current-password"><button type="button" class="toggle-eye" id="lToggle">Afficher</button></div>' +
        '<button class="btn-gold" id="lSubmit">Se connecter</button>' +
      '</div></div>';

    var u = document.getElementById("lUser"), p = document.getElementById("lPass"), btn = document.getElementById("lSubmit");
    document.getElementById("lToggle").addEventListener("click", function(){
      var showing = p.type === "text"; p.type = showing ? "password" : "text";
      this.textContent = showing ? "Afficher" : "Cacher";
    });
    function doLogin(){
      var username = u.value.trim(), password = p.value;
      if (!username || !password) return;
      btn.disabled = true; btn.textContent = "Connexion...";
      fetch("/api/auth", { method:"POST", headers:{"content-type":"application/json"}, body: JSON.stringify({action:"login",username:username,password:password}) })
        .then(function(r){ return r.json().then(function(data){ return {ok:r.ok,data:data}; }); })
        .then(function(res){
          if (!res.ok) { renderLogin(res.data.error || "Connexion impossible."); return; }
          setAuth({ token: res.data.token, account: res.data.account });
          boot();
        })
        .catch(function(){ renderLogin("Connexion impossible — vérifiez votre connexion internet."); });
    }
    btn.addEventListener("click", doLogin);
    [u,p].forEach(function(el){ el.addEventListener("keydown", function(e){ if (e.key === "Enter") doLogin(); }); });
    u.focus();
  }

  function labelType(t){
    return t === "patient" ? "Patient" : t === "benevole" ? "Bénévole" : "Famille";
  }

  function renderList(){
    if (!state.items.length) {
      listRoot.innerHTML = '<div class="empty"><div class="ic">🕊️</div><div>Aucune fiche pour le moment.</div></div>';
      return;
    }
    listRoot.innerHTML = '<div class="list">' + state.items.map(function(it){
      return '<div class="item" data-id="' + it.id + '">' +
        '<div class="info"><span class="badge">' + esc(labelType(it.type)) + '</span><br>' +
        '<b>' + esc(it.prenom) + ' ' + esc(it.nom) + '</b>' +
        '<div class="meta">' + [it.ville, it.telephone].filter(Boolean).map(esc).join(" · ") + '</div>' +
        (it.notes ? '<div class="notes">' + esc(it.notes) + '</div>' : '') +
        '</div>' +
        '<div class="actions"><button class="icon-btn" data-act="edit">Modifier</button><button class="icon-btn danger" data-act="del">Supprimer</button></div>' +
      '</div>';
    }).join("") + '</div>';

    listRoot.querySelectorAll(".item").forEach(function(el){
      var id = el.getAttribute("data-id");
      var item = state.items.filter(function(i){ return i.id === id; })[0];
      el.querySelector('[data-act="edit"]').addEventListener("click", function(){ openForm(item); });
      el.querySelector('[data-act="del"]').addEventListener("click", function(){
        if (!confirm("Supprimer la fiche de " + item.prenom + " " + item.nom + " ?")) return;
        api("/api/drepano?id=" + item.id, { method:"DELETE" }).then(function(res){ if (res.ok) loadItems(); });
      });
    });
  }

  function openForm(item){
    formTitle.textContent = item ? "Modifier la fiche" : "Nouvelle fiche";
    document.getElementById("fId").value = item ? item.id : "";
    document.getElementById("fNom").value = item ? item.nom : "";
    document.getElementById("fPrenom").value = item ? item.prenom : "";
    document.getElementById("fType").value = item ? item.type : "famille";
    document.getElementById("fTelephone").value = item ? item.telephone : "";
    document.getElementById("fVille").value = item ? item.ville : "";
    document.getElementById("fNotes").value = item ? item.notes : "";
    formCard.classList.add("show");
    document.getElementById("fNom").focus();
  }
  function closeForm(){ formCard.classList.remove("show"); }

  document.getElementById("newBtn").addEventListener("click", function(){ openForm(null); });
  document.getElementById("cancelBtn").addEventListener("click", closeForm);
  document.getElementById("saveBtn").addEventListener("click", function(){
    var id = document.getElementById("fId").value;
    var body = {
      nom: document.getElementById("fNom").value.trim(),
      prenom: document.getElementById("fPrenom").value.trim(),
      type: document.getElementById("fType").value,
      telephone: document.getElementById("fTelephone").value.trim(),
      ville: document.getElementById("fVille").value.trim(),
      notes: document.getElementById("fNotes").value.trim()
    };
    if (!body.nom || !body.prenom) { alert("Nom et prénom requis."); return; }
    var req = id
      ? api("/api/drepano", { method:"PUT", body: JSON.stringify(Object.assign({id:id}, body)) })
      : api("/api/drepano", { method:"POST", body: JSON.stringify(body) });
    req.then(function(res){
      if (!res.ok) { alert(res.data.error || "Erreur."); return; }
      closeForm(); loadItems();
    });
  });

  document.getElementById("logoutBtn").addEventListener("click", function(){ clearAuth(); boot(); });

  function loadItems(){
    api("/api/drepano").then(function(res){
      if (!res.ok) return;
      state.items = res.data.beneficiaires || [];
      countLabel.textContent = state.items.length + (state.items.length > 1 ? " fiches" : " fiche");
      renderList();
    }).catch(function(){});
  }

  function boot(){
    var auth = getAuth();
    if (!auth || !auth.token) { renderLogin(); return; }
    authRoot.innerHTML = "";
    appEl.style.display = "block";
    document.getElementById("whoLabel").textContent = auth.account ? auth.account.displayName : "";
    loadItems();
  }

  boot();
})();
</script>
</body>
</html>
