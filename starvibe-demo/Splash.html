<!doctype html>
<html>
<head>
  <meta charset="utf-8">
</head>
<body>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@500;600&display=swap" rel="stylesheet"></noscript>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    @keyframes sv-pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    @keyframes sv-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes sv-shine-sweep {
      0%, 15% { transform: translateX(-350%) skewX(-16deg); }
      55%, 100% { transform: translateX(350%) skewX(-16deg); }
    }
    .sv-shine { position: relative; overflow: hidden; }
    .sv-shine::after {
      content: ""; position: absolute; top: 0; left: 0; width: 60%; height: 100%; pointer-events: none;
      background: linear-gradient(115deg, transparent 0%, rgba(255,226,163,.4) 45%, rgba(255,255,255,.95) 50%, rgba(255,226,163,.4) 55%, transparent 100%);
      animation: sv-shine-sweep 3.6s ease-in-out infinite;
    }
  </style>
</helmet>

<div style="width:390px;height:844px;background:radial-gradient(620px 480px at 50% 28%, rgba(217,169,60,.16), transparent 60%), #050B18;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Inter',sans-serif;border-radius:36px;cursor:pointer;" id="scr">

  <div class="sv-shine" style="width:132px;height:132px;border-radius:32px;filter:drop-shadow(0 18px 40px rgba(217,169,60,.3));animation:sv-pulse 3.4s ease-in-out infinite;">
    <img src="app-icon.png" alt="STAR VIBE" style="width:100%;height:100%;">
  </div>

  <div style="font-family:'Sora',sans-serif;font-weight:800;font-size:30px;letter-spacing:.02em;color:#fff;margin-top:26px;">STAR <span style="color:#F0CA6B;">VIBE</span></div>

  <div style="font-family:'Inter',sans-serif;font-weight:500;font-size:13px;color:rgba(255,255,255,.55);margin-top:10px;letter-spacing:.03em;">Filme. Partage. Vibre.</div>

  <div style="position:absolute;bottom:88px;left:0;right:0;display:flex;justify-content:center;">
    <div style="width:36px;height:36px;border:2.5px solid rgba(255,255,255,.18);border-top-color:#FF7A2E;border-radius:50%;animation:sv-spin 1s linear infinite;"></div>
  </div>

  <div style="position:absolute;bottom:22px;right:20px;display:flex;align-items:center;gap:7px;">
    <div style="text-align:right;">
      <div style="font-size:9.5px;color:rgba(255,255,255,.55);line-height:1.4;">Créé par Carry OTEMBA, PDG</div>
      <div style="font-size:9.5px;color:rgba(255,255,255,.75);font-weight:700;line-height:1.4;">STAR ENTREPRISE — Tous droits réservés</div>
    </div>
    <img src="star-logo.png" alt="STAR ENTREPRISE" style="width:22px;height:22px;flex:none;">
  </div>

</div>

<script>

document.getElementById('scr').addEventListener('click', function(){ parent.go('Promo'); });
setTimeout(function(){ parent.go('Promo'); }, 2400);

</script>
</body>
</html>
