<!doctype html>
<html>
<head>
  <meta charset="utf-8">
</head>
<body>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@500;600;700&display=swap" rel="stylesheet"></noscript>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    @keyframes sv-bin-bob { 0%, 100% { transform: translateY(0) rotate(-1deg); } 50% { transform: translateY(-8px) rotate(1deg); } }
    @keyframes sv-paper-fly {
      0% { transform: translate(-92px, -18px) rotate(-18deg); opacity: 0; }
      18% { opacity: 1; }
      70% { transform: translate(0, -70px) rotate(10deg); opacity: 1; }
      100% { transform: translate(6px, -6px) rotate(35deg); opacity: 0; }
    }
    @keyframes sv-star-pop { 0%, 100% { transform: scale(1) rotate(0deg); } 50% { transform: scale(1.18) rotate(8deg); } }
    @keyframes sv-shine-sweep {
      0%, 15% { transform: translateX(-350%) skewX(-16deg); }
      55%, 100% { transform: translateX(350%) skewX(-16deg); }
    }
    .sv-shine { position: relative; overflow: hidden; }
    .sv-shine::after {
      content: ""; position: absolute; top: 0; left: 0; width: 60%; height: 100%; pointer-events: none;
      background: linear-gradient(115deg, transparent 0%, rgba(255,226,163,.4) 45%, rgba(255,255,255,.95) 50%, rgba(255,226,163,.4) 55%, transparent 100%);
      animation: sv-shine-sweep 3.6s ease-in-out infinite;
    }
  </style>
</helmet>

<div style="width:390px;height:844px;background:linear-gradient(180deg,#EAF6EF 0%,#FFF9EC 45%);position:relative;overflow:hidden;font-family:'Inter',sans-serif;border-radius:36px;">

  <div style="display:flex;justify-content:space-between;align-items:center;padding:48px 20px 0;">
    <svg style="width:21px;height:21px;" viewBox="0 0 24 24" fill="none" stroke="#12213F" stroke-width="2.4" style="cursor:pointer;" id="btnBack"><path d="M19 12H5m0 0 7 7m-7-7 7-7"/></svg>
    <div style="display:flex;gap:5px;">
      <div style="width:26px;height:5px;border-radius:3px;background:#1C8A6B;"></div>
      <div style="width:26px;height:5px;border-radius:3px;background:#1C8A6B;"></div>
      <div style="width:26px;height:5px;border-radius:3px;background:#E0DCCB;"></div>
    </div>
    <span style="width:21px;"></span>
  </div>

  <div style="text-align:center;padding:16px 30px 0;">
    <div style="font-family:'Sora',sans-serif;font-weight:800;font-size:20px;color:#12213F;">Rue propre</div>
    <div style="font-size:12.5px;color:#6B7488;margin-top:6px;line-height:1.5;">Zora jette son papier à la poubelle, jamais par terre.</div>
  </div>

  <div style="position:relative;height:280px;margin-top:10px;">

    <svg style="position:absolute;left:130px;top:60px;width:34px;height:34px;animation:sv-paper-fly 2.4s ease-in-out infinite;" viewBox="0 0 24 24">
      <rect x="4" y="3" width="16" height="18" rx="2" fill="#FFFFFF" stroke="#D9A93C" stroke-width="1.6"/>
      <line x1="7.5" y1="8" x2="16.5" y2="8" stroke="#D9A93C" stroke-width="1.4"/>
      <line x1="7.5" y1="12" x2="16.5" y2="12" stroke="#D9A93C" stroke-width="1.4"/>
      <line x1="7.5" y1="16" x2="13" y2="16" stroke="#D9A93C" stroke-width="1.4"/>
    </svg>

    <svg style="position:absolute;left:70px;top:44px;width:180px;height:110px;" viewBox="0 0 180 110">
      <path d="M20 90 Q90 -10 165 60" fill="none" stroke="#C7DED0" stroke-width="3" stroke-dasharray="7 8" stroke-linecap="round"/>
    </svg>

    <div style="position:absolute;left:50%;bottom:18px;transform:translateX(-50%);width:150px;animation:sv-bin-bob 2.8s ease-in-out infinite;">
      <svg viewBox="0 0 160 190" style="width:100%;">
        <ellipse cx="80" cy="182" rx="52" ry="8" fill="rgba(18,33,63,.12)"/>
        <path d="M40 60h80l-9 108a10 10 0 0 1-10 9H59a10 10 0 0 1-10-9L40 60Z" fill="#1C8A6B"/>
        <path d="M40 60h80l-9 108a10 10 0 0 1-10 9H90V60Z" fill="#177A5D"/>
        <rect x="30" y="42" width="100" height="20" rx="8" fill="#22A67D"/>
        <rect x="55" y="24" width="50" height="16" rx="7" fill="#22A67D"/>
        <circle cx="60" cy="96" r="10" fill="#fff"/>
        <circle cx="63" cy="93" r="4" fill="#12213F"/>
        <circle cx="100" cy="96" r="10" fill="#fff"/>
        <circle cx="103" cy="93" r="4" fill="#12213F"/>
        <path d="M62 122q18 16 36 0" fill="none" stroke="#12213F" stroke-width="4" stroke-linecap="round"/>
        <rect x="50" y="70" width="15" height="40" rx="4" fill="rgba(255,255,255,.18)"/>
      </svg>
    </div>

    <svg style="position:absolute;left:44px;top:24px;width:26px;height:26px;animation:sv-star-pop 1.8s ease-in-out infinite;" viewBox="0 0 24 24" fill="#F0CA6B"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 6.9L12 17.3 5.7 20.8l1.7-6.9L2 9.2l7.1-.6z"/></svg>
    <svg style="position:absolute;right:40px;top:52px;width:18px;height:18px;animation:sv-star-pop 1.8s ease-in-out infinite;animation-delay:.5s;" viewBox="0 0 24 24" fill="#FF7A2E"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 6.9L12 17.3 5.7 20.8l1.7-6.9L2 9.2l7.1-.6z"/></svg>

  </div>

  <div style="margin:6px 24px 0;background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 10px 24px -14px rgba(18,33,63,.25);display:flex;align-items:center;gap:12px;">
    <div style="width:38px;height:38px;border-radius:10px;background:#FBF3E1;display:flex;align-items:center;justify-content:center;flex:none;">
      <svg style="width:20px;height:20px;" viewBox="0 0 24 24" fill="none" stroke="#D9A93C" stroke-width="2.2"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.7 6.9L12 17.3 5.7 20.8l1.7-6.9L2 9.2l7.1-.6z"/></svg>
    </div>
    <div>
      <div style="font-family:'Sora',sans-serif;font-weight:800;font-size:13.5px;color:#12213F;">Bravo Divine ! +10 étoiles</div>
      <div style="font-size:11px;color:#6B7488;margin-top:2px;">La rue reste propre grâce à toi.</div>
    </div>
  </div>

  <div style="position:absolute;bottom:68px;left:24px;right:24px;">
    <div class="sv-shine" style="background:linear-gradient(135deg,#1C8A6B,#22A67D);border-radius:14px;padding:15px 0;text-align:center;font-family:'Sora',sans-serif;font-weight:800;font-size:14px;color:#fff;cursor:pointer;" id="btnNext">Leçon suivante</div>
  </div>

  <div style="position:absolute;bottom:18px;right:20px;display:flex;align-items:center;gap:6px;">
    <div style="text-align:right;">
      <div style="font-size:9px;color:#98A0B3;line-height:1.35;">Créé par Carry OTEMBA, PDG</div>
      <div style="font-size:9px;color:#5A6377;font-weight:700;line-height:1.35;">STAR ENTREPRISE — Tous droits réservés</div>
    </div>
    <img src="star-logo.png" alt="STAR ENTREPRISE" style="width:18px;height:18px;flex:none;">
  </div>

</div>

<script>

document.getElementById('btnBack').onclick = function(){ parent.go('KidsHome'); };
document.getElementById('btnNext').onclick = function(){
  parent.toast('Bravo ! +10 etoiles');
  setTimeout(function(){ parent.go('KidsHome'); }, 700);
};

</script>
</body>
</html>
