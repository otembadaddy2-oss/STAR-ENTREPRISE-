<!doctype html>
<html>
<head>
  <meta charset="utf-8">
</head>
<body>
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=Sora:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; }
    a { color: #12213F; }
    @keyframes sv-shine-sweep {
      0%, 15% { transform: translateX(-350%) skewX(-16deg); }
      55%, 100% { transform: translateX(350%) skewX(-16deg); }
    }
    .sv-shine { position: relative; overflow: hidden; }
    .sv-shine::after {
      content: ""; position: absolute; top: 0; left: 0; width: 60%; height: 100%; pointer-events: none;
      background: linear-gradient(115deg, transparent 0%, rgba(255,226,163,.35) 45%, rgba(255,255,255,.85) 50%, rgba(255,226,163,.35) 55%, transparent 100%);
      animation: sv-shine-sweep 3.6s ease-in-out infinite;
    }
  </style>
</helmet>

<div style="width:390px;height:844px;background:#FAF7F1;position:relative;overflow:hidden;font-family:'Inter',sans-serif;border-radius:36px;">

  <div style="display:flex;justify-content:space-between;align-items:center;padding:52px 20px 0;">
    <span style="font-family:'Sora',sans-serif;font-weight:800;font-size:16px;color:#12213F;">@nathan_kdb</span>
    <svg style="width:22px;height:22px;" viewBox="0 0 24 24" fill="none" stroke="#12213F" stroke-width="2.1" style="cursor:pointer;" id="btnMenu"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>
  </div>

  <div style="display:flex;flex-direction:column;align-items:center;padding:18px 20px 0;">
    <div style="width:82px;height:82px;border-radius:50%;overflow:hidden;border:3px solid #D9A93C;">
      <img src="feed-creator.jpg" alt="" style="width:100%;height:100%;object-fit:cover;object-position:center 12%;">
    </div>
    <div style="font-family:'Sora',sans-serif;font-weight:700;font-size:15px;color:#12213F;margin-top:10px;">Nathan Kimbou</div>
    <div style="font-size:12px;color:#6B7488;margin-top:3px;">Brazzaville, Congo</div>

    <div style="display:flex;gap:30px;margin-top:16px;">
      <div style="text-align:center;">
        <div style="font-family:'Sora',sans-serif;font-weight:800;font-size:16px;color:#12213F;">214</div>
        <div style="font-size:10.5px;color:#6B7488;margin-top:2px;">Publications</div>
      </div>
      <div style="text-align:center;">
        <div style="font-family:'Sora',sans-serif;font-weight:800;font-size:16px;color:#12213F;">18,4 K</div>
        <div style="font-size:10.5px;color:#6B7488;margin-top:2px;">Abonnés</div>
      </div>
      <div style="text-align:center;">
        <div style="font-family:'Sora',sans-serif;font-weight:800;font-size:16px;color:#12213F;">312</div>
        <div style="font-size:10.5px;color:#6B7488;margin-top:2px;">Abonnements</div>
      </div>
    </div>

    <div style="display:flex;gap:10px;margin-top:16px;width:100%;">
      <div style="flex:1;background:linear-gradient(135deg,#FF7A2E,#D9A93C);border-radius:10px;padding:10px 0;text-align:center;font-family:'Sora',sans-serif;font-weight:700;font-size:12.5px;color:#fff;cursor:pointer;" id="btnEdit">Modifier le profil</div>
      <div style="width:40px;height:40px;border:1.5px solid #E4DECF;border-radius:10px;display:flex;align-items:center;justify-content:center;background:#fff;">
        <svg style="width:18px;height:18px;" viewBox="0 0 24 24" fill="none" stroke="#12213F" stroke-width="2.1"><path d="M16 3H8a2 2 0 0 0-2 2v16l6-4 6 4V5a2 2 0 0 0-2-2z"/></svg>
      </div>
    </div>

    <div class="sv-shine" style="display:flex;align-items:center;gap:6px;margin-top:14px;background:#12213F;border-radius:10px;padding:9px 13px;width:100%;cursor:pointer;" id="btnPro">
      <svg style="width:15px;height:15px;flex:none;" viewBox="0 0 24 24" fill="none" stroke="#F0CA6B" stroke-width="2.1"><path d="M13 2 3 14h7l-1 8 10-12h-7z"/></svg>
      <span style="font-family:'Sora',sans-serif;font-weight:700;font-size:11.8px;color:#fff;">Passer en compte Pro — 2 000 FCFA</span>
      <span style="margin-left:auto;font-size:10px;color:rgba(255,255,255,.55);">5 publications</span>
    </div>
  </div>

  <div style="display:flex;border-bottom:1px solid #E4DECF;margin-top:20px;padding:0 20px;">
    <div style="flex:1;text-align:center;padding-bottom:10px;border-bottom:2px solid #12213F;">
      <svg style="width:18px;height:18px;" viewBox="0 0 24 24" fill="none" stroke="#12213F" stroke-width="2.2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    </div>
    <div style="flex:1;text-align:center;padding-bottom:10px;">
      <svg style="width:18px;height:18px;" viewBox="0 0 24 24" fill="none" stroke="#B7BECC" stroke-width="2.2"><path d="M12 21s-7.5-4.6-10-9.1C.5 8.8 2 5 6 5c2.2 0 3.7 1.3 4.5 2.6C11.3 6.3 12.8 5 15 5c4 0 5.5 3.8 4 6.9C19.5 16.4 12 21 12 21z"/></svg>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:2px;padding:2px 0;">
    <div style="height:120px;overflow:hidden;"><img src="feed-family.jpg" alt="" style="width:100%;height:100%;object-fit:cover;"></div>
    <div style="height:120px;overflow:hidden;"><img src="feed-creator.jpg" alt="" style="width:100%;height:100%;object-fit:cover;"></div>
    <div style="height:120px;overflow:hidden;"><img src="city-street.jpg" alt="" style="width:100%;height:100%;object-fit:cover;"></div>
    <div style="height:120px;overflow:hidden;"><img src="feed-family.jpg" alt="" style="width:100%;height:100%;object-fit:cover;object-position:center 60%;"></div>
    <div style="height:120px;overflow:hidden;"><img src="feed-creator.jpg" alt="" style="width:100%;height:100%;object-fit:cover;object-position:center 60%;"></div>
    <div style="height:120px;overflow:hidden;"><img src="city-street.jpg" alt="" style="width:100%;height:100%;object-fit:cover;object-position:center 70%;"></div>
  </div>

</div>

<script>

document.getElementById('btnMenu').onclick = function(){ parent.toast('Menu bientot disponible dans la version complete'); };
document.getElementById('btnEdit').onclick = function(){ parent.toast('Modification du profil bientot disponible'); };
document.getElementById('btnPro').onclick = function(){ parent.toast('Paiement Mobile Money bientot disponible'); };

</script>
</body>
</html>
