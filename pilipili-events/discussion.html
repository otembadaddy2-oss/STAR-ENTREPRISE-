<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Discussion — Pili-Pili Events</title>
<meta name="description" content="Échangez directement avec Pili-Pili Events — devis, questions, disponibilités.">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#B8935A">
<link rel="icon" href="assets/img/icons/favicon-96.png" type="image/png">
<link rel="apple-touch-icon" href="assets/img/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  --gold:#B8935A; --gold-deep:#8C6A34; --gold-pale:#F1E6D3;
  --coral:#D94F3D; --coral-soft:#FBE6E2;
  --ivory:#FBF8F3; --white:#FFFFFF;
  --ink:#231F1A; --ink-soft:#5B564E; --ink-faint:#8D877A; --line:#E7DFD2;
  --serif:'Playfair Display', Georgia, serif;
  --sans:'Montserrat', ui-sans-serif, system-ui, sans-serif;
  --glass-bg:rgba(255,255,255,.5); --glass-line:rgba(255,255,255,.65);
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:var(--sans); color:var(--ink); line-height:1.5; -webkit-font-smoothing:antialiased;
  background:
    radial-gradient(120% 90% at 8% 0%, rgba(184,147,90,.45), transparent 55%),
    radial-gradient(110% 90% at 100% 15%, rgba(217,79,61,.28), transparent 55%),
    radial-gradient(140% 100% at 50% 120%, rgba(184,147,90,.30), transparent 60%),
    linear-gradient(160deg, var(--ivory) 0%, var(--gold-pale) 100%);
  min-height:100vh; overflow-x:hidden; position:relative;
}
.floaties{position:fixed; inset:0; z-index:0; pointer-events:none; overflow:hidden;}
.floaties span{position:absolute; font-size:22px; opacity:.55; animation:float 6s ease-in-out infinite;}
.floaties span:nth-child(1){top:8%; left:6%; animation-delay:0s;}
.floaties span:nth-child(2){top:16%; right:10%; animation-delay:1.2s; font-size:16px;}
.floaties span:nth-child(3){bottom:22%; left:4%; animation-delay:2.1s; font-size:18px;}
.floaties span:nth-child(4){top:60%; right:6%; animation-delay:.6s;}
.floaties span:nth-child(5){bottom:10%; right:22%; animation-delay:1.8s; font-size:15px;}
@keyframes float{0%,100%{transform:translateY(0) rotate(0deg);} 50%{transform:translateY(-16px) rotate(6deg);}}

.glass{background:var(--glass-bg); border:1px solid var(--glass-line); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); box-shadow:0 8px 30px rgba(140,106,52,.12);}

/* ---- top bar ---- */
.topbar{position:sticky; top:0; z-index:30; display:flex; align-items:center; gap:12px; padding:14px 16px; border-radius:0 0 22px 22px;}
.topbar .back{width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; color:var(--ink); text-decoration:none; flex:none;}
.topbar .brand-logo{width:38px; height:38px; border-radius:10px; flex:none;}
.topbar h1{font-family:var(--serif); font-size:15.5px; font-weight:700; line-height:1.2; color:var(--ink);}
.topbar span.sub{display:block; font-size:11px; color:var(--gold-deep); font-weight:600;}
.topbar .count{margin-left:auto; font-size:11px; font-weight:700; color:var(--gold-deep); background:rgba(184,147,90,.16); padding:6px 12px; border-radius:100px; white-space:nowrap;}

/* ---- join overlay ---- */
.join-overlay{position:fixed; inset:0; z-index:50; display:flex; align-items:center; justify-content:center; padding:20px;
  background:rgba(92,68,30,.25); backdrop-filter:blur(6px);}
.join-overlay.hide{display:none;}
.join-card{width:100%; max-width:420px; border-radius:26px; padding:30px 26px; position:relative; overflow:hidden;}
.join-card::before{content:""; position:absolute; top:-70px; right:-60px; width:180px; height:180px; border-radius:50%;
  background:radial-gradient(circle, rgba(217,79,61,.3), transparent 70%);}
.join-logo{width:56px; height:56px; border-radius:14px; margin:0 auto 14px; display:block;}
.join-card h2{font-family:var(--serif); font-size:20px; text-align:center; margin-bottom:6px; color:var(--ink);}
.join-card p.sub{font-size:12.6px; color:var(--ink-soft); text-align:center; margin-bottom:22px; line-height:1.55;}
.field{margin-bottom:14px;}
.field label{display:block; font-size:11.5px; font-weight:700; color:var(--gold-deep); margin-bottom:6px; letter-spacing:.02em;}
.field input{
  width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:rgba(255,255,255,.7);
  color:var(--ink); font-family:var(--sans); font-size:14px; outline:none;
}
.field input::placeholder{color:var(--ink-faint);}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}
.join-hint{font-size:11px; color:var(--ink-faint); margin:-6px 0 16px;}
.btn{display:inline-flex; align-items:center; justify-content:center; gap:9px; padding:14px 22px; border-radius:14px; font-size:14.5px; font-weight:700; text-decoration:none; border:0; cursor:pointer; width:100%;}
.btn-gold{background:linear-gradient(135deg, var(--gold), var(--gold-deep)); color:#fff; box-shadow:0 10px 26px rgba(140,106,52,.35);}
.btn-gold:disabled{opacity:.5; cursor:not-allowed;}
.join-error{font-size:12px; color:#a8321f; text-align:center; margin-top:10px; min-height:14px;}
.admin-toggle{display:flex; align-items:center; justify-content:center; gap:7px; font-size:12px; font-weight:700; color:var(--gold-deep); margin-bottom:16px; background:none; border:0; cursor:pointer; width:100%; padding:6px;}
.admin-box{display:none; margin-bottom:6px;}
.admin-box.show{display:block;}

/* ---- chat ---- */
.chat-wrap{max-width:640px; margin:0 auto; padding:14px 12px 130px; position:relative; z-index:1;}
.chat-empty{text-align:center; padding:60px 20px; color:var(--ink-soft); font-size:13.5px;}
.msg{display:flex; gap:10px; margin-bottom:16px; align-items:flex-end;}
.msg.me{flex-direction:row-reverse;}
.avatar{width:38px; height:38px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center;
  font-family:var(--serif); font-weight:700; font-size:14px; color:#fff; box-shadow:0 4px 10px rgba(0,0,0,.18);}
.msg-body{max-width:76%;}
.msg-meta{display:flex; align-items:center; gap:7px; margin-bottom:5px; font-size:11px; color:var(--ink-soft);}
.msg.me .msg-meta{flex-direction:row-reverse;}
.badge{font-size:9.5px; font-weight:800; letter-spacing:.03em; padding:2.5px 8px; border-radius:100px; text-transform:uppercase; color:#fff;}
.bubble{border-radius:18px; padding:12px 15px; font-size:14px; line-height:1.5; position:relative; color:var(--ink);}
.msg:not(.me) .bubble{border-bottom-left-radius:5px;}
.msg.me .bubble{border-bottom-right-radius:5px; background:linear-gradient(135deg, rgba(217,79,61,.22), rgba(217,79,61,.1));}
.bubble time{display:block; font-size:9.5px; color:var(--ink-faint);}
.bubble-foot{display:flex; align-items:center; justify-content:flex-end; gap:8px; margin-top:5px;}
.msg-delete{width:20px; height:20px; border-radius:50%; border:0; background:rgba(140,106,52,.14); color:var(--gold-deep); display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none;}
.msg-delete:hover{background:rgba(217,79,61,.35); color:#fff;}
.msg-report{width:20px; height:20px; border-radius:50%; border:0; background:rgba(140,106,52,.14); color:var(--gold-deep); display:flex; align-items:center; justify-content:center; cursor:pointer; flex:none; opacity:.75;}
.msg-report:hover{background:rgba(217,79,61,.35); color:#fff; opacity:1;}
.voice-row{display:flex; align-items:center; gap:10px;}
.voice-play{width:32px; height:32px; border-radius:50%; background:rgba(140,106,52,.16); border:0; color:var(--gold-deep); flex:none; display:flex; align-items:center; justify-content:center; cursor:pointer;}
.voice-wave{flex:1; height:22px; display:flex; align-items:center; gap:2px;}
.voice-wave span{width:3px; border-radius:2px; background:rgba(140,106,52,.4); display:block;}

/* ---- composer ---- */
.composer{position:fixed; left:0; right:0; bottom:0; z-index:40; padding:12px 14px calc(14px + env(safe-area-inset-bottom));
  border-radius:22px 22px 0 0;}
.composer-inner{max-width:640px; margin:0 auto; display:flex; align-items:center; gap:9px;}
.composer input[type=text]{flex:1; padding:13px 16px; border-radius:100px; border:1px solid var(--line); background:rgba(255,255,255,.7);
  color:var(--ink); font-family:var(--sans); font-size:14.5px; outline:none;}
.composer input::placeholder{color:var(--ink-faint);}
.icon-btn{width:46px; height:46px; border-radius:50%; border:0; flex:none; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#fff;}
.send-btn{background:var(--gold-deep);}
.send-btn:disabled{opacity:.4;}
.mic-btn{background:rgba(140,106,52,.16); border:1px solid var(--glass-line); color:var(--gold-deep); position:relative; touch-action:none; user-select:none;}
.mic-btn.recording{background:var(--coral); color:#fff; animation:pulse 1s ease-in-out infinite;}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(217,79,61,.5);} 50%{box-shadow:0 0 0 14px rgba(217,79,61,0);}}
.rec-indicator{position:fixed; left:0; right:0; bottom:78px; z-index:41; display:flex; justify-content:center; pointer-events:none;}
.rec-indicator.hide{display:none;}
.rec-pill{background:rgba(217,79,61,.92); color:#fff; font-size:12.5px; font-weight:700; padding:8px 16px; border-radius:100px; display:flex; align-items:center; gap:8px;}
.rec-dot{width:8px; height:8px; border-radius:50%; background:#fff; animation:blink 1s infinite;}
@keyframes blink{50%{opacity:.2;}}
</style>
</head>
<body>

<div class="floaties" aria-hidden="true">
  <span>✨</span><span>🌸</span><span>🌟</span><span>💐</span><span>✨</span>
</div>

<header class="topbar glass">
  <a class="back" href="index.html" aria-label="Retour">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>
  </a>
  <img src="assets/img/logo.png" alt="" class="brand-logo">
  <div>
    <h1>Discussion</h1>
    <span class="sub">Devis · Questions · Disponibilités</span>
  </div>
  <span class="count" id="msgCount">0 message</span>
</header>

<main class="chat-wrap" id="chatWrap">
  <div class="chat-empty" id="chatEmpty">
    💬 Aucun message pour l'instant — écris-nous pour commencer !
  </div>
</main>

<div class="rec-indicator hide" id="recIndicator">
  <span class="rec-pill"><span class="rec-dot"></span> <span id="recTimer">0:00</span> — relâche pour envoyer</span>
</div>

<footer class="composer glass">
  <div class="composer-inner">
    <input type="text" id="textInput" placeholder="Écris ton message…" autocomplete="off">
    <button class="icon-btn send-btn" id="sendBtn" aria-label="Envoyer" disabled>
      <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
    </button>
    <button class="icon-btn mic-btn" id="micBtn" aria-label="Message vocal (maintenir pour parler)">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 003-3V6a3 3 0 10-6 0v6a3 3 0 003 3z"/><path d="M19 11a1 1 0 00-2 0 5 5 0 01-10 0 1 1 0 00-2 0 7 7 0 006 6.93V20H9a1 1 0 000 2h6a1 1 0 000-2h-2v-2.07A7 7 0 0019 11z"/></svg>
    </button>
  </div>
</footer>

<div class="join-overlay" id="joinOverlay">
  <div class="join-card glass">
    <img src="assets/img/logo.png" alt="" class="join-logo">
    <h2>Rejoindre la discussion</h2>
    <p class="sub">Écris directement à Pili-Pili Events — devis, disponibilités, questions.</p>

    <div class="field-row">
      <div class="field">
        <label>Prénom</label>
        <input type="text" id="fPrenom" placeholder="Prénom">
      </div>
      <div class="field">
        <label>Nom</label>
        <input type="text" id="fNom" placeholder="Nom">
      </div>
    </div>
    <div class="field">
      <label>Téléphone</label>
      <input type="tel" id="fTel" placeholder="+242 ...">
    </div>

    <button class="admin-toggle" id="adminToggle" type="button">🔑 Je suis Pili-Pili Events</button>
    <div class="admin-box" id="adminBox">
      <div class="field">
        <label>Code administratrice</label>
        <input type="password" id="fPass" placeholder="Code">
      </div>
    </div>

    <button class="btn btn-gold" id="joinBtn" disabled>Rejoindre la discussion</button>
    <div class="join-error" id="joinError"></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var ADMIN_CODE = 'pilipili2026';

  var ROLE_META = {
    'client': { label:'Client', color:'#D94F3D' },
    'admin':  { label:'Pili-Pili Events', color:'#8C6A34' }
  };

  var STORE_KEY = 'pilipili_discussion_identity';

  var SUPABASE_URL = 'https://jzrtiadzhwwdokskimpe.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_6u3qL18t8L5A0jsKfGb8DA_ogsMT9XW';
  var sb = null;
  try {
    if (window.supabase) sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  } catch(e){ sb = null; }

  function loadIdentity(){ try { return JSON.parse(localStorage.getItem(STORE_KEY)); } catch(e){ return null; } }
  function saveIdentity(id){ localStorage.setItem(STORE_KEY, JSON.stringify(id)); }

  function initials(prenom, nom){
    return ((prenom||'').charAt(0) + (nom||'').charAt(0)).toUpperCase() || '?';
  }

  // ---------- join flow ----------
  var joinOverlay = document.getElementById('joinOverlay');
  var fPrenom = document.getElementById('fPrenom');
  var fNom = document.getElementById('fNom');
  var fTel = document.getElementById('fTel');
  var fPass = document.getElementById('fPass');
  var adminToggle = document.getElementById('adminToggle');
  var adminBox = document.getElementById('adminBox');
  var joinBtn = document.getElementById('joinBtn');
  var joinError = document.getElementById('joinError');

  adminToggle.addEventListener('click', function(){
    adminBox.classList.toggle('show');
    validateJoin();
  });

  function validateJoin(){
    var ok = fPrenom.value.trim() && fNom.value.trim() && fTel.value.trim();
    joinBtn.disabled = !ok;
    return ok;
  }
  [fPrenom, fNom, fTel, fPass].forEach(function(el){
    el.addEventListener('input', validateJoin);
  });

  var identity = null;

  function enterChat(id){
    identity = id;
    joinOverlay.classList.add('hide');
    loadHistory();
    subscribeRealtime();
  }

  joinBtn.addEventListener('click', function(){
    if (!validateJoin()){
      joinError.textContent = 'Merci de remplir prénom, nom et téléphone.';
      return;
    }
    var role = 'client';
    if (adminBox.classList.contains('show')){
      if (fPass.value !== ADMIN_CODE){
        joinError.textContent = 'Code administratrice incorrect.';
        return;
      }
      role = 'admin';
    }
    var id = {
      prenom: fPrenom.value.trim(),
      nom: fNom.value.trim(),
      tel: fTel.value.trim(),
      role: role,
      id: 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2,8)
    };
    saveIdentity(id);
    enterChat(id);
  });

  var existing = loadIdentity();
  if (existing && existing.prenom){
    enterChat(existing);
  }

  // ---------- rendering ----------
  var chatWrap = document.getElementById('chatWrap');
  var chatEmpty = document.getElementById('chatEmpty');
  var msgCount = document.getElementById('msgCount');
  var msgTotal = 0;

  function fmtTime(ts){
    var d = new Date(ts);
    return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
  }

  function bumpCount(n){
    msgTotal += n;
    msgCount.textContent = msgTotal + (msgTotal > 1 ? ' messages' : ' message');
  }

  function loadHistory(){
    if (!sb){ chatEmpty.textContent = "Connexion impossible — vérifie ta connexion internet et recharge la page."; return; }
    chatEmpty.textContent = 'Chargement des messages…';
    sb.from('pilipili_messages').select('*').order('created_at', { ascending:true })
      .then(function(res){
        if (res.error){
          chatEmpty.textContent = "Connexion impossible — vérifie ta connexion internet.";
          return;
        }
        var rows = res.data || [];
        if (!rows.length){
          chatEmpty.textContent = "💬 Aucun message pour l'instant — écris-nous pour commencer !";
          return;
        }
        chatEmpty.style.display = 'none';
        rows.forEach(function(row){ appendMsgNode(rowToMsg(row)); });
        bumpCount(rows.length);
        window.scrollTo(0, document.body.scrollHeight);
      });
  }

  function subscribeRealtime(){
    if (!sb) return;
    sb.channel('pilipili-room')
      .on('postgres_changes', { event:'INSERT', schema:'public', table:'pilipili_messages' }, function(payload){
        chatEmpty.style.display = 'none';
        appendMsgNode(rowToMsg(payload.new));
        bumpCount(1);
        window.scrollTo(0, document.body.scrollHeight);
      })
      .on('postgres_changes', { event:'DELETE', schema:'public', table:'pilipili_messages' }, function(payload){
        removeMsgNode(payload.old.id);
      })
      .subscribe();
  }

  function rowToMsg(row){
    return {
      id: row.id, userId: row.user_id, prenom: row.prenom, nom: row.nom, role: row.role,
      type: row.type, text: row.body, audio: row.audio_url, ts: new Date(row.created_at).getTime()
    };
  }

  function removeMsgNode(id){
    var el = chatWrap.querySelector('[data-id="' + id + '"]');
    if (el) el.remove();
    if (msgTotal > 0) bumpCount(-1);
    if (!chatWrap.querySelector('.msg')) chatEmpty.style.display = 'block';
  }

  function deleteMessage(id){
    if (!sb || !confirm('Supprimer ce message ?')) return;
    sb.from('pilipili_messages').delete().eq('id', id).then(function(res){
      if (res.error){ alert('Suppression impossible — vérifie ta connexion internet.'); return; }
      removeMsgNode(id);
    });
  }

  function reportMessage(m){
    var senderName = m.role === 'admin' ? 'Pili-Pili Events' : ((m.prenom||'') + ' ' + (m.nom||''));
    var reason = prompt('Pourquoi signales-tu ce message ?');
    if (reason === null) return;
    var snippet = m.type === 'voice' ? '[message vocal]' : (m.text || '').slice(0, 200);
    var text = 'Signalement — Bulle Pili-Pili Events\nMessage de : ' + senderName +
      '\nContenu : ' + snippet + '\nRaison : ' + (reason || '(non précisée)');
    window.open('https://wa.me/242068700066?text=' + encodeURIComponent(text), '_blank');
  }

  function appendMsgNode(m){
    var meta = ROLE_META[m.role] || { label:m.role, color:'#8D877A' };
    var isMe = identity && m.userId === identity.id;
    var canDelete = isMe || (identity && identity.role === 'admin');
    var wrap = document.createElement('div');
    wrap.className = 'msg' + (isMe ? ' me' : '');
    wrap.dataset.id = m.id;

    var av = document.createElement('div');
    av.className = 'avatar';
    av.style.background = meta.color;
    av.textContent = initials(m.prenom, m.nom);
    wrap.appendChild(av);

    var body = document.createElement('div');
    body.className = 'msg-body';

    var metaRow = document.createElement('div');
    metaRow.className = 'msg-meta';
    var badge = document.createElement('span');
    badge.className = 'badge';
    badge.style.background = meta.color;
    badge.textContent = meta.label;
    var nameSpan = document.createElement('span');
    nameSpan.textContent = m.role === 'admin' ? 'Pili-Pili Events' : (m.prenom + ' ' + m.nom);
    metaRow.appendChild(nameSpan);
    metaRow.appendChild(badge);
    body.appendChild(metaRow);

    var bubble = document.createElement('div');
    bubble.className = 'bubble glass';

    if (m.type === 'voice'){
      var vr = document.createElement('div');
      vr.className = 'voice-row';
      var playBtn = document.createElement('button');
      playBtn.className = 'voice-play';
      playBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7L8 5Z"/></svg>';
      var audio = new Audio(m.audio);
      var playing = false;
      playBtn.addEventListener('click', function(){
        if (playing){ audio.pause(); return; }
        audio.currentTime = 0; audio.play(); playing = true;
        playBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>';
      });
      audio.addEventListener('ended', function(){
        playing = false;
        playBtn.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7L8 5Z"/></svg>';
      });
      var wave = document.createElement('div');
      wave.className = 'voice-wave';
      for (var i=0;i<22;i++){
        var bar = document.createElement('span');
        bar.style.height = (6 + Math.round(Math.random()*16)) + 'px';
        wave.appendChild(bar);
      }
      vr.appendChild(playBtn);
      vr.appendChild(wave);
      bubble.appendChild(vr);
    } else {
      var txt = document.createElement('span');
      txt.textContent = m.text;
      bubble.appendChild(txt);
    }

    var footRow = document.createElement('div');
    footRow.className = 'bubble-foot';
    if (!isMe){
      var reportBtn = document.createElement('button');
      reportBtn.className = 'msg-report';
      reportBtn.type = 'button';
      reportBtn.setAttribute('aria-label', 'Signaler');
      reportBtn.title = 'Signaler ce message';
      reportBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3v18h2v-7h8l1 2h5V5h-5l-1-2H5z"/></svg>';
      reportBtn.addEventListener('click', function(){ reportMessage(m); });
      footRow.appendChild(reportBtn);
    }
    if (canDelete){
      var delBtn = document.createElement('button');
      delBtn.className = 'msg-delete';
      delBtn.type = 'button';
      delBtn.setAttribute('aria-label', 'Supprimer');
      delBtn.innerHTML = '<svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><path d="M9 3a1 1 0 00-1 1v1H4v2h16V5h-4V4a1 1 0 00-1-1H9zM6 8l1 12a2 2 0 002 2h6a2 2 0 002-2l1-12H6z"/></svg>';
      delBtn.addEventListener('click', function(){ deleteMessage(m.id); });
      footRow.appendChild(delBtn);
    }
    var time = document.createElement('time');
    time.textContent = fmtTime(m.ts);
    footRow.appendChild(time);
    bubble.appendChild(footRow);

    body.appendChild(bubble);
    wrap.appendChild(body);
    chatWrap.appendChild(wrap);
  }

  function insertMessage(row){
    if (!sb) return Promise.resolve({ error:true });
    return sb.from('pilipili_messages').insert(row);
  }

  // ---------- text composer ----------
  var textInput = document.getElementById('textInput');
  var sendBtn = document.getElementById('sendBtn');
  textInput.addEventListener('input', function(){ sendBtn.disabled = !textInput.value.trim(); });
  function sendText(){
    var val = textInput.value.trim();
    if (!val || !identity) return;
    textInput.value = '';
    sendBtn.disabled = true;
    insertMessage({
      user_id: identity.id, prenom: identity.prenom, nom: identity.nom, role: identity.role,
      type:'text', body: val
    }).then(function(res){
      if (res.error){ alert("Message non envoyé — vérifie ta connexion internet."); }
    });
  }
  sendBtn.addEventListener('click', sendText);
  textInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') sendText(); });

  // ---------- voice composer (press & hold) ----------
  var micBtn = document.getElementById('micBtn');
  var recIndicator = document.getElementById('recIndicator');
  var recTimer = document.getElementById('recTimer');
  var mediaRecorder = null;
  var recChunks = [];
  var recStart = 0;
  var recInterval = null;
  var recStream = null;

  function fmtDur(sec){
    var m = Math.floor(sec/60), s = sec%60;
    return m + ':' + s.toString().padStart(2,'0');
  }

  function startRecording(){
    if (!identity){ return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      alert("L'enregistrement vocal n'est pas disponible sur ce navigateur.");
      return;
    }
    navigator.mediaDevices.getUserMedia({ audio:true }).then(function(stream){
      recStream = stream;
      recChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = function(e){ if (e.data.size > 0) recChunks.push(e.data); };
      mediaRecorder.onstop = function(){
        if (!sb){ alert("Connexion impossible — vérifie ta connexion internet."); recStream.getTracks().forEach(function(t){ t.stop(); }); return; }
        var blob = new Blob(recChunks, { type:'audio/webm' });
        var path = identity.id + '/' + Date.now() + '.webm';
        sb.storage.from('pilipili-voice').upload(path, blob, { contentType:'audio/webm' })
          .then(function(up){
            if (up.error){ alert("Message vocal non envoyé — vérifie ta connexion internet."); return; }
            var publicUrl = sb.storage.from('pilipili-voice').getPublicUrl(path).data.publicUrl;
            return insertMessage({
              user_id: identity.id, prenom: identity.prenom, nom: identity.nom, role: identity.role,
              type:'voice', audio_url: publicUrl
            });
          });
        recStream.getTracks().forEach(function(t){ t.stop(); });
      };
      mediaRecorder.start();
      recStart = Date.now();
      micBtn.classList.add('recording');
      recIndicator.classList.remove('hide');
      recInterval = setInterval(function(){
        recTimer.textContent = fmtDur(Math.floor((Date.now()-recStart)/1000));
      }, 250);
    }).catch(function(){
      alert("Impossible d'accéder au micro — vérifie les autorisations.");
    });
  }

  function stopRecording(){
    if (mediaRecorder && mediaRecorder.state !== 'inactive'){
      mediaRecorder.stop();
    }
    micBtn.classList.remove('recording');
    recIndicator.classList.add('hide');
    clearInterval(recInterval);
  }

  micBtn.addEventListener('mousedown', startRecording);
  micBtn.addEventListener('touchstart', function(e){ e.preventDefault(); startRecording(); }, { passive:false });
  micBtn.addEventListener('mouseup', stopRecording);
  micBtn.addEventListener('mouseleave', function(){ if (mediaRecorder && mediaRecorder.state === 'recording') stopRecording(); });
  micBtn.addEventListener('touchend', function(e){ e.preventDefault(); stopRecording(); });

  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }
})();
</script>
</body>
</html>
