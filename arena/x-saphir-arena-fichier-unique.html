<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>X SAPHIR ARENA</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="description" content="X SAPHIR ARENA — le jeu de combat 2D dessiné à l'encre de l'univers X SAPHIR. Coups spéciaux, supers, 1 ou 2 joueurs, téléphone, tablette et ordinateur.">
<meta name="theme-color" content="#05030a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="X SAPHIR ARENA">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="robots" content="noindex">



<style>:root{--ink:#05030a;--navy:#0a1030;--navy2:#141c4a;--gold:#ffd34a;--gold2:#e8a21a;--cyan:#5fd0ff;--red:#ff3b4d;--paper:#f4f1ff;--glass:rgba(8,12,40,.78);--font:Impact,"Arial Black","Haettenschweiler",sans-serif;--body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:#000;color:var(--paper);font-family:var(--body);overflow:hidden;overscroll-behavior:none;touch-action:none;user-select:none;-webkit-user-select:none}
#app{position:fixed;inset:0;background:#000}
#cv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;background:#0a0620}
#touch{position:absolute;inset:0;display:none;z-index:5;touch-action:none}
#touch.on{display:block}
.tc-zone{position:absolute;left:0;top:18%;width:46%;bottom:0;touch-action:none}
.tc-joy{position:absolute;width:128px;height:128px;margin:-64px 0 0 -64px;border-radius:50%;border:3px solid rgba(255,255,255,.35);background:radial-gradient(circle,rgba(95,208,255,.14),rgba(10,16,48,.35));pointer-events:none;transition:opacity .2s;opacity:.55}
.tc-joy.on{opacity:1;border-color:rgba(255,211,74,.85)}
.tc-joy b{position:absolute;font-size:13px;color:rgba(255,255,255,.55);font-weight:400}
.tc-joy .u{left:50%;top:4px;transform:translateX(-50%)}.tc-joy .d{left:50%;bottom:4px;transform:translateX(-50%)}.tc-joy .l{left:8px;top:50%;transform:translateY(-50%)}.tc-joy .r{right:8px;top:50%;transform:translateY(-50%)}
.tc-nub{position:absolute;left:50%;top:50%;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#9ad9ff 40%,#2b6fff);border:3px solid var(--ink);transform:translate(-50%,-50%);box-shadow:0 4px 12px rgba(0,0,0,.5)}
#touch{--b:clamp(54px,15vh,78px)}
.tc-btns{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));width:calc(var(--b)*3.5);height:calc(var(--b)*3.5);pointer-events:none}
.tc-b{position:absolute;pointer-events:auto;width:var(--b);height:var(--b);border-radius:50%;border:3px solid var(--ink);color:#fff;font:italic 900 clamp(15px,4.4vh,22px)/1 var(--font);letter-spacing:.5px;touch-action:none;box-shadow:0 5px 0 rgba(0,0,0,.45),inset 0 3px 6px rgba(255,255,255,.35);text-shadow:0 2px 0 rgba(0,0,0,.5);opacity:.88;padding:0}
.tc-b.on{transform:translateY(4px) scale(.95);box-shadow:0 1px 0 rgba(0,0,0,.45),inset 0 3px 8px rgba(0,0,0,.4);opacity:1}
.b-lp{background:linear-gradient(#ffb04a,#e0701a);right:calc(var(--b)*1.1);bottom:calc(var(--b)*1.1)}
.b-hp{background:linear-gradient(#ff6a6a,#c4232f);right:0;bottom:calc(var(--b)*1.1)}
.b-lk{background:linear-gradient(#6ad0ff,#2b6fff);right:calc(var(--b)*1.1);bottom:0}
.b-hk{background:linear-gradient(#b48aff,#6a3ad0);right:0;bottom:0}
.b-sp{background:linear-gradient(#5fe08a,#17924a);right:calc(var(--b)*2.25);bottom:calc(var(--b)*.6);font-size:clamp(9px,2.5vh,12px);width:calc(var(--b)*.92);height:calc(var(--b)*.92)}
.b-thr{background:linear-gradient(#e8e8f4,#8a8aa8);color:#14142a;text-shadow:none;right:calc(var(--b)*2.15);bottom:calc(var(--b)*1.65);font-size:clamp(9px,2.3vh,11px);width:calc(var(--b)*.78);height:calc(var(--b)*.78)}
.b-sup{background:linear-gradient(#ffe27a,#d08a00);color:#2a1800;text-shadow:none;right:calc(var(--b)*.1);bottom:calc(var(--b)*2.25);font-size:clamp(10px,2.8vh,13px);width:calc(var(--b)*.95);height:calc(var(--b)*.95);filter:saturate(.35) brightness(.8)}
.b-sup.ready{filter:none;animation:pulse .6s infinite alternate}
@keyframes pulse{from{box-shadow:0 0 0 0 rgba(255,211,74,.9),0 5px 0 rgba(0,0,0,.45)}to{box-shadow:0 0 22px 8px rgba(255,211,74,.9),0 5px 0 rgba(0,0,0,.45)}}

.scr{position:absolute;inset:0;display:none;z-index:10;flex-direction:column;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));touch-action:manipulation;overflow:auto}
.scr.on{display:flex}
.shade{background:radial-gradient(ellipse at 50% 40%,rgba(10,16,48,.35),rgba(3,2,12,.9))}
.shade2{background:linear-gradient(rgba(3,2,12,.82),rgba(3,2,12,.92))}
.logo{font:italic 900 clamp(46px,13vh,110px)/.9 var(--font);text-align:center;letter-spacing:1px;color:var(--gold);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:0 6px 0 var(--ink),0 0 40px rgba(95,208,255,.5);transform:skewX(-8deg)}
.logo small{display:block;font-size:.34em;letter-spacing:.35em;color:var(--cyan);-webkit-text-stroke:2px var(--ink);margin-top:.9em}
.sub{font:600 clamp(11px,2.4vh,15px)/1.4 var(--body);color:#cdd6ff;text-align:center;max-width:46em;margin:.7em 0 0;opacity:.9}
.press{margin-top:4vh;font:italic 900 clamp(18px,4.6vh,30px) var(--font);color:#fff;-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;animation:blink 1.1s infinite}
@keyframes blink{50%{opacity:.25}}
.menu{display:flex;flex-direction:column;gap:clamp(6px,1.6vh,12px);width:min(360px,86vw);margin-top:2vh}
.mbtn,.btn{display:block;width:100%;padding:clamp(9px,2.1vh,14px) 18px;font:italic 900 clamp(17px,3.8vh,26px) var(--font);color:#fff;text-align:left;background:linear-gradient(100deg,var(--navy2),var(--navy));border:3px solid var(--ink);border-left:10px solid var(--gold);cursor:pointer;transform:skewX(-8deg);box-shadow:0 5px 0 rgba(0,0,0,.55),0 0 0 2px rgba(255,211,74,.0);letter-spacing:.5px;-webkit-text-stroke:0;touch-action:manipulation}
.mbtn span,.btn span{display:inline-block;transform:skewX(8deg)}
.mbtn:hover,.mbtn.sel,.btn:hover,.btn.sel,.mbtn:focus-visible,.btn:focus-visible{background:linear-gradient(100deg,#ffb02a,#e8650a);color:#1a0a00;outline:none;box-shadow:0 5px 0 rgba(0,0,0,.55),0 0 24px rgba(255,170,40,.7)}
.mbtn small{display:block;font:500 12px var(--body);letter-spacing:0;opacity:.8;margin-top:2px}
.btn.alt{border-left-color:var(--cyan)}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:2vh}
.row .btn{width:auto;min-width:150px}
h2.t{font:italic 900 clamp(24px,6vh,44px) var(--font);margin:0 0 1vh;color:var(--gold);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;transform:skewX(-8deg);text-align:center}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:clamp(6px,1.4vw,14px);width:min(980px,96vw);margin-top:1vh}
.card{position:relative;border:3px solid var(--ink);background:linear-gradient(180deg,var(--navy2),var(--navy));overflow:hidden;cursor:pointer;transform:skewX(-4deg);box-shadow:0 6px 0 rgba(0,0,0,.55);transition:transform .12s,box-shadow .12s;touch-action:manipulation}
.card canvas{display:block;width:100%;height:auto;aspect-ratio:3/4;transform:skewX(4deg) scale(1.12)}
.card .nm{position:absolute;left:0;right:0;bottom:0;padding:6px 8px 6px;background:linear-gradient(transparent,rgba(0,0,0,.92) 40%);font:italic 900 clamp(13px,3.2vh,22px) var(--font);transform:skewX(4deg);text-shadow:0 2px 0 #000}
.card .nm small{display:block;font:600 clamp(9px,1.9vh,12px) var(--body);color:#ffd9a0}
.card.sel{transform:skewX(-4deg) translateY(-6px) scale(1.04);box-shadow:0 10px 0 rgba(0,0,0,.55),0 0 30px var(--glow,#ffd34a);border-color:var(--glow,#ffd34a)}
.card .tag{position:absolute;top:6px;left:8px;font:italic 900 14px var(--font);padding:2px 8px;background:var(--gold);color:var(--ink);transform:skewX(4deg);display:none}
.card .tag.p2{background:var(--cyan);left:auto;right:8px}
.card.sel1 .tag.p1,.card.sel2 .tag.p2{display:block}
.info{width:min(980px,96vw);display:flex;gap:14px;align-items:center;margin-top:1.4vh;padding:8px 12px;background:var(--glass);border:2px solid #2a3470;font-size:clamp(11px,2.3vh,14px);min-height:60px}
.info b{font:italic 900 clamp(15px,3vh,22px) var(--font);color:var(--gold)}
.stat{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center;font-size:11px;min-width:150px}
.stat i{display:block;height:7px;background:#1a2260;border-radius:2px;overflow:hidden}.stat i s{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--gold))}
.stages{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;width:min(900px,96vw)}
.stg{flex:1 1 260px;max-width:420px;cursor:pointer;border:3px solid var(--ink);background:var(--navy);transform:skewX(-4deg);box-shadow:0 6px 0 rgba(0,0,0,.55);overflow:hidden;touch-action:manipulation}
.stg.sel{box-shadow:0 8px 0 rgba(0,0,0,.55),0 0 28px var(--gold);border-color:var(--gold)}
.stg canvas{display:block;width:100%;aspect-ratio:16/9}
.stg div{padding:8px 12px;font:italic 900 20px var(--font);transform:skewX(4deg)}.stg div small{display:block;font:600 12px var(--body);color:#cdd6ff}
.panel{width:min(900px,96vw);max-height:76vh;overflow:auto;background:var(--glass);border:2px solid #2a3470;padding:12px 16px;font-size:clamp(12px,2.4vh,15px);line-height:1.5;touch-action:pan-y}
.panel h3{font:italic 900 20px var(--font);color:var(--gold);margin:12px 0 4px}
.panel table{width:100%;border-collapse:collapse}.panel td,.panel th{padding:4px 8px;border-bottom:1px solid #1d2658;text-align:left;vertical-align:top}
.panel th{color:var(--cyan);font-weight:700}
kbd{display:inline-block;min-width:22px;padding:1px 6px;border:2px solid #3a4aa0;border-bottom-width:4px;border-radius:5px;background:#10184a;font:700 12px var(--body);text-align:center}
.tabs{display:flex;gap:6px;margin:0 0 8px;flex-wrap:wrap}.tabs button{font:italic 900 15px var(--font);padding:6px 12px;color:#fff;background:var(--navy2);border:2px solid var(--ink);cursor:pointer}.tabs button.on{background:var(--gold);color:var(--ink)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid #1d2658}
.opt label{font-weight:600}.opt .seg{display:flex;gap:4px}.seg button{font:italic 900 14px var(--font);padding:6px 12px;background:var(--navy2);color:#fff;border:2px solid var(--ink);cursor:pointer;min-width:52px}.seg button.on{background:var(--gold);color:var(--ink)}
.opt input[type=range]{width:160px;accent-color:var(--gold)}
#pause .menu{margin-top:1vh}
#hud-btn{position:absolute;left:50%;bottom:max(6px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:8;display:none;width:44px;height:44px;border-radius:50%;border:3px solid var(--ink);background:rgba(10,16,48,.7);color:#fff;font:900 18px var(--font);cursor:pointer;touch-action:manipulation}
#hud-btn.on{display:block}
#hint{position:absolute;left:50%;top:24%;transform:translateX(-50%);z-index:7;background:rgba(5,3,10,.82);border:2px solid var(--gold);padding:8px 14px;font:600 clamp(11px,2.4vh,14px) var(--body);text-align:center;max-width:80vw;display:none;pointer-events:none}
#hint.on{display:block;animation:fade 7s forwards}
@keyframes fade{0%,80%{opacity:1}100%{opacity:0}}
#rotate{position:fixed;inset:0;z-index:50;background:#05030a;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px;font:italic 900 24px var(--font)}
#rotate i{font-size:64px;font-style:normal;animation:rot 1.6s infinite}
@keyframes rot{0%,30%{transform:rotate(0)}70%,100%{transform:rotate(-90deg)}}
.result .big{font:italic 900 clamp(40px,12vh,96px) var(--font);color:var(--gold);-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;transform:skewX(-8deg);text-align:center}
.result .big.lose{color:var(--red)}
.install{font:600 12px var(--body);color:#a8c0ff;margin-top:1.6vh;text-align:center}
.credit{position:absolute;bottom:6px;left:0;right:0;text-align:center;font:500 10px var(--body);color:#8f9bd0;opacity:.8;pointer-events:none}
@media (max-height:480px){.card canvas{aspect-ratio:1/1.02}.stat{grid-template-columns:auto 1fr auto 1fr;gap:3px 8px;font-size:10px;min-width:0;flex:1}.info{gap:10px}.sub{margin-top:1.1em}}
@media (max-height:420px){.logo{font-size:44px}.cards{margin-top:0}.info{margin-top:6px;min-height:0;padding:4px 8px}.card .nm{padding:3px 6px}.panel{max-height:68vh}.menu{margin-top:6px;gap:5px}.mbtn,.btn{padding:6px 16px;font-size:17px}h2.t{font-size:22px;margin:0}.credit{display:none}}
@media (prefers-reduced-motion:reduce){.press,.b-sup.ready{animation:none}}
</style>
</head>

  <canvas id="cv" width="960" height="540"></canvas>
  <div id="touch"></div>
  <button id="hud-btn" type="button" aria-label="Pause">❚❚</button>
  <div id="hint"></div>

  <section id="scr-title" class="scr shade"></section>
  <section id="scr-menu" class="scr shade"></section>
  <section id="scr-select" class="scr shade2"></section>
  <section id="scr-stage" class="scr shade2"></section>
  <section id="scr-moves" class="scr shade2"></section>
  <section id="scr-options" class="scr shade2"></section>
  <section id="scr-pause" class="scr shade2"></section>
  <section id="scr-result" class="scr shade2 result"></section>
</div>

<script>/* X SAPHIR — ARENA : le moteur de combat.
   Simulation à pas fixe (60 images par seconde), sans aucun dessin : on lui donne les commandes de chaque joueur
   à chaque image, il rend l'état du combat et les événements (coups, blocages, K.O.…) que le décor, les effets
   et le son utilisent. Même entrées → même combat (utile pour les tests, et plus tard pour le jeu en ligne). */
(function (root) {
  'use strict';
  var XS = root.XS = root.XS || {};
  var Data = XS.Data || (typeof require !== 'undefined' ? require('./data.js') : null);

  var STAGE_W = 1600, WALL_L = 70, WALL_R = STAGE_W - 70, GRAV = 0.56, MAXD = 640;
  var BTN = { LP: 1, HP: 2, LK: 4, HK: 8, SUP: 16, SP: 32, THR: 64 };
  var ATTACKS = BTN.LP | BTN.HP | BTN.LK | BTN.HK;

  function dirNum(x, y) { // x : -1 gauche, 0, 1 droite ; y : -1 bas, 0, 1 haut → pavé numérique
    if (y < 0) return x < 0 ? 1 : (x > 0 ? 3 : 2);
    if (y > 0) return x < 0 ? 7 : (x > 0 ? 9 : 8);
    return x < 0 ? 4 : (x > 0 ? 6 : 5);
  }
  function rng(seed) { var a = seed >>> 0; return function () { a |= 0; a = a + 0x6D2B79F5 | 0; var t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  // ---------- reconnaissance des mouvements (↓↘→, →↓↘, ↓↙←, ↓↘→↓↘→) ----------
  var MOTIONS = {
    '236': [[1, 2], [3], [6, 9]],
    '623': [[6, 9], [1, 2], [3]],
    '214': [[2, 3], [1], [4, 7]],
    '236236': [[1, 2], [3], [6, 9], [1, 2], [3], [6, 9]]
  };
  function matchMotion(hist, key, win, recent) {
    var groups = MOTIONS[key], gi = 0, last = -1, start = Math.max(0, hist.length - win);
    for (var i = start; i < hist.length; i++) {
      var d = hist[i].d;
      if (groups[gi].indexOf(d) !== -1) { last = i; gi++; if (gi === groups.length) break; }
    }
    // une direction « neutre » ou en trop entre deux étapes n'annule pas le mouvement ; il faut seulement que la fin soit récente
    return gi === groups.length && last >= hist.length - recent;
  }

  // ---------- combattants ----------
  function makeFighter(side, cid, opts) {
    var C = Data.chars[cid];
    return {
      side: side, cid: cid, C: C, cpu: !!(opts && opts.cpu), level: (opts && opts.level) || 3,
      x: 0, y: 0, vx: 0, vy: 0, px: 0, face: side === 0 ? 1 : -1,
      hp: C.hp, maxHp: C.hp, rage: 0, ragePulse: 0,
      state: 'idle', sf: 0, move: null, mf: 0, hitDone: false, contact: false, hits: 0, nextMulti: 0, airAtk: false,
      stun: 0, hitKind: 'stand', kdT: 0, inv: 0, juggles: 0, cHits: 0, cDmg: 0, lastCombo: 0, lastComboDmg: 0,
      hist: [], btnPrev: 0, press: [], curD: 5, curBtn: 0, dashCool: 0, throwPress: -99, tapRaw: 0,
      flash: 0, shake: 0, lastHitFrame: -999, lastTrail: 0, win: false, rounds: 0, animT: 0, aiState: null,
      superCut: null, thrownT: 0, grabbed: null, landLag: 0, chainLock: 0
    };
  }

  function actionable(f) {
    return f.state === 'idle' || f.state === 'crouch' || f.state === 'walkF' || f.state === 'walkB';
  }
  function grounded(f) { return f.y <= 0.001 && f.state !== 'air' && f.state !== 'airhit' && f.state !== 'jump'; }
  function hurtbox(f) {
    var h = f.state === 'crouch' || (f.state === 'hit' && f.hitKind === 'crouch') || (f.state === 'block' && f.blockCrouch) ? 100 : 160;
    if (f.state === 'air' || f.state === 'jump' || f.state === 'airhit') return { x1: f.x - 28, x2: f.x + 28, y1: f.y + 25, y2: f.y + 150 };
    if (f.state === 'knockdown' || f.state === 'ko') return { x1: f.x - 70, x2: f.x + 70, y1: f.y, y2: f.y + 40 };
    return { x1: f.x - 30, x2: f.x + 30, y1: f.y, y2: f.y + h };
  }
  function boxWorld(f, b) { // b = [avant, bas, largeur, hauteur]
    var x1 = f.face > 0 ? f.x + b[0] : f.x - b[0] - b[2];
    return { x1: x1, x2: x1 + b[2], y1: f.y + b[1], y2: f.y + b[1] + b[3] };
  }
  function overlap(a, b) { return a.x1 < b.x2 && a.x2 > b.x1 && a.y1 < b.y2 && a.y2 > b.y1; }

      makeFighter(0, this.opts.p1 || 'calpros', this.opts.cpu1 || null),

    this.timer = 99; this.tick = 0; this.hitstop = 0; this.freeze = 0; this.freezeWho = -1; this.slow = 1;
    this.wins = [0, 0]; this.winner = -1; this.matchOver = false; this.lastKoBig = false;
    this.training = this.opts.training || { dummy: 'stand', block: 'none', rage: false, infinite: true };

  }

  Match.prototype.resetRound = function (first) {
    var self = this, mid = STAGE_W / 2;

      var keep = { rounds: f.rounds };
      var n = makeFighter(i, f.cid, { cpu: f.cpu, level: f.level });
      n.rounds = keep.rounds;
      self.f[i] = n;
      n.x = mid + (i === 0 ? -170 : 170); n.face = i === 0 ? 1 : -1; n.state = 'intro'; n.sf = 0;
      if (self.mode === 'training' && self.training.rage) n.rage = 100;
    });
    this.proj = []; this.phase = 'intro'; this.pt = 0; this.timer = 99; this.tick = 0; this.hitstop = 0; this.freeze = 0; this.slow = 1;
    this.emit({ t: 'round', n: this.round });
  };

  // ----- entrées -----
  function pushInput(f, inp) {
    var rx = (inp.x || 0) * f.face, d = dirNum(rx, inp.y || 0), b = inp.btn || 0;
    var pressed = b & ~f.btnPrev;
    var e = { d: d, b: b, p: pressed, macro: null };
    if ((b & BTN.SP) && (pressed & ATTACKS)) e.macro = (inp.y || 0) > 0 ? '623' : (rx < 0 ? '214' : '236');
    f.hist.push(e); if (f.hist.length > 48) f.hist.shift();
    f.curD = d; f.curBtn = b; f.btnPrev = b;
    if (pressed & ATTACKS) { f.press.push({ b: pressed & ATTACKS, fr: f.animT, macro: e.macro }); }
    if (pressed & BTN.THR) f.throwPress = f.animT;
    if (pressed & BTN.SUP) f.press.push({ b: BTN.SUP, fr: f.animT, macro: (b & BTN.SP) ? 'S' : null });
    f.press = f.press.filter(function (p) { return f.animT - p.fr <= 6; });
    return e;
  }

  function moveTotal(mv) { return mv.su + (mv.ac > 90 ? 40 : mv.ac) + mv.rc; }

  // choisit le coup demandé par les commandes (spécial, super, projection, coup normal)
  function chooseMove(f, allowNormals, cancelFrom) {
    var C = f.C, hist = f.hist, press = f.press;
    var throwReq = f.animT - f.throwPress <= 3 && f.state !== 'air';
    if (!press.length && !throwReq) return null;
    var last = press.length ? press[press.length - 1] : { b: 0 };
    // SUPER
    var wantsSup = false;
    for (var i = 0; i < press.length; i++) { if (press[i].b === BTN.SUP) wantsSup = true; }
    if (f.rage >= 100 && f.state !== 'air') {
      if (wantsSup) return C.sup;
      if ((last.b & ATTACKS) && matchMotion(hist, '236236', 34, 12)) return C.sup;
    }
    // SPÉCIAUX
    var atk = null;
    for (var j = press.length - 1; j >= 0; j--) { if (press[j].b & ATTACKS) { atk = press[j]; break; } }
    if (atk && f.state !== 'air') {
      var strength = (atk.b & (BTN.HP | BTN.HK)) ? 'H' : 'L', key = null;
      if (atk.macro) key = atk.macro;
      else if (matchMotion(hist, '623', 18, 9)) key = '623';
      else if (matchMotion(hist, '236', 18, 9)) key = '236';
      else if (matchMotion(hist, '214', 18, 9)) key = '214';
      if (key && C.specials[key]) {

        if (sp.proj && f.match && f.match.proj.some(function (p) { return p.owner === f.side; })) sp = null;
        if (sp) return sp;
      }

    if (f.state !== 'air') {
      var lp = false, lk = false, bothClose = false;
      for (var k = 0; k < press.length; k++) { if (press[k].b & BTN.LP) lp = press[k].fr; if (press[k].b & BTN.LK) lk = press[k].fr; }
      if (lp !== false && lk !== false && Math.abs(lp - lk) <= 3) bothClose = true;
      if (bothClose || (f.animT - f.throwPress <= 3 && f.curD <= 6)) return C.normals.thr;
    }
    // COUPS NORMAUX
    if (atk) {
      var nm = (atk.b & BTN.LP) ? 'lp' : (atk.b & BTN.HP) ? 'hp' : (atk.b & BTN.LK) ? 'lk' : 'hk';
      var air = f.state === 'air';
      var cr = !air && (f.curD === 1 || f.curD === 2 || f.curD === 3);
      var id = air ? 'j' + nm : (cr ? 'c' + nm : nm);

  }

    f.press = []; f.chainLock = 0; f.hitThis = false; f.blockedThis = false;

      this.emit({ t: 'super', who: f.side, name: mv.cut || mv.name, cid: f.cid });
    } else if (mv.type === 'special') {
      this.emit({ t: 'special', who: f.side, name: mv.name, id: mv.id });
    } else {
      this.emit({ t: 'swing', who: f.side, id: mv.id, heavy: mv.dmg >= 60 });

  };

  Match.prototype.stepFighter = function (f, o, inp, active) {
    f.match = this; f.animT++;

    f.sf++;

    // l'adversaire doit être remis debout dès que le combattant reprend la main (fin de combo)
    if (actionable(o) || o.state === 'intro') { /* géré côté o */ }

      if (c === 'ArrowLeft' || c === 'ArrowRight' || c === 'KeyA' || c === 'KeyD') { G.sel = (G.sel + 1) % m; audio.play('ui'); markStage(); }
      else if (c === 'Enter' || c === 'Space') { e.preventDefault(); G.stage = Data.stages[G.sel].id; audio.play('ok'); startFight(); } else if (c === 'Escape') { $('st-back').click(); }
      return;
    }
    var list = scrEl.querySelectorAll('.mbtn'); if (sc === 'menu' || sc === 'pause' || sc === 'result') {
      if (c === 'ArrowDown' || c === 'KeyS') { G.sel = (G.sel + 1) % list.length; audio.play('ui'); markSel(list); e.preventDefault(); }
      else if (c === 'ArrowUp' || c === 'KeyW' || c === 'KeyZ') { G.sel = (G.sel + list.length - 1) % list.length; audio.play('ui'); markSel(list); e.preventDefault(); }
      else if (c === 'Enter' || c === 'Space') { e.preventDefault(); if (list[G.sel]) list[G.sel].click(); }
      else if (c === 'Escape') { if (sc === 'pause') resumeFight(); else if (sc === 'result') quitFight(); }
      return;
    }
    if (c === 'Escape') { var bk = scrEl.querySelector('.row .btn'); if (bk) bk.click(); }
  }
  window.addEventListener('keydown', function (e) { handleKey(e); });
  // « toucher pour commencer »
  $('scr-title').addEventListener('click', function () { audio.unlock(); audio.play('ok'); renderMenu(); });
  document.addEventListener('visibilitychange', function () { if (document.hidden && G.screen === 'fight' && !G.paused && !$('scr-result').classList.contains('on')) showPause(); });
  // le défilement du navigateur ne doit jamais bouger la page
  document.addEventListener('touchmove', function (e) { if (!e.target.closest || !e.target.closest('.panel')) e.preventDefault(); }, { passive: false });

  // ---------- démarrage ----------
  applySettings(); fit(); G.screen = 'title'; renderTitle(); requestAnimationFrame(frame);
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(function () { /* hors ligne non disponible */ });
  window.__arena = { G: G, S: S, R: R, startFight: startFight, renderMenu: renderMenu, renderSelect: renderSelect, renderStage: renderStage, renderMoves: renderMoves, renderOptions: renderOptions, showPause: showPause, audio: audio };
})();
