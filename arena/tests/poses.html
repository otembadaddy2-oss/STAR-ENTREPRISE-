<script>
var ctx=document.getElementById('c').getContext('2d'), D=XS.Draw, Dat=XS.Data;
var q=new URLSearchParams(location.search), cid=q.get('c')||'calpros';
var names=[['idle','idle',{}],['crouch','crouch',{}],['walkF','walkF',{}],['dashF','dashF',{sf:10}],['air','air',{vy:5,y:60}],['block','block',{}],['cblock','block',{blockCrouch:true}],['hit','hit',{sf:2}],
['lp','attack',{m:'lp'}],['hp','attack',{m:'hp'}],['lk','attack',{m:'lk'}],['hk','attack',{m:'hk'}],['clp','attack',{m:'clp'}],['chp','attack',{m:'chp'}],['clk','attack',{m:'clk'}],['chk','attack',{m:'chk'}],

var C=Dat.chars[cid];
names.forEach(function(n,i){
  var col=i%8, row=Math.floor(i/8), x=120+col*240, gy=row*270+232;
  ctx.fillStyle=(row+col)%2?'#2b2f4a':'#252a44'; ctx.fillRect(col*240,row*270,240,270);
