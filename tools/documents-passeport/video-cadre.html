<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><title>Cadre de tournage — Passeport Sûr</title>
<style>
@font-face{font-family:ID;font-weight:300;src:url(/passeport-demo/polices/inter-display-300.woff2) format("woff2")}
@font-face{font-family:ID;font-weight:600;src:url(/passeport-demo/polices/inter-display-600.woff2) format("woff2")}
@font-face{font-family:ID;font-weight:800;src:url(/passeport-demo/polices/inter-display-800.woff2) format("woff2")}
@font-face{font-family:PF;font-weight:800;src:url(/passeport-demo/polices/playfair-display-latin-800-normal.woff2) format("woff2")}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1280px;height:720px;overflow:hidden;background:#041f15;font-family:ID,sans-serif;font-weight:300;color:#fff}
#ruban{position:absolute;left:0;top:0;width:1280px;height:34px;background:linear-gradient(90deg,#041f15,#0a4430);display:flex;align-items:center;gap:14px;padding:0 18px;font-size:13px;letter-spacing:.02em;z-index:30}
#ruban b{color:#f9e08a;letter-spacing:.18em;font-size:12px}#ruban span{color:#d5ebde}#ruban i{margin-left:auto;font-style:normal;color:#9fd8b9;font-size:12px}
#ruban:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,#009543 0 33.3%,#f6c928 33.3% 66.6%,#d62f26 66.6%)}
#scene{position:absolute;left:0;top:34px;width:1280px;height:556px;background:#f6f3ea;overflow:hidden}
iframe{position:absolute;border:0;background:#fff;transition:opacity .4s}
#plein{left:0;top:0;width:1280px;height:556px}
#g{left:0;top:0;width:640px;height:556px;border-right:3px solid #041f15;display:none}#d{left:643px;top:0;width:637px;height:556px;display:none}
#telfond{position:absolute;inset:0;display:none;background:radial-gradient(700px 400px at 70% 20%,#0f6a45 0,transparent 70%),linear-gradient(150deg,#041f15,#0a4430)}
#tel{position:absolute;left:530px;top:6px;width:224px;height:544px;border:7px solid #111;border-radius:30px;overflow:hidden;background:#fff;display:none;box-shadow:0 12px 40px #0008}
#tel iframe{position:absolute;left:0;top:0;width:390px;height:1000px;transform:scale(.53);transform-origin:0 0}
#telnote{position:absolute;left:70px;top:90px;width:400px;display:none;color:#fff;font-size:19px;line-height:1.5}#telnote h3{font-family:PF,serif;font-weight:800;font-size:30px;margin-bottom:10px;color:#f9e08a}
#leg{position:absolute;left:0;bottom:0;width:1280px;height:130px;background:linear-gradient(180deg,#06281c,#041f15);padding:14px 40px 10px;z-index:25;border-top:2px solid #0f6a45}
#leg .num{display:inline-block;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:#f9e08a;font-weight:600;margin-bottom:4px}
#leg h2{font-family:PF,serif;font-weight:800;font-size:25px;line-height:1.15;margin-bottom:4px}#leg p{font-size:18px;line-height:1.38;color:#e1f1e8;max-width:1180px}
#carte{position:absolute;inset:0;z-index:40;background:radial-gradient(900px 500px at 85% -10%,#0f6a45 0,transparent 70%),linear-gradient(150deg,#041f15,#0a4430);display:none;padding:70px 90px;flex-direction:column;justify-content:center;opacity:0;transition:opacity .6s}
#carte.on{opacity:1}
#carte img.lg{height:96px;width:auto;align-self:flex-start;margin-bottom:22px}
#carte .kic{letter-spacing:.3em;font-size:14px;color:#f9e08a;text-transform:uppercase;margin-bottom:10px}#carte h1{font-family:PF,serif;font-weight:800;font-size:68px;line-height:1.05;margin-bottom:12px}#carte .sous{font-size:26px;color:#d5ebde;margin-bottom:26px}
#carte .but{background:#ffffff14;border:1px solid #ffffff3d;border-radius:20px;padding:20px 26px;max-width:960px}#carte .but small{display:block;letter-spacing:.24em;font-size:12px;color:#f9e08a;text-transform:uppercase;margin-bottom:8px;font-weight:600}#carte .but p{font-size:25px;line-height:1.4}#carte b{color:#f9e08a;font-weight:800}
#carte .tr{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:6px}#carte .tr div{background:#ffffff12;border:1px solid #ffffff30;border-top:6px solid #009543;border-radius:18px;padding:22px}#carte .tr div:nth-child(2){border-top-color:#f6c928}#carte .tr div:nth-child(3){border-top-color:#d62f26}
#carte .tr h3{font-family:PF,serif;font-size:32px;margin-bottom:8px}#carte .tr p{font-size:20px;line-height:1.4;color:#e1f1e8}
#carte .fin{text-align:center;align-self:center}#carte .fin img{height:150px}
#curseur{position:absolute;left:-50px;top:-50px;width:26px;height:26px;z-index:60;pointer-events:none;transition:left .55s cubic-bezier(.3,.7,.2,1),top .55s cubic-bezier(.3,.7,.2,1)}
#curseur:before{content:"";position:absolute;left:0;top:0;width:20px;height:20px;background:#fff;border:3px solid #111;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 2px 6px #0007}
#curseur.clic:after{content:"";position:absolute;left:-14px;top:-14px;width:44px;height:44px;border-radius:50%;border:4px solid #f6c928;animation:pulse .5s ease-out}
@keyframes pulse{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
</style></head><body>
<div id="ruban"><b>PASSEPORT SÛR</b><span>But : suivre chaque demande de passeport de A à Z · ordonner la file d’attente · détecter les fraudes</span><i>Démonstration — données fictives</i></div>
<div id="scene">
  <iframe id="plein" name="plein"></iframe><iframe id="g" name="g"></iframe><iframe id="d" name="d"></iframe>
  <div id="telfond"></div><div id="telnote"></div><div id="tel"><iframe id="t" name="t"></iframe></div>
</div>
<div id="leg"><span class="num" id="legnum"></span><h2 id="legtitre"></h2><p id="legtexte"></p></div>
<div id="carte"></div><div id="curseur"></div>
<script>
window.V = {
  mode(m) { const $ = id => document.getElementById(id); $('plein').style.display = m === 'plein' ? 'block' : 'none'; $('g').style.display = $('d').style.display = m === 'split' ? 'block' : 'none'; $('telfond').style.display = $('tel').style.display = $('telnote').style.display = m === 'tel' ? 'block' : 'none'; },
  src(id, url) { document.getElementById(id).src = url; },
  leg(num, titre, texte) { document.getElementById('legnum').textContent = num || ''; document.getElementById('legtitre').textContent = titre || ''; document.getElementById('legtexte').innerHTML = texte || ''; },
  carte(html) { const c = document.getElementById('carte'); if (html) { c.innerHTML = html; c.style.display = 'flex'; requestAnimationFrame(() => c.classList.add('on')); } else { c.classList.remove('on'); setTimeout(() => { c.style.display = 'none'; }, 650); } },
  note(html) { document.getElementById('telnote').innerHTML = html; },
  curseur(x, y, clic) { const c = document.getElementById('curseur'); c.style.left = x + 'px'; c.style.top = y + 'px'; if (clic) { c.classList.remove('clic'); void c.offsetWidth; c.classList.add('clic'); } }
};
</script></body></html>
