<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ALPHA — Créer un compte administrateur</title>
<style>
  :root{ --ink:#0B132A; --ink-2:#131E3A; --blue:#2E64E0; --gold:#C9A227; }
  *{ box-sizing:border-box; }
  body{ margin:0; font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:var(--ink); color:#fff; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .card{ width:100%; max-width:420px; background:var(--ink-2); border-radius:16px; padding:28px 22px; box-shadow:0 20px 50px rgba(0,0,0,.4); }
  h1{ font-size:1.15rem; margin:0 0 4px; color:var(--gold); }
  p.sub{ margin:0 0 20px; font-size:.85rem; color:#a9b3c9; }
  label{ display:block; font-size:.78rem; color:#c8d0e0; margin:12px 0 4px; }
  input, select{ width:100%; padding:11px 12px; border-radius:9px; border:1px solid #2a3a63; background:#0e1830; color:#fff; font-size:.95rem; }
  button{ width:100%; margin-top:20px; padding:13px; border:none; border-radius:9px; background:var(--blue); color:#fff; font-weight:700; font-size:.95rem; cursor:pointer; }
  button:disabled{ opacity:.6; }
  #result{ margin-top:16px; padding:12px; border-radius:9px; font-size:.85rem; white-space:pre-wrap; display:none; }
  #result.ok{ display:block; background:#153a26; color:#8ef0b0; }
  #result.err{ display:block; background:#3a1515; color:#f08e8e; }
</style>
</head>
<body>
  <div class="card">
    <h1>ALPHA — Compte administrateur</h1>
    <p class="sub">Remplis ce formulaire pour créer ou réinitialiser un compte de connexion réel sur le backend ALPHA.</p>

    <label>Jeton de configuration (SETUP_TOKEN)</label>
    <input id="setupToken" type="password" autocomplete="off" />

    <label>Identifiant</label>
    <input id="username" type="text" autocomplete="off" value="admin" />

    <label>Mot de passe (8 caractères minimum)</label>
    <input id="password" type="password" autocomplete="off" />

    <label>Nom affiché</label>
    <input id="displayName" type="text" value="Carry OTEMBA" />

    <label>Organisation</label>
    <input id="org" type="text" value="star_creat" />

    <label>Rôle</label>
    <input id="role" type="text" value="admin" />

    <button id="submitBtn">Créer le compte</button>
    <div id="result"></div>
  </div>

<script>
document.getElementById('submitBtn').addEventListener('click', async () => {
  var btn = document.getElementById('submitBtn');
  var result = document.getElementById('result');
  var body = {
    action: 'bootstrap',
    setupToken: document.getElementById('setupToken').value.trim(),
    username: document.getElementById('username').value.trim(),
    password: document.getElementById('password').value,
    displayName: document.getElementById('displayName').value.trim(),
    org: document.getElementById('org').value.trim(),
    role: document.getElementById('role').value.trim()
  };
  btn.disabled = true;
  btn.textContent = 'Création en cours...';
  result.className = '';
  result.style.display = 'none';
  try {
    var res = await fetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    var data = await res.json();
    if (res.ok) {
      result.className = 'ok';
      result.textContent = 'Compte créé avec succès :\n' + JSON.stringify(data, null, 2);
    } else {
      result.className = 'err';
      result.textContent = 'Erreur : ' + (data.error || res.status);
    }
  } catch (e) {
    result.className = 'err';
    result.textContent = 'Erreur réseau : ' + e.message;
  }
  result.style.display = 'block';
  btn.disabled = false;
  btn.textContent = 'Créer le compte';
});
</script>
</body>
</html>
