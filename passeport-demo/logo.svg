<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 224" width="200" height="224" role="img" aria-label="Passeport Sûr">
<defs>
<clipPath id="bouclier"><path d="M100 6 L186 34 V112 C186 166 150 200 100 218 C50 200 14 166 14 112 V34 Z"/></clipPath>
<linearGradient id="or" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0a8"/><stop offset=".5" stop-color="#f6c928"/><stop offset="1" stop-color="#b98a12"/></linearGradient>
<linearGradient id="liv" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b3a2a"/><stop offset="1" stop-color="#04180f"/></linearGradient>
<linearGradient id="reflet" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".5" stop-color="#fff" stop-opacity="0"/></linearGradient>
<filter id="ombre" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity=".45"/></filter>
</defs>
<!-- bouclier + drapeau en diagonale (vert, jaune, rouge) -->
<g clip-path="url(#bouclier)">
<rect width="200" height="224" fill="#009543"/>
<polygon points="0,178 160,0 200,0 200,48 0,270" fill="#fbde4a"/>
<polygon points="0,270 200,48 200,260 0,260" fill="#dc241f"/>
<rect width="200" height="112" fill="url(#reflet)"/>
</g>
<path d="M100 6 L186 34 V112 C186 166 150 200 100 218 C50 200 14 166 14 112 V34 Z" fill="none" stroke="url(#or)" stroke-width="6" stroke-linejoin="round"/>
<path d="M100 17 L176 41 V111 C176 160 144 190 100 207 C56 190 24 160 24 111 V41 Z" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="1.4"/>
<!-- livret de passeport -->
<g filter="url(#ombre)">
<rect x="66" y="52" width="68" height="94" rx="7" fill="url(#liv)" stroke="url(#or)" stroke-width="3"/>
<rect x="72" y="58" width="56" height="82" rx="4" fill="none" stroke="#f6c928" stroke-opacity=".55" stroke-width="1"/>
</g>
<!-- étoile (comme sur le drapeau) -->
<polygon points="100,70 105.9,85.6 122.6,86.4 109.6,96.8 114,113 100,103.8 86,113 90.4,96.8 77.4,86.4 94.1,85.6" fill="url(#or)"/>
<!-- puce + lignes de lecture automatique -->
<g fill="#f6c928" fill-opacity=".85"><rect x="76" y="123" width="48" height="2.6" rx="1.3"/><rect x="76" y="129" width="48" height="2.6" rx="1.3"/><rect x="76" y="135" width="34" height="2.6" rx="1.3"/></g>
<!-- pastille de contrôle validé -->
<g filter="url(#ombre)"><circle cx="138" cy="150" r="23" fill="#fff"/><circle cx="138" cy="150" r="19" fill="#009543"/></g>
<path d="M127.5 150.5 L135 158 L149.5 142.5" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
