<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="author" content="STAR ENTREPRISE">
<title>Salle d'attente — Passeport Sûr</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">
<style>
@font-face{font-family:ID;font-weight:300;src:url(polices/inter-display-300.woff2) format("woff2")}
@font-face{font-family:ID;font-weight:600;src:url(polices/inter-display-600.woff2) format("woff2")}
@font-face{font-family:ID;font-weight:800;src:url(polices/inter-display-800.woff2) format("woff2")}
@font-face{font-family:PF;font-weight:800;src:url(polices/playfair-display-latin-800-normal.woff2) format("woff2")}
:root{--foret:#041f15;--foret2:#0a4430;--vert:#00a24a;--jaune:#f6c928;--rouge:#e23b30;--ivoire:#f6f3ea}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(120vmax 80vmax at 80% -10%,#0f6a45 0,transparent 60%),linear-gradient(160deg,var(--foret),#06281c);color:#fff;font-family:ID,system-ui,sans-serif;font-weight:300;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:2vmin;padding:2.2vmin 3vmin;position:relative}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:.8vmin;background:linear-gradient(90deg,var(--vert) 0 33.3%,var(--jaune) 33.3% 66.6%,var(--rouge) 66.6%)}
header img{height:8vmin}
header h1{font-family:PF,serif;font-weight:800;font-size:4vmin;line-height:1.05}
header h1 small{display:block;font-family:ID,sans-serif;font-weight:300;font-size:1.9vmin;letter-spacing:.16em;color:#f9e08a;text-transform:uppercase;margin-top:.6vmin}
#heure{margin-left:auto;font-weight:800;font-size:5vmin;font-variant-numeric:tabular-nums}
main{flex:1;display:grid;grid-template-columns:1.45fr 1fr;gap:2.4vmin;padding:2.6vmin 3vmin;min-height:0}
.appel{background:linear-gradient(145deg,#0b3a2a,#06281c);border:.4vmin solid #1b6b4a;border-radius:3vmin;padding:3vmin;display:flex;flex-direction:column;justify-content:center;text-align:center;position:relative;overflow:hidden}
.appel .lib{letter-spacing:.3em;font-size:2.2vmin;color:#9fd8b9;text-transform:uppercase}
.appel .num{font-family:PF,serif;font-weight:800;font-size:25vmin;line-height:1;color:var(--jaune);margin:1vmin 0;font-variant-numeric:tabular-nums}
.appel .nom{font-weight:800;font-size:6vmin;line-height:1.1}
.appel .porte{margin:2.4vmin auto 0;background:var(--jaune);color:#2a1d00;font-weight:800;font-size:6.5vmin;border-radius:2vmin;padding:1vmin 4vmin;display:inline-block}
.appel.nouveau{animation:flash 1s ease 6}
@keyframes flash{0%,100%{box-shadow:0 0 0 0 #f6c92800}50%{box-shadow:0 0 0 2vmin #f6c92866,0 0 8vmin #f6c928aa}}
@media(prefers-reduced-motion:reduce){.appel.nouveau{animation:none}}
.col{display:flex;flex-direction:column;gap:2.4vmin;min-height:0}
.bloc{background:#ffffff0d;border:.2vmin solid #ffffff22;border-radius:2.4vmin;padding:2vmin 2.4vmin;min-height:0}
.bloc h2{font-size:2vmin;letter-spacing:.22em;text-transform:uppercase;color:#9fd8b9;font-weight:600;margin-bottom:1.2vmin}
.l{display:flex;align-items:center;gap:2vmin;padding:.9vmin 0;border-top:.15vmin solid #ffffff1c;font-size:3vmin}
.l:first-of-type{border-top:0}
.l b{font-family:PF,serif;font-weight:800;color:var(--jaune);min-width:11vmin;font-size:4vmin;font-variant-numeric:tabular-nums}
.l span{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.l em{font-style:normal;font-weight:800;background:#ffffff1f;border-radius:1vmin;padding:.2vmin 1.4vmin}
.chips{display:flex;flex-wrap:wrap;gap:1.2vmin}
.chips i{font-style:normal;font-weight:800;font-size:3.4vmin;border:.25vmin solid #ffffff44;border-radius:1.4vmin;padding:.6vmin 2vmin;font-variant-numeric:tabular-nums}
.chips i:first-child{border-color:var(--jaune);color:var(--jaune)}
footer{padding:1.6vmin 3vmin 2vmin;font-size:2.4vmin;color:#cfe5d9;display:flex;gap:3vmin;align-items:center}
footer b{color:var(--jaune)}
#son{position:fixed;right:2vmin;bottom:2vmin;z-index:5;background:var(--jaune);color:#2a1d00;border:0;border-radius:1.6vmin;padding:1.2vmin 2.4vmin;font:600 2.4vmin ID,sans-serif;cursor:pointer}
body.apercu #son,body.apercu footer{display:none}
.vide{color:#9fd8b9;font-size:3vmin}
@media(max-width:700px) and (orientation:portrait){main{grid-template-columns:1fr;overflow:auto}}
</style>
</head>
<body>
<header><img src="logo.svg" alt=""><h1>Salle d'attente<small>Préfecture de Brazzaville · démonstration</small></h1><div id="heure">--:--</div></header>
<main>
  <section class="appel" id="appel"><div class="lib">Appel en cours</div><div class="num" id="num">---</div><div class="nom" id="nom">En attente du prochain appel</div><div><span class="porte" id="porte" style="display:none"></span></div></section>
  <div class="col">
    <div class="bloc"><h2>Derniers appels</h2><div id="derniers"></div></div>
    <div class="bloc"><h2>Prochains numéros</h2><div class="chips" id="prochains"></div></div>
  </div>
</main>
<footer><span>Quand votre numéro s'affiche avec votre nom, <b>levez-vous</b> et allez à la <b>porte indiquée</b>, avec votre reçu de paiement.</span></footer>
<button id="son">🔊 Activer le son et la voix</button>
<script>
(function () {
  var KEY = 'sp_demo_v3', DAY = 86400000, HOUR = 3600000;
  var apercu = /apercu=1/.test(location.search); if (apercu) document.body.classList.add('apercu');
  var $ = function (s) { return document.querySelector(s); };
  var pad = function (n, l) { return String(n).padStart(l || 2, '0'); };
  var jourService = function (ms) { var d = new Date(ms - 4 * HOUR); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  var son = false, derniere = null, premier = true;
  function lire() { try { var d = JSON.parse(localStorage.getItem(KEY) || '[]'); return Array.isArray(d) ? d : []; } catch (e) { return []; } }
  function nom(d) { return d.person.nom + ' ' + d.person.prenoms; }
  function bip() { try { var C = window.AudioContext || window.webkitAudioContext, a = new C(); [[880, 0], [660, .22], [880, .44]].forEach(function (n) { var o = a.createOscillator(), g = a.createGain(); o.type = 'sine'; o.frequency.value = n[0]; g.gain.setValueAtTime(.0001, a.currentTime + n[1]); g.gain.exponentialRampToValueAtTime(.35, a.currentTime + n[1] + .03); g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + n[1] + .3); o.connect(g); g.connect(a.destination); o.start(a.currentTime + n[1]); o.stop(a.currentTime + n[1] + .32); }); } catch (e) { } }
  function parler(d) { try { var civ = d.person.sexe === 'F' ? 'Madame' : d.person.sexe === 'M' ? 'Monsieur' : ''; var u = new SpeechSynthesisUtterance('Numéro ' + d.ticket + '. ' + civ + ' ' + d.person.prenoms + ' ' + d.person.nom.toLowerCase() + '. Porte ' + d.appel.porte + '.'); u.lang = 'fr-FR'; u.rate = .92; speechSynthesis.cancel(); speechSynthesis.speak(u); } catch (e) { } }
  function maj() {
    var db = lire(), now = Date.now(), j = jourService(now);
    var appels = db.filter(function (d) { return d.appel && jourService(new Date(d.appel.at).getTime()) === j; }).sort(function (a, b) { return b.appel.at.localeCompare(a.appel.at); });
    var attente = db.filter(function (d) { return d.status === 'paye' && d.paiement && jourService(new Date(d.paiement.at).getTime()) === j; }).sort(function (a, b) { return (a.rang != null ? a.rang : a.ticket) - (b.rang != null ? b.rang : b.ticket); });
    var top = appels[0];
    if (top) {
      $('#num').textContent = pad(top.ticket, 3); $('#nom').textContent = nom(top); var p = $('#porte'); p.style.display = ''; p.textContent = '➜ PORTE ' + top.appel.porte;
      var cle = top.id + '@' + top.appel.at;
      if (cle !== derniere) { if (!premier) { var a = $('#appel'); a.classList.remove('nouveau'); void a.offsetWidth; a.classList.add('nouveau'); if (son && !apercu) { bip(); setTimeout(function () { parler(top); }, 900); } } derniere = cle; }
    } else { $('#num').textContent = '---'; $('#nom').textContent = 'En attente du prochain appel'; $('#porte').style.display = 'none'; }
    premier = false;
    $('#derniers').innerHTML = appels.slice(1, 6).map(function (d) { return '<div class="l"><b>' + pad(d.ticket, 3) + '</b><span>' + nom(d).replace(/[<&]/g, '') + '</span><em>Porte ' + d.appel.porte + '</em></div>'; }).join('') || '<div class="vide">—</div>';
    $('#prochains').innerHTML = attente.slice(0, 10).map(function (d) { return '<i>' + pad(d.ticket, 3) + '</i>'; }).join('') || '<span class="vide">Personne n\'attend</span>';
    var h = new Date(); $('#heure').textContent = pad(h.getHours()) + ':' + pad(h.getMinutes());
  }
  $('#son').onclick = function () { son = true; $('#son').style.display = 'none'; bip(); try { speechSynthesis.speak(new SpeechSynthesisUtterance('')); } catch (e) { } };
  window.addEventListener('storage', function (e) { if (e.key === KEY) maj(); });
  setInterval(maj, 1500); maj();
})();
</script>
</body>
</html>
