<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="assets/i18n-v1.js"></script>
<title>KOMYO — Fil</title>
<meta name="theme-color" content="#050B18">
<link rel="icon" href="assets/img/icons/komyo-192-v2.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
  :root{--navy:#241536;--coral:#FF6B4A;--gold:#E8A93D;--gold-light:#f0c47a;--kids:#2f8f6e;}
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;background:#0f0a18;color:#fff;font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none;}
  .disp,h2,h3{font-family:'Sora',Arial,sans-serif;}
  [hidden]{display:none!important;}
  button{font-family:inherit;}

  /* Le fond des vidéos reste sombre à dessein — c'est le noir de la vidéo
     elle-même qui doit ressortir, pas un choix "site sombre". Les écrans
     sans vidéo (chargement, messages, modale) restent clairs. */
  .feed{height:100dvh;overflow-y:scroll;scroll-snap-type:y mandatory;}
  .slide{height:100dvh;scroll-snap-align:start;position:relative;display:flex;align-items:flex-end;background:#000;}
  .slide video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .slide::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg, rgba(0,0,0,.75) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,.35) 100%);pointer-events:none;}

  .deskNav{display:none;position:fixed;left:calc(50% + 270px);top:50%;transform:translateY(-50%);z-index:35;flex-direction:column;gap:14px;}
  .deskNav button{width:52px;height:52px;border-radius:50%;border:1.5px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-size:18px;cursor:pointer;transition:background .2s ease,transform .2s ease;}
  .deskNav button:hover{background:rgba(255,255,255,.24);transform:scale(1.08);}
  @media (max-width:999px){.deskNav{display:none!important;}}
  .topbar{position:fixed;top:0;left:0;right:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;background:linear-gradient(180deg, rgba(0,0,0,.55), transparent);}
  .topbar .brand{font-family:'Sora',sans-serif;font-weight:800;font-size:15px;display:flex;align-items:center;gap:7px;}
  .topbar .brand img{width:26px;height:22px;object-fit:contain;}
  .topbar a.home{font-size:11.5px;font-weight:700;color:rgba(255,255,255,.9);border:1px solid rgba(255,255,255,.3);padding:6px 12px;border-radius:20px;
    text-decoration:none;background:rgba(255,255,255,.08);transition:background .2s ease, transform .2s ease;}
  .topbar a.home:hover{background:rgba(255,255,255,.2);transform:translateY(-1px);}

  .meta{position:relative;z-index:5;padding:0 16px 90px;max-width:78%;}
  .meta .auteur{font-family:'Sora',sans-serif;font-weight:800;font-size:14.5px;margin-bottom:6px;}
  .meta .legende{font-size:13px;line-height:1.5;color:rgba(255,255,255,.92);}

  .actions{position:absolute;right:12px;bottom:100px;z-index:5;display:flex;flex-direction:column;align-items:center;gap:20px;}
  .actions button{background:none;border:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;}
  .actions .icon{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;
    transition:transform .2s ease, background .2s ease;}
  .actions button:hover .icon{transform:scale(1.1);background:rgba(255,255,255,.22);}
  .actions button:active .icon{transform:scale(.92);}
  .actions svg{width:23px;height:23px;}
  .actions .count{font-size:11px;font-weight:700;}
  .like-btn.liked .icon{background:rgba(255,79,109,.25);animation:pop .3s ease;}
  .like-btn.liked svg{fill:#ff4f6d;stroke:#ff4f6d;}
  @keyframes pop{0%{transform:scale(1);}40%{transform:scale(1.28);}100%{transform:scale(1);}}

  /* Notification d'activité (j'aime / commentaire) — façon TikTok, mais
     avec l'avatar bien visible au lieu d'une vignette minuscule. */
  .activity-wrap{position:fixed;top:64px;left:0;right:0;z-index:25;display:flex;flex-direction:column;
    align-items:center;gap:8px;pointer-events:none;padding:0 16px;}
  .activity-toast{display:flex;align-items:center;gap:10px;max-width:420px;width:100%;background:rgba(15,10,24,.86);
    backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:8px 14px 8px 8px;
    box-shadow:0 10px 24px -10px rgba(0,0,0,.6);opacity:0;transform:translateY(-10px);
    animation:toastIn .35s ease forwards, toastOut .35s ease forwards 3.4s;}
  @keyframes toastIn{to{opacity:1;transform:translateY(0);}}
  @keyframes toastOut{to{opacity:0;transform:translateY(-10px);}}
  .activity-toast .avatar{flex:none;width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--coral),var(--gold));
    display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:800;font-size:13px;color:#fff;
    border:2px solid rgba(255,255,255,.5);}
  .activity-toast .txt{font-size:12.5px;line-height:1.4;color:#fff;}
  .activity-toast .txt b{font-family:'Sora',sans-serif;font-weight:800;}
  .activity-toast .emoji{margin-left:2px;}

  /* Bouton + volet commentaires */
  .comment-btn .count{font-size:11px;font-weight:700;}
  .comments-sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;background:rgba(0,0,0,.5);}
  .comments-panel{background:#17101f;color:#fff;width:100%;max-width:480px;margin:0 auto;border-radius:20px 20px 0 0;
    max-height:72vh;display:flex;flex-direction:column;animation:slideUp .3s ease both;}
  .comments-panel h2{font-size:14.5px;margin:0;padding:16px 18px 10px;border-bottom:1px solid rgba(255,255,255,.1);}
  .comments-list{flex:1;overflow-y:auto;padding:10px 16px;display:flex;flex-direction:column;gap:14px;}
  .comment-row{display:flex;gap:10px;align-items:flex-start;}
  .comment-row .avatar{flex:none;width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--coral),var(--gold));
    display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:800;font-size:11.5px;color:#fff;}
  .comment-row .body b{font-family:'Sora',sans-serif;font-size:12.5px;display:block;margin-bottom:2px;}
  .comment-row .body span{font-size:13px;color:rgba(255,255,255,.88);line-height:1.4;}
  .comments-empty{text-align:center;padding:30px 10px;font-size:12.5px;color:rgba(255,255,255,.5);}
  .comment-form{display:flex;gap:8px;padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid rgba(255,255,255,.1);}
  .comment-form input{flex:1;border:none;border-radius:20px;padding:11px 15px;background:rgba(255,255,255,.1);color:#fff;font-size:13px;}
  .comment-form input::placeholder{color:rgba(255,255,255,.4);}
  .comment-form input:focus{outline:2px solid var(--gold);}
  .comment-form button{flex:none;border:none;border-radius:50%;width:40px;height:40px;background:linear-gradient(135deg,var(--coral),var(--gold));
    color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .comment-form button svg{width:18px;height:18px;}

  .mute-hint{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:6;background:rgba(0,0,0,.45);
    width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .2s;}
  .mute-hint.show{opacity:1;}
  .mute-hint svg{width:26px;height:26px;}

  .bottomnav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;align-items:center;justify-content:space-around;
    padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(0deg, rgba(0,0,0,.8), rgba(0,0,0,0));}
  .bottomnav a, .bottomnav button{background:none;border:none;color:rgba(255,255,255,.7);display:flex;flex-direction:column;align-items:center;
    gap:3px;font-size:10px;font-weight:600;cursor:pointer;text-decoration:none;transition:color .2s ease, transform .2s ease;}
  .bottomnav a:hover, .bottomnav button:hover{color:#fff;transform:translateY(-2px);}
  .bottomnav svg{width:22px;height:22px;}
  .bottomnav .add-icon{width:44px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--coral),var(--gold));display:flex;
    align-items:center;justify-content:center;transition:transform .25s ease, box-shadow .25s ease;box-shadow:0 6px 14px -6px rgba(232,169,61,.6);}
  .bottomnav button:hover .add-icon{transform:scale(1.1) rotate(90deg);}
  .bottomnav .add-icon svg{width:18px;height:18px;stroke:#fff;}

  .state{height:100dvh;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;
    background:linear-gradient(160deg,#2a1a42,#0f0a18);}
  .state p{font-size:13px;color:rgba(255,255,255,.75);line-height:1.6;}
  .state a{color:var(--gold-light);font-weight:700;}

  .feed-empty{height:100dvh;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;scroll-snap-align:start;}
  .feed-empty p{font-size:13px;color:rgba(255,255,255,.7);line-height:1.7;}

  /* Upload modal */
  @keyframes slideUp{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
  .modal-backdrop{position:fixed;inset:0;background:rgba(36,21,54,.55);z-index:50;display:flex;align-items:flex-end;}
  .modal{background:#fff;color:#241536;width:100%;border-radius:20px 20px 0 0;padding:20px;max-width:480px;margin:0 auto;
    animation:slideUp .35s ease both;}
  .modal h2{font-size:17px;margin:0 0 14px;}
  .modal label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;}
  .modal input[type=file]{width:100%;margin-bottom:14px;font-size:12.5px;}
  .modal textarea{width:100%;border:1.5px solid #eee2cc;border-radius:10px;padding:10px 12px;font-family:'Inter',sans-serif;
    font-size:13.5px;resize:none;min-height:70px;margin-bottom:14px;transition:border-color .2s ease, box-shadow .2s ease;}
  .modal textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,169,61,.2);}
  .modal .row{display:flex;gap:10px;}
  .modal button.publish{flex:1;border:none;background:linear-gradient(135deg,var(--coral),var(--gold));color:#fff;font-family:'Sora',sans-serif;
    font-weight:800;font-size:14px;padding:13px 0;border-radius:12px;cursor:pointer;transition:transform .2s ease, box-shadow .2s ease;
    box-shadow:0 10px 20px -10px rgba(232,169,61,.55);}
  .modal button.publish:hover{transform:translateY(-2px);box-shadow:0 14px 24px -10px rgba(232,169,61,.7);}
  .modal button.cancel{border:1.5px solid #eee2cc;background:#fff;color:#241536;font-family:'Sora',sans-serif;font-weight:700;
    font-size:13px;padding:13px 16px;border-radius:12px;cursor:pointer;transition:border-color .2s ease, transform .2s ease;}
  .modal button.cancel:hover{border-color:var(--gold);transform:translateY(-1px);}
  .modal .errmsg{display:none;font-size:12px;color:#b3261e;background:#fdecea;border:1px solid #f3c2bd;border-radius:8px;padding:9px 12px;margin-bottom:12px;}
  .modal .errmsg.show{display:block;}
  .modal .infomsg{display:none;font-size:12px;color:#8A6318;background:#FBF3E1;border:1px solid #EDD8A0;border-radius:8px;padding:9px 12px;margin-bottom:12px;}
  .modal .infomsg.show{display:block;}
  .kids-check{display:flex;align-items:flex-start;gap:8px;font-size:11.5px;color:#5b6478;line-height:1.4;margin-bottom:16px;font-weight:600;}
  .kids-check input{margin-top:2px;flex:none;}
</style>

</head>
<body class="pg-fil">

<div id="loadingState" class="state"><p>Chargement du fil…</p></div>
<div id="loggedOutState" class="state" hidden><p>Tu n'es pas connecté.<br><a href="inscription.html">Se connecter / Créer un compte</a></p></div>
<div id="noPersonalState" class="state" hidden>
  <p>Le fil vidéo est réservé au profil personnel.<br>Ajoute un profil pour toi-même depuis ton espace.<br><a href="accueil.html">Retour à mon espace</a></p>
</div>

<div id="feedWrap" hidden>
  <div class="topbar">
    <div class="brand"><img src="assets/img/icons/komyo-k-v2.png" alt="">KOMYO</div>
    <div style="display:flex;align-items:center;gap:10px"><button data-komyo-messages hidden></button><a class="home" href="accueil.html">Mon espace</a></div>
  </div>
  <div class="feed" id="feed"></div>
  <div class="activity-wrap" id="activityWrap"></div>
  <div class="deskNav" aria-label="Vidéo précédente ou suivante"><button type="button" id="dnUp" aria-label="Vidéo précédente">▲</button><button type="button" id="dnDown" aria-label="Vidéo suivante">▼</button></div>
  <div class="bottomnav">
    <a href="accueil.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 11 12 4l8 7M6 10v9h12v-9"/></svg>Accueil</a>
    <button id="btnAdd"><span class="add-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg></span></button>
    <a href="#" style="color:#fff;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 4v16M4 12h16"/></svg>Fil</a>
  </div>
</div>

<div class="comments-sheet" id="commentsSheet" hidden>
  <div class="comments-panel">
    <h2>Commentaires</h2>
    <div class="comments-list" id="commentsList"></div>
    <div class="comment-form">
      <input type="text" id="commentInput" placeholder="Ajouter un commentaire..." maxlength="300">
      <button id="btnSendComment"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg></button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="uploadModal" hidden>
  <div class="modal">
    <h2>Publier une vidéo</h2>
    <div class="errmsg" id="modalErr"></div>
    <div class="infomsg" id="modalInfo"></div>
    <label for="videoFile">Choisis une vidéo</label>
    <input type="file" id="videoFile" accept="video/*">
    <label for="legendeInput">Légende</label>
    <textarea id="legendeInput" placeholder="Raconte ta vidéo..." maxlength="300"></textarea>
    <label class="kids-check">
      <input type="checkbox" id="pourEnfants">
      Vidéo adaptée aux enfants (espace PIOUPIOU) — sera vérifiée avant publication
    </label>
    <div class="row">
      <button class="cancel" id="btnCancel">Annuler</button>
      <button class="publish" id="btnPublish">Publier</button>
    </div>
  </div>
</div>

<script>
(function(){
  var API_VIDEOS = '/api/starvibe-videos';
  var API_AUTH = '/api/starvibe-auth';
  var token = localStorage.getItem('starvibe_token');
  var personalProfileId = null;
  var myAccountId = null;

  var loadingState = document.getElementById('loadingState');
  var loggedOutState = document.getElementById('loggedOutState');
  var noPersonalState = document.getElementById('noPersonalState');
  var feedWrap = document.getElementById('feedWrap');
  var feed = document.getElementById('feed');

  function show(el){ [loadingState, loggedOutState, noPersonalState, feedWrap].forEach(function(e){ e.hidden = (e !== el); }); }

  if (!token){ show(loggedOutState); return; }

  function authFetch(url, opts){
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers, { 'Authorization': 'Bearer ' + token });
    return fetch(url, opts);
  }

  function initials(name){
    if (!name) return '?';
    var parts = name.trim().split(/\s+/);
    return (parts[0][0] + (parts[1] ? parts[1][0] : '')).toUpperCase();
  }

  function heartIcon(filled){
    return '<svg viewBox="0 0 24 24" fill="' + (filled ? 'currentColor' : 'none') + '" stroke="currentColor" stroke-width="2.2"><path d="M12 21s-7.5-4.6-10-9.3C.4 8 2 4.5 5.6 4c2-.3 3.9.6 6.4 3 2.5-2.4 4.4-3.3 6.4-3C22 4.5 23.6 8 22 11.7 19.5 16.4 12 21 12 21z"/></svg>';
  }

  function commentIcon(){
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 11.5a8.4 8.4 0 0 1-8.9 8.4A9 9 0 0 1 4 18.3L2 21l1.3-4.2A8.4 8.4 0 1 1 21 11.5z"/></svg>';
  }

  // ---- Notifications d'activité (j'aime / commentaire), façon TikTok ----
  var activityWrap = document.getElementById('activityWrap');
  var activityQueue = [];
  var activityShowing = false;

  // Photo de profil si la personne en a mis une, sinon ses initiales.
  function avatarCircle(nom, size, photoUrl){
    return '<span class="avatar" style="position:relative;overflow:hidden;' + (size ? 'width:' + size + 'px;height:' + size + 'px;font-size:' + Math.round(size * 0.36) + 'px;' : '') + '">' + initials(nom) +
      (photoUrl ? '<img src="' + esc(photoUrl) + '" alt="" onerror="this.remove()" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover;">' : '') + '</span>';
  }

  function queueActivity(ev){
    if (ev.accountId === myAccountId) return; // on ne se notifie pas soi-même
    activityQueue.push(ev);
    drainActivityQueue();
  }

  function drainActivityQueue(){
    if (activityShowing || !activityQueue.length) return;
    activityShowing = true;
    var ev = activityQueue.shift();
    var txt = ev.type === 'like'
      ? '<b>' + esc(ev.auteur) + '</b> a aimé cette vidéo <span class="emoji">❤️</span>'
      : '<b>' + esc(ev.auteur) + '</b> a commenté : ' + esc(ev.texte.length > 60 ? ev.texte.slice(0, 58) + '…' : ev.texte);
    var toast = document.createElement('div');
    toast.className = 'activity-toast';
    toast.innerHTML = avatarCircle(ev.auteur, 36, ev.photoUrl) + '<span class="txt">' + txt + '</span>';
    activityWrap.appendChild(toast);
    setTimeout(function(){
      toast.remove();
      activityShowing = false;
      drainActivityQueue();
    }, 3900);
  }

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function renderVideo(v){
    var slide = document.createElement('div');
    slide.className = 'slide';
    slide.innerHTML =
      '<video src="' + v.videoUrl + '" loop muted playsinline preload="metadata"></video>' +
      '<div class="mute-hint"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M19 9a5 5 0 0 1 0 6M22 6a9 9 0 0 1 0 12"/></svg></div>' +
      '<div class="actions">' +
        '<button class="like-btn' + (v.likedByMe ? ' liked' : '') + '" data-id="' + v.id + '">' +
          '<span class="icon">' + heartIcon(v.likedByMe) + '</span><span class="count">' + v.likes + '</span>' +
        '</button>' +
        '<button class="comment-btn" data-id="' + v.id + '">' +
          '<span class="icon">' + commentIcon() + '</span><span class="count">' + (v.commentaires || 0) + '</span>' +
        '</button>' +
        (v.estMoi ? '<button class="del-btn" data-id="' + v.id + '" aria-label="Supprimer ma vidéo"><span class="icon"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2m-9 0 1 14h8l1-14M10 11v6M14 11v6"/></svg></span><span class="count">Suppr.</span></button>' : '') +
      '</div>' +
      '<div class="meta"><div class="auteur">@' + v.auteur + '</div><div class="legende">' + (v.legende || '') + '</div></div>';

    var videoEl = slide.querySelector('video');
    var hint = slide.querySelector('.mute-hint');
    var viewed = false;
    var watchStart = null;
    var watchSecondsTotal = 0;

    function sendViewSession(){
      if (watchSecondsTotal <= 0) return;
      var percent = videoEl.duration ? Math.min(100, Math.round(watchSecondsTotal / videoEl.duration * 100)) : 0;
      authFetch(API_VIDEOS, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'fin_vue', videoId: Number(v.id), watchSeconds: Math.round(watchSecondsTotal), percent: percent })
      }).catch(function(){});
      watchSecondsTotal = 0;
    }

    slide.addEventListener('click', function(e){
      if (e.target.closest('.like-btn') || e.target.closest('.del-btn')) return;
      videoEl.muted = !videoEl.muted;
      hint.classList.add('show');
      setTimeout(function(){ hint.classList.remove('show'); }, 500);
    });

    slide.querySelector('.like-btn').addEventListener('click', function(){
      var liked = slide.querySelector('.like-btn').classList.contains('liked');
      authFetch(API_VIDEOS, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: liked ? 'unlike' : 'like', videoId: Number(v.id) })
      }).then(function(res){ return res.json(); }).then(function(data){
        var btn = slide.querySelector('.like-btn');
        btn.classList.toggle('liked', !liked);
        btn.querySelector('.icon').innerHTML = heartIcon(!liked);
        btn.querySelector('.count').textContent = data.likes;
      });
    });

    slide.querySelector('.comment-btn').addEventListener('click', function(){
      openComments(v.id, slide);
    });

    var del = slide.querySelector('.del-btn');
    if (del) del.addEventListener('click', function(){
      if (!window.confirm('Supprimer cette vidéo ? Elle disparaîtra pour tout le monde, avec ses j\'aime et ses commentaires. Cette action est définitive.')) return;
      del.disabled = true;
      authFetch(API_VIDEOS, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ action: 'supprimer', videoId: Number(v.id) })
      }).then(function(res){ return res.json().then(function(d){ return { ok: res.ok, d: d }; }); }).then(function(r){
        if (!r.ok){ del.disabled = false; window.alert(r.d.error || 'Suppression impossible.'); return; }
        slide.remove();
        if (!feed.querySelector('.slide')) feed.innerHTML = '<div class="feed-empty"><p>Aucune vidéo pour le moment.<br>Sois le premier à publier !</p></div>';
      }).catch(function(){ del.disabled = false; window.alert('Connexion interrompue. Réessaie.'); });
    });

    // Activité récente (j'aime / commentaires d'autres personnes) : on ne
    // sonde QUE pendant que cette vidéo est visible, jamais en arrière-plan.
    var activitySince = v.createdAt || new Date().toISOString();
    var activityTimer = null;
    function pollActivity(){
      authFetch(API_VIDEOS + '?activite=1&videoId=' + v.id + '&since=' + encodeURIComponent(activitySince))
        .then(function(res){ return res.json(); })
        .then(function(data){
          activitySince = data.now || activitySince;
          (data.evenements || []).forEach(queueActivity);
        })
        .catch(function(){});
    }

    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if (entry.isIntersecting && entry.intersectionRatio > 0.6){
          videoEl.play().catch(function(){});
          if (!watchStart) watchStart = Date.now();
          if (!viewed){
            viewed = true;
            authFetch(API_VIDEOS, {
              method: 'POST', headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ action: 'vue', videoId: Number(v.id) })
            });
          }
          if (!activityTimer){
            pollActivity();
            activityTimer = setInterval(pollActivity, 6000);
          }
        } else {
          videoEl.pause();
          if (watchStart){ watchSecondsTotal += (Date.now() - watchStart) / 1000; watchStart = null; sendViewSession(); }
          if (activityTimer){ clearInterval(activityTimer); activityTimer = null; }
        }
      });
    }, { threshold: [0, 0.6] });
    io.observe(slide);

    return slide;
  }

  function loadFeed(){
    authFetch(API_VIDEOS).then(function(res){ return res.json(); }).then(function(data){
      var videos = data.videos || [];
      feed.innerHTML = '';
      if (!videos.length){
        feed.innerHTML = '<div class="feed-empty"><p>Aucune vidéo pour le moment.<br>Sois le premier à publier !</p></div>';
      } else {
        videos.forEach(function(v){ feed.appendChild(renderVideo(v)); });
      }
      show(feedWrap);
    });
  }

  authFetch(API_AUTH).then(function(res){ return res.json().then(function(data){ return { ok: res.ok, data: data }; }); })
    .then(function(result){
      if (!result.ok){ localStorage.removeItem('starvibe_token'); show(loggedOutState); return; }
      myAccountId = result.data.account ? result.data.account.id : null;
      var profiles = result.data.profiles || [];
      var personal = profiles.find(function(p){ return p.type_profil === 'personnel'; });
      if (!personal){ show(noPersonalState); return; }
      personalProfileId = personal.id;
      loadFeed();
    })
    .catch(function(){ show(loggedOutState); });

  // ---- Volet commentaires ----
  var commentsSheet = document.getElementById('commentsSheet');
  var commentsList = document.getElementById('commentsList');
  var commentInput = document.getElementById('commentInput');
  var btnSendComment = document.getElementById('btnSendComment');
  var currentCommentVideoId = null;
  var currentCommentSlide = null;

  function commentRowHTML(c){
    return '<div class="comment-row">' + avatarCircle(c.auteur, 32, c.photoUrl) +
      '<div class="body"><b>' + esc(c.auteur) + '</b><span>' + esc(c.texte) + '</span></div></div>';
  }

  function openComments(videoId, slide){
    currentCommentVideoId = videoId;
    currentCommentSlide = slide;
    commentInput.value = '';
    commentsList.innerHTML = '<div class="comments-empty">Chargement…</div>';
    commentsSheet.hidden = false;
    authFetch(API_VIDEOS + '?commentaires=1&videoId=' + videoId)
      .then(function(res){ return res.json(); })
      .then(function(data){
        var list = data.commentaires || [];
        commentsList.innerHTML = list.length
          ? list.map(commentRowHTML).join('')
          : '<div class="comments-empty">Aucun commentaire pour l\'instant.<br>Sois le premier !</div>';
      })
      .catch(function(){ commentsList.innerHTML = '<div class="comments-empty">Impossible de charger les commentaires.</div>'; });
  }

  commentsSheet.addEventListener('click', function(e){
    if (e.target === commentsSheet) commentsSheet.hidden = true;
  });

  function sendComment(){
    var texte = commentInput.value.trim();
    if (!texte || !currentCommentVideoId || !personalProfileId) return;
    btnSendComment.disabled = true;
    authFetch(API_VIDEOS, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'commenter', videoId: Number(currentCommentVideoId), profileId: personalProfileId, texte: texte })
    }).then(function(res){ return res.json(); }).then(function(data){
      btnSendComment.disabled = false;
      if (!data.comment) return;
      commentInput.value = '';
      var empty = commentsList.querySelector('.comments-empty');
      if (empty) empty.remove();
      commentsList.insertAdjacentHTML('afterbegin', commentRowHTML(data.comment));
      if (currentCommentSlide){
        currentCommentSlide.querySelector('.comment-btn .count').textContent = data.commentaires;
      }
    }).catch(function(){ btnSendComment.disabled = false; });
  }
  btnSendComment.addEventListener('click', sendComment);
  commentInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') sendComment(); });

  // Upload modal
  var uploadModal = document.getElementById('uploadModal');
  var btnAdd = document.getElementById('btnAdd');
  var btnCancel = document.getElementById('btnCancel');
  var btnPublish = document.getElementById('btnPublish');
  var videoFile = document.getElementById('videoFile');
  var legendeInput = document.getElementById('legendeInput');
  var modalErr = document.getElementById('modalErr');
  var modalInfo = document.getElementById('modalInfo');
  var pourEnfants = document.getElementById('pourEnfants');

  btnAdd.addEventListener('click', function(){
    modalErr.classList.remove('show');
    modalInfo.classList.remove('show');
    videoFile.value = '';
    legendeInput.value = '';
    pourEnfants.checked = false;
    uploadModal.hidden = false;
  });

  // Ordinateur : flèches ▲ ▼ et touches du clavier pour passer d'une vidéo à l'autre
  (function(){
    var f = document.getElementById('feed');
    function aller(sens){ if (f) f.scrollBy({ top: sens * f.clientHeight, behavior: 'smooth' }); }
    var up = document.getElementById('dnUp'), dn = document.getElementById('dnDown');
    if (up) up.addEventListener('click', function(){ aller(-1); });
    if (dn) dn.addEventListener('click', function(){ aller(1); });
    document.addEventListener('keydown', function(e){
      var t = e.target && e.target.tagName; if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT') return;
      if (e.key === 'ArrowDown' || e.key === 'PageDown' || e.key === 'j'){ e.preventDefault(); aller(1); }
      else if (e.key === 'ArrowUp' || e.key === 'PageUp' || e.key === 'k'){ e.preventDefault(); aller(-1); }
    });
  })();
  var annulerCompression = null;
  btnCancel.addEventListener('click', function(){ if (annulerCompression) annulerCompression(); uploadModal.hidden = true; });

  // ---------- Réduction de la vidéo sur le téléphone avant l'envoi (si elle est lourde) ----------
  // La vidéo est relue en 720 p maximum et réenregistrée (≈ la durée de la vidéo), avec un débit calculé pour tenir sous 36 Mo.
  var SEUIL = 25000000, LIMITE = 40000000, DUREE_MAX = 300;
  function peutCompresser(){
    return !!(window.MediaRecorder && HTMLCanvasElement.prototype.captureStream && (window.AudioContext || window.webkitAudioContext));
  }
  function compresser(file, onPct){
    return new Promise(function(resolve, reject){
      var url = URL.createObjectURL(file), v = document.createElement('video'), fin = false, raf = 0, ac = null, rec = null;
      function nettoyer(){ fin = true; cancelAnimationFrame(raf); try { v.pause(); } catch (e) {} try { URL.revokeObjectURL(url); } catch (e) {} try { if (ac) ac.close(); } catch (e) {} }
      annulerCompression = function(){ if (fin) return; nettoyer(); try { if (rec && rec.state !== 'inactive') rec.stop(); } catch (e) {} reject(new Error('annule')); };
      v.playsInline = true; v.setAttribute('playsinline', ''); v.preload = 'auto'; v.src = url;
      v.onerror = function(){ nettoyer(); reject(new Error('lecture')); };
      v.onloadedmetadata = function(){
        var dur = v.duration;
        if (!isFinite(dur) || dur <= 0){ nettoyer(); reject(new Error('lecture')); return; }
        if (dur > DUREE_MAX){ nettoyer(); reject(new Error('trop_longue')); return; }
        var k = Math.min(1, 720 / Math.min(v.videoWidth, v.videoHeight)), cw = Math.max(2, Math.round(v.videoWidth * k / 2) * 2), ch = Math.max(2, Math.round(v.videoHeight * k / 2) * 2);
        var cv = document.createElement('canvas'); cv.width = cw; cv.height = ch; var cx = cv.getContext('2d');
        var AC = window.AudioContext || window.webkitAudioContext, stream, mime;
        try {
          ac = new AC(); var src = ac.createMediaElementSource(v), dest = ac.createMediaStreamDestination(); src.connect(dest);   // le son part dans l'enregistrement, pas dans les haut-parleurs
          stream = cv.captureStream(24); dest.stream.getAudioTracks().forEach(function(t){ stream.addTrack(t); });
          mime = ['video/mp4;codecs=avc1.42E01E,mp4a.40.2', 'video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm'].filter(function(t){ return MediaRecorder.isTypeSupported(t); })[0];
          if (!mime) throw new Error('format');
          var bits = Math.max(900000, Math.min(3000000, Math.floor(36e6 * 8 / dur) - 100000));
          rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: bits, audioBitsPerSecond: 96000 });
        } catch (e){ nettoyer(); reject(e); return; }
        var parts = [];
        rec.ondataavailable = function(e){ if (e.data && e.data.size) parts.push(e.data); };
        rec.onstop = function(){ if (fin && !parts.length) return; nettoyer(); resolve(new Blob(parts, { type: mime.split(';')[0] })); };
        function dessiner(){
          if (fin) return;
          cx.drawImage(v, 0, 0, cw, ch); onPct(Math.min(99, Math.round(v.currentTime / dur * 100)));
          raf = requestAnimationFrame(dessiner);
        }
        v.onended = function(){ setTimeout(function(){ try { if (rec.state !== 'inactive') rec.stop(); } catch (e) {} }, 300); };
        try { rec.start(1000); if (ac.state === 'suspended') ac.resume(); } catch (e){ nettoyer(); reject(e); return; }
        v.play().then(dessiner).catch(function(e){ nettoyer(); reject(e); });
      };
    });
  }

  btnPublish.addEventListener('click', function(){
    var file = videoFile.files[0];
    if (!file){ modalErr.textContent = 'Choisis une vidéo.'; modalErr.classList.add('show'); return; }
    if (!personalProfileId){ modalErr.textContent = 'Profil personnel introuvable.'; modalErr.classList.add('show'); return; }

    modalErr.classList.remove('show'); modalInfo.classList.remove('show');
    btnPublish.disabled = true;
    btnPublish.textContent = 'Publication...';
    function echec(msg){ btnPublish.disabled = false; btnPublish.textContent = 'Publier'; modalInfo.classList.remove('show'); modalErr.textContent = msg; modalErr.classList.add('show'); }

    var prete;
    if (file.size > SEUIL && peutCompresser()){
      modalInfo.textContent = 'Vidéo lourde : je la réduis pour qu\'elle parte vite. Garde l\'écran allumé et ne quitte pas cette page.'; modalInfo.classList.add('show');
      prete = compresser(file, function(p){ btnPublish.textContent = 'Préparation ' + p + ' %'; }).then(function(b){ modalInfo.classList.remove('show'); return b; }).catch(function(e){
        modalInfo.classList.remove('show');
        if (e && e.message === 'annule') throw e;
        if (e && e.message === 'trop_longue') throw new Error('Vidéo trop longue (5 minutes maximum).');
        if (file.size <= LIMITE) return file;                                   // la réduction a échoué mais la vidéo passe telle quelle
        throw new Error('Impossible de réduire cette vidéo sur ton téléphone. Choisis une vidéo plus courte.');
      });
    } else if (file.size > LIMITE){
      echec('Vidéo trop volumineuse (limite 40 Mo). Choisis une vidéo plus courte.'); return;
    } else prete = Promise.resolve(file);

    prete.then(function(f){ televerser(f, echec); }).catch(function(e){ if (e && e.message !== 'annule') echec(e.message || 'Préparation impossible.'); else { btnPublish.disabled = false; btnPublish.textContent = 'Publier'; } });
  });

  function televerser(file, echecFn){
    if (file.size > LIMITE){ echecFn('Vidéo trop volumineuse (limite 40 Mo) même après réduction. Choisis une vidéo plus courte.'); return; }
    btnPublish.disabled = true;
    // La vidéo part en morceaux de 3 Mo (un seul envoi dépasserait la limite du serveur), chaque morceau est retenté si le réseau flanche.
    var CH = 3000000, n = Math.max(1, Math.ceil(file.size / CH));
    var id = Math.random().toString(36).slice(2, 12) + Date.now().toString(36);
    function morceau(i, essai){
      return authFetch(API_VIDEOS + '?chunk=1&id=' + id + '&i=' + i + '&n=' + n, {
        method: 'POST', headers: { 'Content-Type': 'application/octet-stream' }, body: file.slice(i * CH, (i + 1) * CH)
      }).then(function(res){
        return res.json().catch(function(){ return {}; }).then(function(d){
          if (!res.ok){ var e = new Error(d.error || 'Envoi interrompu.'); e.serveur = true; throw e; }
        });
      }).catch(function(e){
        if (e && e.serveur) throw e;
        if (essai < 3) return new Promise(function(r){ setTimeout(r, 800 * essai); }).then(function(){ return morceau(i, essai + 1); });
        throw e;
      });
    }
    function envoyer(i){
      if (i >= n) return Promise.resolve();
      btnPublish.textContent = 'Envoi ' + Math.round(i * 100 / n) + ' %';
      return morceau(i, 1).then(function(){ return envoyer(i + 1); });
    }

    envoyer(0).then(function(){
      btnPublish.textContent = 'Publication...';
      return authFetch(API_VIDEOS, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          action: 'publier',
          profileId: personalProfileId,
          legende: legendeInput.value.trim(),
          typeMime: file.type || 'video/mp4',
          uploadId: id,
          nChunks: n,
          pourEnfants: pourEnfants.checked
        })
      });
    }).then(function(res){ return res.json().then(function(data){ return { ok: res.ok, data: data }; }); })
      .then(function(result){
        btnPublish.disabled = false;
        btnPublish.textContent = 'Publier';
        if (!result.ok){
          modalErr.textContent = result.data.error || 'Erreur lors de la publication.';
          modalErr.classList.add('show');
          return;
        }
        if (result.data.video && result.data.video.moderationStatut === 'en_attente'){
          modalInfo.textContent = 'Vidéo envoyée ! Elle sera vérifiée avant d\'apparaître dans l\'espace PIOUPIOU.';
          modalInfo.classList.add('show');
          loadFeed();
          return;
        }
        uploadModal.hidden = true;
        loadFeed();
      })
      .catch(function(e){
        btnPublish.disabled = false;
        btnPublish.textContent = 'Publier';
        modalErr.textContent = (e && e.serveur) ? e.message : 'Connexion interrompue. Vérifie ton réseau puis réessaie.';
        modalErr.classList.add('show');
      });
  }
})();
</script>
