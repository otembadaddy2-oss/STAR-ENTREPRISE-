<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="assets/i18n-v2.js"></script>
<title>KOMYO — Myo, mes amis</title>
<meta name="theme-color" content="#FFFBF3">
<link rel="icon" href="assets/img/icons/komyo-192-v2.png" type="image/png">
<link rel="preload" href="/starvibe/assets/fonts/inter-latin-v1.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/starvibe/assets/fonts/komyo-fonts-v1.css">
<style>
  :root{--ink:#241536;--gold:#E8A93D;--coral:#FF6B4A;--cream:#FFFBF3;--dim:#6b5f80;--line:#eee2cc;--ok:#1f8f4a;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Sora',Arial,sans-serif;}
  [hidden]{display:none!important;}
  .top{background:linear-gradient(120deg,var(--coral),var(--gold));color:#fff;padding:calc(16px + env(safe-area-inset-top)) 20px 26px;border-radius:0 0 26px 26px;}
  .top a{color:#fff;text-decoration:none;font:700 13px 'Sora',Arial,sans-serif;}
  .top h1{margin:10px 0 2px;font-size:28px;letter-spacing:.02em;}
  .top p{margin:0;font-size:13px;opacity:.92;}
  .wrap{max-width:480px;margin:0 auto;padding:16px 20px 60px;}
  .tabs{display:flex;gap:8px;margin:2px 0 14px;}
  .tabs button{flex:1;border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:14px;padding:11px 6px;font:700 13px 'Sora',Arial,sans-serif;cursor:pointer;position:relative;}
  .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .badge{display:inline-block;min-width:18px;padding:1px 6px;margin-left:4px;border-radius:999px;background:#e5322e;color:#fff;font-size:11px;}
  .item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:10px;}
  .av{width:44px;height:44px;border-radius:50%;flex:none;background:linear-gradient(135deg,var(--coral),var(--gold));color:#fff;display:flex;align-items:center;justify-content:center;font:800 14px 'Sora',Arial,sans-serif;position:relative;overflow:hidden;}
  .av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .nm{flex:1;min-width:0;font:700 14px 'Sora',Arial,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .nm small{display:block;font:500 11.5px 'Inter',Arial,sans-serif;color:var(--dim);margin-top:2px;}
  .b{border:none;border-radius:12px;padding:9px 12px;font:800 12.5px 'Sora',Arial,sans-serif;cursor:pointer;}
  .b.yes{background:linear-gradient(135deg,#2fb35f,#1f8f4a);color:#fff;}.b.no{background:#f1ecf7;color:var(--ink);}.b.inv{background:linear-gradient(135deg,var(--coral),var(--gold));color:#fff;}.b.off{background:#eef6f0;color:var(--ok);cursor:default;}
  .b:disabled{opacity:.6;}
  .search{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;font:500 15px 'Inter',Arial,sans-serif;background:#fff;margin-bottom:12px;}
  .search:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(232,169,61,.2);}
  .empty{text-align:center;color:var(--dim);font-size:14px;padding:26px 10px;line-height:1.5;}
  .note{font-size:12px;color:var(--dim);margin:12px 0;line-height:1.45;}
  .kaba-choix{display:flex;align-items:center;gap:8px;margin:-4px 0 10px;padding:8px 12px;font-size:12.5px;color:var(--dim);background:#fffaf0;border:1px dashed var(--line);border-radius:12px;}
  .err{background:#fdecea;color:#b3261e;border:1px solid #f3c2bd;border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:10px;}
</style>
<link rel="stylesheet" href="assets/komyo-bureau-v2.css" media="(min-width:1000px)">
</head>
<body class="pg-myo">
<div class="top"><a href="accueil.html">← Mon espace</a><h1>Myo</h1><p>Invite des personnes à te suivre et à devenir amis.</p></div>
<div class="wrap">
  <div id="out" class="empty" hidden>Connecte-toi à KOMYO pour utiliser Myo.<br><a href="inscription.html" style="color:var(--coral);font-weight:700">Se connecter / Créer un compte</a></div>
  <div id="app" hidden>
    <div class="tabs"><button data-t="amis" class="on">Amis</button><button data-t="recues">Invitations <span class="badge" data-myo-count hidden></span></button><button data-t="contacts">Contacts</button><button data-t="chercher">Chercher</button></div>
    <div id="err" class="err" hidden></div>
    <div id="list"></div>
  </div>
</div>
<script src="assets/myo-v1.js"></script>
<script>
(function(){
  var token = ''; try { token = localStorage.getItem('starvibe_token') || ''; } catch (e) {}
  var out = document.getElementById('out'), app = document.getElementById('app');
  if (!token){ out.hidden = false; return; }
  app.hidden = false;
  var list = document.getElementById('list'), errBox = document.getElementById('err'), tab = 'amis', timer = null;
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
  function ini(n){ var p = String(n||'?').trim().split(/\s+/); return ((p[0]||'?')[0] + (p[1] ? p[1][0] : '')).toUpperCase(); }
  function av(p){ return '<div class="av">' + esc(ini(p.nom)) + (p.photoUrl ? '<img src="' + esc(p.photoUrl) + '" alt="" onerror="this.remove()">' : '') + '</div>'; }
  function api(opts){ return window.komyoMyo ? window.komyoMyo.api(opts) : Promise.reject(); }
  function erreur(m){ errBox.textContent = m || ''; errBox.hidden = !m; }
  function get(q){ return api({ q: q }).then(function(r){ if (r.status === 401){ localStorage.removeItem('starvibe_token'); location.reload(); } return r.json(); }); }

  function amis(){
    get('?amis=1').then(function(d){
      var a = d.amis || [];
      list.innerHTML = a.length ? a.map(function(p){ return '<div class="item">' + av(p) + '<div class="nm">' + esc(p.nom) + '<small>Ami · vous vous suivez</small></div><button class="b inv" data-kaba="' + p.profilId + '">Kaba+</button><button class="b no" data-retirer="' + p.profilId + '">Retirer</button></div><div class="kaba-choix" id="kc-' + p.profilId + '" hidden><span>Demander son :</span><button class="b inv" data-kt="gmail" data-p="' + p.profilId + '">Gmail</button><button class="b inv" data-kt="whatsapp" data-p="' + p.profilId + '">WhatsApp</button></div>'; }).join('') :
        '<div class="empty">Tu n\'as pas encore d\'amis sur Myo.<br>Va dans « Chercher » ou touche « Inviter » sur le fil.</div>';
    });
  }
  function recues(){
    get('?recues=1').then(function(d){
      var a = d.invitations || [];
      list.innerHTML = a.length ? a.map(function(i){ return '<div class="item">' + av(i.de) + '<div class="nm">' + esc(i.de.nom) + '<small>t\'invite à devenir ami</small></div><button class="b yes" data-rep="oui" data-id="' + i.id + '">Oui</button><button class="b no" data-rep="non" data-id="' + i.id + '">Non</button></div>'; }).join('') :
        '<div class="empty">Aucune invitation en attente.</div>';
    });
  }
  function lien(c){ return c.type === 'gmail' ? 'mailto:' + c.valeur : 'https://wa.me/' + String(c.valeur).replace(/[^0-9]/g, ''); }
  function contacts(){
    get('?contacts=1').then(function(d){
      var a = d.contacts || [];
      list.innerHTML = a.length ? a.map(function(c){ return '<div class="item">' + av(c.de) + '<div class="nm">' + esc(c.de.nom) + '<small>' + (c.type === 'gmail' ? 'Gmail' : 'WhatsApp') + ' : ' + esc(c.valeur) + '</small></div><a class="b yes" style="text-decoration:none" target="_blank" rel="noopener" href="' + esc(lien(c)) + '">Ouvrir</a><button class="b no" data-copy="' + esc(c.valeur) + '">Copier</button></div>'; }).join('') :
        '<div class="empty">Aucun contact partagé pour l\'instant.<br>Dans « Amis », touche <b>Kaba+</b> à côté d\'un ami pour lui demander son Gmail ou son WhatsApp. Il choisit de partager ou non.</div>';
    });
  }
  function bouton(p){
    if (p.etat === 'amis') return '<button class="b off" disabled>Amis ✓</button>';
    if (p.etat === 'envoyee') return '<button class="b off" disabled>Envoyée</button>';
    if (p.etat === 'attente') return '<button class="b off" disabled>Plus tard</button>';
    if (p.etat === 'recue') return '<button class="b yes" data-inv="' + p.profilId + '">Accepter</button>';
    return '<button class="b inv" data-inv="' + p.profilId + '">Inviter</button>';
  }
  function chercher(){
    list.innerHTML = '<input class="search" id="q" type="search" placeholder="Écris un nom (2 lettres minimum)" autocomplete="off" aria-label="Chercher une personne"><div id="res"></div><p class="note">Tu ne vois que des personnes de ton âge : les invitations entre adultes et mineurs ne sont pas possibles.</p>';
    var q = document.getElementById('q'), res = document.getElementById('res');
    q.addEventListener('input', function(){ clearTimeout(timer); timer = setTimeout(function(){
      var v = q.value.trim(); if (v.length < 2){ res.innerHTML = ''; return; }
      get('?chercher=' + encodeURIComponent(v)).then(function(d){ var a = d.profils || []; res.innerHTML = a.length ? a.map(function(p){ return '<div class="item">' + av(p) + '<div class="nm">' + esc(p.nom) + '</div>' + bouton(p) + '</div>'; }).join('') : '<div class="empty">Personne trouvé avec ce nom.</div>'; });
    }, 350); });
    q.focus();
  }
  function voir(){ erreur(''); if (tab === 'amis') amis(); else if (tab === 'recues') recues(); else if (tab === 'contacts') contacts(); else chercher(); }
  [].forEach.call(document.querySelectorAll('.tabs button'), function(b){ b.addEventListener('click', function(){ tab = b.getAttribute('data-t'); [].forEach.call(document.querySelectorAll('.tabs button'), function(x){ x.classList.toggle('on', x === b); }); voir(); }); });
  list.addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    if (b.hasAttribute('data-rep')){ b.disabled = true; window.komyoMyo.api({ body: { action: 'repondre', id: Number(b.getAttribute('data-id')), reponse: b.getAttribute('data-rep') } }).then(function(r){ return r.json(); }).then(function(d){ if (d.error) erreur(d.error); window.komyoMyo.verifier(); voir(); }); }
    else if (b.hasAttribute('data-inv')){ b.disabled = true; window.komyoMyo.inviter(b.getAttribute('data-inv')).then(function(r){ if (!r.ok){ erreur(r.d.error || 'Invitation impossible.'); b.disabled = false; return; } erreur(''); b.className = 'b off'; b.textContent = r.d.etat === 'amis' ? 'Amis ✓' : 'Envoyée'; }); }
    else if (b.hasAttribute('data-kaba')){ var box = document.getElementById('kc-' + b.getAttribute('data-kaba')); if (box) box.hidden = !box.hidden; }
    else if (b.hasAttribute('data-kt')){ b.disabled = true; window.komyoMyo.api({ body: { action: 'kaba_demander', profilId: Number(b.getAttribute('data-p')), type: b.getAttribute('data-kt') } }).then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); }).then(function(res){ b.disabled = false; if (!res.ok){ erreur(res.d.error || 'Demande impossible.'); return; } erreur(''); var box = document.getElementById('kc-' + b.getAttribute('data-p')); box.innerHTML = '<span>' + (res.d.etat === 'recu' ? 'Tu as déjà reçu ce contact (voir Contacts).' : 'Demande envoyée ✓ Ton ami la verra tout de suite.') + '</span>'; }); }
    else if (b.hasAttribute('data-copy')){ try { navigator.clipboard.writeText(b.getAttribute('data-copy')); b.textContent = 'Copié ✓'; } catch (x) {} }
    else if (b.hasAttribute('data-retirer')){ if (!confirm('Retirer cette personne de tes amis ?')) return; b.disabled = true; window.komyoMyo.api({ body: { action: 'retirer', profilId: Number(b.getAttribute('data-retirer')) } }).then(function(){ voir(); }); }
  });
  if (/[?&]onglet=(recues|chercher|contacts)/.test(location.search)){ tab = RegExp.$1; [].forEach.call(document.querySelectorAll('.tabs button'), function(x){ x.classList.toggle('on', x.getAttribute('data-t') === tab); }); }
  setTimeout(voir, 50);
})();
</script>
</body>
</html>
