<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="assets/i18n-v1.js"></script>
<title>KOMYO — Mon abonnement</title>
<meta name="theme-color" content="#FFFBF3">
<link rel="icon" href="assets/img/icons/komyo-192-v2.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
  :root{--navy:#241536;--coral:#FF6B4A;--gold:#E8A93D;--gold-light:#f0c47a;--cream:#FFFBF3;--text-dim:#6b5f80;--text-faint:#a49bb8;--line:#eee2cc;--kids:#2f8f6e;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--navy);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.disp{font-family:'Sora',Arial,sans-serif;}
  img{max-width:100%;display:block;}
  a{color:inherit;}
  .wrap{max-width:480px;margin:0 auto;padding-inline:20px;}
  [hidden]{display:none!important;}

  .topbar{background:linear-gradient(120deg,var(--coral),var(--gold));color:#fff;padding:18px 20px 44px;border-radius:0 0 26px 26px;}
  .topbar .row{display:flex;align-items:center;justify-content:space-between;}
  .topbar h1{font-size:16px;margin:0;}
  .topbar a.back{font-size:11.5px;font-weight:700;color:#fff;border:1.5px solid rgba(255,255,255,.4);padding:7px 13px;border-radius:20px;
    text-decoration:none;background:rgba(255,255,255,.1);transition:background .2s ease, transform .2s ease;}
  .topbar a.back:hover{background:rgba(255,255,255,.22);transform:translateY(-1px);}
  .topbar p{font-size:12px;color:rgba(255,255,255,.9);margin:4px 0 0;}

  .content{margin-top:-26px;}
  .plan-card{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:20px;margin-bottom:14px;position:relative;
    transition:transform .3s ease, box-shadow .3s ease;}
  .plan-card:hover{transform:translateY(-4px);box-shadow:0 14px 26px -16px rgba(36,21,54,.28);}
  .plan-card.active{border-color:var(--gold);box-shadow:0 8px 24px -10px rgba(232,169,61,.35);}
  .plan-card.famille{border-color:rgba(47,143,110,.35);}
  .plan-card.famille.active{border-color:var(--kids);}
  .plan-badge{position:absolute;top:-10px;right:16px;background:var(--gold);color:#fff;font-family:'Sora',sans-serif;font-weight:800;
    font-size:10px;padding:4px 10px;border-radius:20px;}
  .plan-card.famille .plan-badge{background:var(--kids);}
  .plan-name{font-size:15px;font-weight:800;margin:0 0 4px;}
  .plan-price{font-family:'Sora',sans-serif;font-weight:800;font-size:22px;color:var(--navy);margin-bottom:4px;}
  .plan-price span{font-size:12px;font-weight:600;color:var(--text-faint);}
  .plan-price .eq{display:block;font-size:12px;font-weight:600;color:var(--text-faint);margin-top:2px;}
  .plan-price .eq:empty{display:none;}
  .plan-desc{font-size:12.5px;color:var(--text-dim);line-height:1.5;margin-bottom:14px;}
  .plan-btn{width:100%;border:none;border-radius:12px;padding:12px 0;font-family:'Sora',sans-serif;font-weight:800;font-size:13.5px;cursor:pointer;
    transition:transform .2s ease, box-shadow .2s ease;}
  .plan-btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 20px -10px rgba(36,21,54,.35);}
  .plan-btn.gratuit{background:#f3ede0;color:var(--navy);}
  .plan-btn.famille{background:linear-gradient(135deg,#3fae82,var(--kids));color:#fff;}
  .plan-btn.business{background:linear-gradient(135deg,var(--coral),var(--gold));color:#fff;}
  .plan-btn:disabled{opacity:.55;cursor:default;}
  .current-tag{font-size:11px;font-weight:700;color:var(--gold);text-align:center;padding:10px 0;}
  .current-tag.famille{color:var(--kids);}

  .pay-box{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px;
    animation:fadeUp .5s ease both;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
  .pay-box h2{font-size:15px;margin:0 0 10px;}
  .pay-box .amount{font-family:'Sora',sans-serif;font-weight:800;font-size:26px;color:var(--navy);margin-bottom:12px;}
  .pay-row{display:flex;justify-content:space-between;font-size:12.5px;padding:9px 0;border-bottom:1px solid var(--line);}
  .pay-row:last-of-type{border-bottom:none;}
  .pay-row b{color:var(--navy);}
  .pay-note{font-size:11.5px;color:var(--text-dim);line-height:1.6;background:#FBF3E1;border:1px solid #EDD8A0;border-radius:10px;padding:10px 12px;margin-top:12px;}
  .btn-refresh{width:100%;border:1.5px solid var(--line);background:#fff;color:var(--navy);font-family:'Sora',sans-serif;font-weight:700;
    font-size:13px;padding:12px 0;border-radius:12px;cursor:pointer;margin-top:12px;transition:border-color .2s ease, transform .2s ease;}
  .btn-refresh:hover{border-color:var(--gold);transform:translateY(-1px);}

  .state{text-align:center;padding:60px 20px;}
  .state p{font-size:13px;color:var(--text-dim);}
  .state a{color:var(--navy);font-weight:700;border-bottom:1.5px solid var(--gold);}

  footer{padding:20px;text-align:center;}
  footer .credit{font-size:10px;color:var(--text-faint);}
  footer .credit b{color:var(--text-dim);}
  .gift{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:20px;margin:6px 0 14px;}
  .gift h2{font-size:17px;margin:0 0 4px;} .gift .hint{font-size:12.5px;color:var(--text-dim,#6b5f80);margin:0 0 10px;line-height:1.5;}
  .gift label.lbl{display:block;font-size:12px;font-weight:700;margin:12px 0 5px;color:var(--text-dim,#6b5f80);}
  .gift input[type=text],.gift input[type=tel]{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:12px;font:inherit;}
  .gift .found{margin-top:8px;font-size:13px;font-weight:700;color:#1f8f4a;} .gift .err{margin-top:8px;font-size:13px;color:#b3261e;}
  .gift .methods{display:grid;gap:8px;margin-top:4px;} .gift .m{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;font-size:14px;cursor:pointer;}
  .gift .m.on{border-color:var(--gold,#e8a93d);background:#fff8e8;} .gift .m.off{opacity:.55;cursor:not-allowed;}
  .gift .secu{margin-top:12px;font-size:12px;background:#fff9e9;border-left:3px solid #e8a93d;padding:9px 11px;border-radius:6px;line-height:1.5;}
  .gift .go{width:100%;margin-top:14px;padding:14px;border:0;border-radius:12px;font:inherit;font-weight:800;font-size:15px;color:#fff;background:#b8b2c6;cursor:not-allowed;}
  .gift .go.pret{background:var(--ink,#241536);cursor:pointer;} .gift .go.ok{background:#1f8f4a;cursor:default;}
  .gift .suivi{margin-top:12px;font-size:13px;line-height:1.6;}
</style>
<link rel="manifest" href="manifest-komyo.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KOMYO">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="assets/img/icons/komyo-apple-180-v2.png">
<link rel="stylesheet" href="assets/komyo-bureau-v1.css" media="(min-width:1000px)">
</head>
<body class="pg-abonnement">

<div id="loadingState" class="state"><p>Chargement…</p></div>
<div id="loggedOutState" class="state" hidden><p>Tu n'es pas connecté.<br><a href="inscription.html?mode=login">Se connecter / Créer un compte</a></p></div>

<div id="appState" hidden>
  <div class="topbar">
    <div class="row">
      <h1>Mon abonnement KOMYO</h1>
      <a class="back" href="accueil.html">← Mon espace</a>
    </div>
    <p>Choisis la formule adaptée à ta famille ou à ton activité.</p>
  </div>

  <div class="wrap content">
    <div id="payBox" hidden></div>
    <div id="plansList"></div>
    <div id="autreEnfant"></div>
    <div id="mesRecus"></div>
  </div>
</div>

<footer>
  <div class="credit"><b>STAR ENTREPRISE</b> — Tous droits réservés.</div>
</footer>

<script>
(function(){
  var API = '/api/starvibe-subscription';
  var token = localStorage.getItem('starvibe_token');

  var loadingState = document.getElementById('loadingState');
  var loggedOutState = document.getElementById('loggedOutState');
  var appState = document.getElementById('appState');
  var plansList = document.getElementById('plansList');
  var payBox = document.getElementById('payBox');

  if (!token){ loadingState.hidden = true; loggedOutState.hidden = false; return; }

  function authFetch(url, opts){
    opts = opts || {};
    opts.headers = Object.assign({}, opts.headers, { 'Authorization': 'Bearer ' + token });
    return fetch(url, opts);
  }

  var PLAN_ORDER = ['gratuit', 'famille', 'business'];

  function renderPayBox(sub){
    if (sub.statut !== 'en_attente_paiement'){ payBox.hidden = true; payBox.innerHTML = ''; return; }
    payBox.hidden = false;
    payBox.innerHTML =
      '<div class="pay-box">' +
        '<h2>Paiement en attente</h2>' +
        '<div class="amount">' + sub.montantAttendu.toLocaleString('fr-FR') + ' FCFA</div>' +
        '<div class="pay-row"><span>Envoyer via Mobile Money au</span><b>' + sub.numeroReception + '</b></div>' +
        '<div class="pay-row"><span>Référence à indiquer</span><b>' + sub.referencePaiement + '</b></div>' +
        '<div class="pay-note">Envoie le montant exact avec la référence ci-dessus. Un compte STAR ENTREPRISE confirme la réception et active ton plan pour 30 jours ; tu reçois ensuite ton reçu détaillé par WhatsApp.</div>' +
        '<label for="payMontant" style="display:block;margin-top:12px;font-weight:700;font-size:14px">Montant que tu as déposé (en FCFA)</label>' +
        '<input id="payMontant" type="text" inputmode="numeric" maxlength="12" autocomplete="off" placeholder="' + sub.montantAttendu.toLocaleString('fr-FR') + '" style="width:100%;margin-top:6px;padding:11px 12px;border:1.5px solid #eee2cc;border-radius:12px;font:600 15px inherit">' +
        '<div id="payMontantMsg" data-noconv class="pay-note" aria-live="polite">Écris le montant de ton dépôt : exactement ' + sub.montantAttendu.toLocaleString('fr-FR') + ' FCFA.</div>' +
        '<button class="btn-refresh" id="btnRefresh" disabled>Actualiser mon statut</button>' +
      '</div>';
    var attendu = sub.montantAttendu, champ = document.getElementById('payMontant'), msg = document.getElementById('payMontantMsg'), bt = document.getElementById('btnRefresh');
    function fmt(n){ return n.toLocaleString('fr-FR'); }
    function controle(){
      var d = String(champ.value).replace(/[^0-9]/g, ''), m = d ? parseInt(d, 10) : null, ok = false;
      if (m === null) msg.textContent = 'Écris le montant de ton dépôt : exactement ' + fmt(attendu) + ' FCFA.';
      else if (m < attendu) msg.textContent = 'Montant incorrect : ' + fmt(m) + ' FCFA est inférieur. Dépose exactement ' + fmt(attendu) + ' FCFA, puis écris-le ici.';
      else if (m > attendu) msg.textContent = 'Montant incorrect : ' + fmt(m) + ' FCFA est supérieur. Le montant exact est ' + fmt(attendu) + ' FCFA.';
      else { msg.textContent = 'Montant correct ✓ L\'équipe active ton plan dès qu\'elle voit ton dépôt.'; ok = true; }
      bt.disabled = !ok;
    }
    champ.addEventListener('input', controle);
    bt.addEventListener('click', load);
  }

  function renderPlans(current, plans){
    plansList.innerHTML = '';
    PLAN_ORDER.forEach(function(key){
      var p = plans[key];
      var isActive = current.plan === key && current.statut === 'actif';
      var isPending = current.plan === key && current.statut === 'en_attente_paiement';
      var card = document.createElement('div');
      card.className = 'plan-card ' + key + (isActive ? ' active' : '');
      var priceLabel = p.montant === 0 ? 'Gratuit' : p.montant.toLocaleString('fr-FR') + ' <span>FCFA / mois</span> <small class="eq" data-fcfa="' + p.montant + '"></small>';
      card.innerHTML =
        (isActive ? '<div class="plan-badge">Plan actuel</div>' : '') +
        '<div class="plan-name">' + p.label + '</div>' +
        '<div class="plan-price">' + priceLabel + '</div>' +
        '<div class="plan-desc">' + p.description + '</div>';

      if (isActive){
        var tag = document.createElement('div');
        tag.className = 'current-tag ' + key;
        tag.textContent = key === 'gratuit' ? 'Ton plan actuel' : 'Actif jusqu\'au ' + new Date(current.expiresAt).toLocaleDateString('fr-FR');
        card.appendChild(tag);
      } else {
        var btn = document.createElement('button');
        btn.className = 'plan-btn ' + key;
        btn.textContent = isPending ? 'Paiement en attente...' : (key === 'gratuit' ? 'Revenir au plan gratuit' : 'Choisir — ' + p.montant.toLocaleString('fr-FR') + ' FCFA');
        btn.disabled = isPending;
        btn.addEventListener('click', function(){ choisirPlan(key); });
        card.appendChild(btn);
      }
      plansList.appendChild(card);
    });
  }

  function choisirPlan(plan){
    authFetch(API, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'choisir_plan', plan: plan })
    }).then(function(res){ return res.json(); }).then(function(){ load(); });
  }

  function load(){
    authFetch(API).then(function(res){ return res.json().then(function(data){ return { ok: res.ok, data: data }; }); })
      .then(function(result){
        if (!result.ok){ localStorage.removeItem('starvibe_token'); loadingState.hidden = true; loggedOutState.hidden = false; return; }
        renderPayBox(result.data.abonnement);
        renderPlans(result.data.abonnement, result.data.plans);
        loadingState.hidden = true;
        appState.hidden = false;
        if (!autreBox.firstChild) renderGift();
        loadRecus();
      });
  }

  // ---------- Mes reçus : chaque paiement confirmé donne un reçu (aussi envoyé par WhatsApp) ----------
  function loadRecus(){
    authFetch('/api/starvibe-recus?mes=1').then(function(r){ return r.ok ? r.json() : null; }).then(function(d){
      var box = document.getElementById('mesRecus'); if (!d || !d.recus || !d.recus.length){ box.innerHTML = ''; return; }
      var h = '<div class="gift"><h2>Mes reçus</h2><p class="hint">Chaque paiement confirmé te donne un reçu, aussi envoyé sur ton WhatsApp.</p>';
      d.recus.slice(0, 10).forEach(function(r){
        h += '<details style="margin-top:8px"><summary><b>' + esc2(r.titre) + '</b> · ' + Number(r.montant).toLocaleString('fr-FR') + ' FCFA' + (r.expireLe ? ' · jusqu\'au ' + esc2(new Date(r.expireLe).toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric', timeZone:'Africa/Brazzaville' })) : '') + '</summary><pre style="white-space:pre-wrap;font:14px/1.5 inherit;margin:8px 0 0">' + esc2(r.texte) + '</pre></details>';
      });
      box.innerHTML = h + '</div>';
    });
  }

  // ---------- Abonnement Famille pour un autre enfant (payé par un parent, un proche…) ----------
  var autreBox = document.getElementById('autreEnfant');
  var params = new URLSearchParams(location.search);
  var gift = { compte: false, methode: '', abo: null, timer: null };
  function esc2(t){ return String(t == null ? '' : t).replace(/[&<>"']/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
  function giftApi(payload){
    return authFetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
      .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); });
  }
  function renderGift(){
    autreBox.innerHTML =
      '<div class="gift" id="giftCard">' +
        '<h2>Abonnement Famille pour un autre enfant</h2>' +
        '<p class="hint">Tu peux payer l\'abonnement Famille (1 500 FCFA par mois) pour l\'enfant d\'un proche : il suffit du numéro du parent, qui doit avoir un compte KOMYO (gratuit).</p>' +
        '<label class="lbl" for="gTel">Numéro du parent de l\'enfant</label>' +
        '<input type="tel" id="gTel" autocomplete="off" placeholder="Avec l\'indicatif, ex. +242 06 123 45 67" value="' + esc2(params.get('pour') || '') + '">' +
        '<div id="gFound"></div>' +
        '<label class="lbl" for="gEnfant">Prénom ou nom de l\'enfant (facultatif)</label>' +
        '<input type="text" id="gEnfant" maxlength="80" autocomplete="off" value="' + esc2(params.get('enfant') || '') + '">' +
        '<label class="lbl">Comment veux-tu payer ?</label>' +
        '<div class="methods">' +
          '<label class="m" data-m="mtn_money"><input type="radio" name="gm" value="mtn_money"> MTN Mobile Money</label>' +
          '<label class="m" data-m="airtel_money"><input type="radio" name="gm" value="airtel_money"> Airtel Money</label>' +
          '<label class="m off"><input type="radio" name="gm" disabled> Carte bancaire (Visa, Mastercard) — bientôt</label>' +
        '</div>' +
        '<div class="secu"><b>Ton code secret Mobile Money (PIN) ne se tape jamais ici.</b> Tu fais le dépôt sur ton propre téléphone, au numéro indiqué à l\'étape suivante. Le bouton devient vert uniquement quand le paiement est réellement confirmé.</div>' +
        '<button type="button" class="go" id="gGo" disabled>Valider le paiement</button>' +
        '<div class="suivi" id="gSuivi" aria-live="polite"></div>' +
      '</div>';
    var tel = document.getElementById('gTel'), found = document.getElementById('gFound'), go = document.getElementById('gGo');
    function maj(){ var ok = gift.compte && gift.methode && !gift.abo; go.disabled = !ok; go.className = 'go' + (ok ? ' pret' : ''); }
    var verif = null;
    function verifier(){
      gift.compte = false; found.innerHTML = ''; maj();
      var v = tel.value.trim(); if (v.replace(/\D/g, '').length < 8) return;
      giftApi({ action: 'trouver_compte', telephone: v }).then(function(r){
        if (!r.ok){ found.innerHTML = '<div class="err">' + esc2(r.d.error || 'Vérification impossible.') + '</div>'; return; }
        gift.compte = true;
        found.innerHTML = '<div class="found">Compte trouvé ✓ ' + esc2(r.d.nomMasque) + (r.d.enfants ? ' · ' + r.d.enfants + ' profil(s) enfant' : '') + '</div>'; maj();
      });
    }
    tel.addEventListener('input', function(){ clearTimeout(verif); verif = setTimeout(verifier, 700); });
    autreBox.querySelectorAll('.m[data-m]').forEach(function(l){
      l.addEventListener('click', function(){ gift.methode = l.getAttribute('data-m'); autreBox.querySelectorAll('.m').forEach(function(x){ x.classList.toggle('on', x === l); }); l.querySelector('input').checked = true; maj(); });
    });
    go.addEventListener('click', function(){
      if (go.disabled) return; go.disabled = true; go.textContent = 'Création de la demande…';
      giftApi({ action: 'abonner_autre', telephone: tel.value.trim(), enfantNom: document.getElementById('gEnfant').value.trim(), methode: gift.methode }).then(function(r){
        if (!r.ok){ go.textContent = 'Valider le paiement'; document.getElementById('gSuivi').innerHTML = '<div class="err">' + esc2(r.d.error || 'Impossible de créer la demande.') + '</div>'; maj(); return; }
        gift.abo = r.d.abonnement; go.textContent = 'En attente de confirmation du paiement…';
        var a = gift.abo, n = Number(a.montantAttendu).toLocaleString('fr-FR');
        document.getElementById('gSuivi').innerHTML =
          '<b>1.</b> Dépose exactement <b>' + n + ' FCFA</b> par ' + (gift.methode === 'airtel_money' ? 'Airtel Money' : 'MTN Mobile Money') + ' au <b>' + esc2(a.numeroReception) + '</b>.<br>' +
          '<b>2.</b> Indique la référence <b>' + esc2(a.referencePaiement) + '</b>.<br><b>3.</b> Reste sur cette page : elle se met à jour seule.';
        gift.timer = setInterval(function(){
          authFetch(API + '?suivi=' + encodeURIComponent(a.id)).then(function(x){ return x.json(); }).then(function(d){
            var st = d.abonnement && d.abonnement.statut;
            if (st === 'actif'){ clearInterval(gift.timer); go.className = 'go ok'; go.textContent = 'Paiement validé ✓';
              document.getElementById('gSuivi').innerHTML = '<div class="found">Paiement validé ✓ L\'abonnement Famille est actif pour 30 jours.</div>'; }
            else if (st === 'paiement_invalide'){ clearInterval(gift.timer); go.className = 'go'; go.textContent = 'Paiement non valide';
              document.getElementById('gSuivi').innerHTML = '<div class="err">Le montant reçu ne correspond pas. Écris-nous à contact@starentreprise.com avec ta référence.</div>'; }
          }).catch(function(){});
        }, 6000);
      });
    });
    if (tel.value) verifier();
    if (params.get('pour') || params.get('plan') === 'autre') document.getElementById('giftCard').scrollIntoView({ behavior: 'smooth' });
  }

  load();
})();
</script>
<script src="assets/komyo-prix-v2.js" defer></script>
<script src="assets/rappel-v1.js" defer></script>
<script src="assets/bulle-komyo.js" defer></script>
<script src="assets/keydou-bulle-v1.js" defer></script>
