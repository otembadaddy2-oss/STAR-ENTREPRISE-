<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KOMYO — Vitrine</title>
<meta name="theme-color" content="#0e0b1c">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="assets/img/icons/komyo-192-v2.png" type="image/png">
<link rel="preload" href="/starvibe/assets/fonts/inter-latin-v1.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/starvibe/assets/fonts/komyo-fonts-v1.css">
<link rel="manifest" href="manifest-komyo.json">
<style>
  :root{--nuit:#0e0b1c;--nuit-2:#191330;--or:#e8a93d;--or-clair:#ffd27a;--corail:#ff6b4a;--creme:#fff4df;--dim:#b9aec9;--coeur:#ee1228;--ok:#1f8f4a;}
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{background:var(--nuit);color:var(--creme);font-family:'Inter',Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100dvh;}
  h1,h2,h3{font-family:'Sora',Arial,sans-serif;margin:0;}
  [hidden]{display:none!important;}
  a{color:inherit;}
  .top{display:flex;align-items:center;justify-content:space-between;padding:calc(12px + env(safe-area-inset-top)) 16px 4px;max-width:520px;margin:0 auto;}
  .back{font:700 13px 'Sora',Arial,sans-serif;text-decoration:none;color:var(--or-clair);padding:8px 0;}
  .share{appearance:none;border:1.5px solid rgba(232,169,61,.5);background:transparent;color:var(--or-clair);font:700 12.5px 'Sora',Arial,sans-serif;padding:8px 14px;border-radius:999px;cursor:pointer;}
  .wrap{max-width:520px;margin:0 auto;padding:0 16px 60px;}
  .head{display:flex;align-items:center;gap:14px;padding:12px 0 4px;}
  .av{width:64px;height:64px;border-radius:50%;flex:none;background:linear-gradient(135deg,var(--corail),var(--or));color:#2a1305;display:flex;align-items:center;justify-content:center;font:800 22px 'Sora',Arial,sans-serif;position:relative;overflow:hidden;border:2px solid var(--or);}
  .av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .nom{font-size:20px;font-weight:800;line-height:1.2;overflow-wrap:anywhere;}
  .act{font-size:13px;color:var(--dim);margin-top:2px;}
  .stats{display:flex;gap:8px;margin:14px 0 4px;}
  .stats div{flex:1;text-align:center;background:var(--nuit-2);border:1px solid rgba(232,169,61,.25);border-radius:14px;padding:9px 4px;}
  .stats b{display:block;font:800 16px 'Sora',Arial,sans-serif;color:var(--or-clair);font-variant-numeric:tabular-nums;}
  .stats span{font-size:11px;color:var(--dim);}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 0;}
  .b{appearance:none;border:0;border-radius:999px;padding:11px 18px;font:800 13.5px 'Sora',Arial,sans-serif;cursor:pointer;text-decoration:none;display:inline-block;text-align:center;}
  .b.or{background:linear-gradient(135deg,var(--corail),var(--or));color:#2a1305;}
  .b.on{background:var(--ok);color:#fff;}
  .b.ligne{background:transparent;border:1.5px solid rgba(232,169,61,.5);color:var(--or-clair);}
  .b.wa{background:#25D366;color:#fff;}
  .b:focus-visible,.nav:focus-visible,.carte:focus-visible,.th:focus-visible{outline:2px solid var(--or-clair);outline-offset:2px;}
  /* carrousel */
  .scene{position:relative;height:470px;margin:6px -16px 0;background:radial-gradient(120% 70% at 50% 0%,#241a4a 0%,var(--nuit-2) 45%,var(--nuit) 100%);border-radius:28px;overflow:hidden;}
  .drum{position:absolute;inset:0;perspective:900px;touch-action:pan-y;cursor:grab;user-select:none;-webkit-user-select:none;}
  .drum.drag{cursor:grabbing;}
  .ring{position:absolute;left:50%;top:42%;width:0;height:0;transform-style:preserve-3d;}
  .carte{position:absolute;left:-76px;top:-135px;width:152px;height:270px;border-radius:16px;overflow:hidden;background:#000;border:2px solid var(--or);box-shadow:0 0 0 1px rgba(255,210,122,.25),0 14px 30px -10px rgba(0,0,0,.8);}
  .carte img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}
  .carte .vide{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:12px;text-align:center;background:linear-gradient(160deg,#2b1c55,#12091f);font:700 12px 'Sora',Arial,sans-serif;color:var(--creme);}
  .carte .vide i{width:44px;height:44px;border-radius:50%;border:2px solid var(--or);display:grid;place-items:center;font-style:normal;color:var(--or-clair);font-size:18px;}
  .carte.front{box-shadow:0 0 0 1px var(--or-clair),0 0 28px 2px rgba(232,169,61,.55),0 14px 30px -10px rgba(0,0,0,.8);}
  .carte::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.14),transparent 30%,transparent 70%,rgba(0,0,0,.35));pointer-events:none;}
  .sol{position:absolute;left:50%;top:42%;width:240px;height:60px;margin:150px 0 0 -120px;background:radial-gradient(closest-side,rgba(232,169,61,.35),transparent);filter:blur(6px);pointer-events:none;}
  .info{position:absolute;left:0;right:0;bottom:64px;text-align:center;padding:0 22px;}
  .info .t{font:700 15px 'Sora',Arial,sans-serif;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .info .s{font-size:12.5px;color:var(--dim);font-variant-numeric:tabular-nums;}
  .info .s b{color:var(--or-clair);font-weight:600;}
  .heart{display:inline-block;width:13px;height:13px;vertical-align:-2px;fill:var(--coeur);margin-right:3px;}
  .nav-zone{position:absolute;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:14px;}
  .nav{appearance:none;border:1.5px solid rgba(232,169,61,.5);background:rgba(14,11,28,.6);color:var(--or-clair);width:44px;height:44px;border-radius:50%;font-size:18px;cursor:pointer;display:grid;place-items:center;}
  .hint{text-align:center;font-size:12.5px;color:var(--dim);margin:10px 0 0;}
  /* toutes les vidéos */
  .grille{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;}
  .th{position:relative;aspect-ratio:9/16;border-radius:12px;overflow:hidden;background:linear-gradient(160deg,#2b1c55,#12091f);border:1.5px solid rgba(232,169,61,.4);padding:0;cursor:pointer;display:block;text-decoration:none;}
  .th img{width:100%;height:100%;object-fit:cover;display:block;}
  .th .l{position:absolute;left:0;right:0;bottom:0;padding:18px 6px 6px;background:linear-gradient(0deg,rgba(0,0,0,.8),transparent);font-size:10.5px;font-variant-numeric:tabular-nums;color:#fff;text-align:left;}
  .th .p{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;color:var(--or-clair);}
  .vide-msg{text-align:center;color:var(--dim);padding:50px 10px;line-height:1.6;}
  .sortie{text-align:center;padding:60px 16px;color:var(--dim);}
  .sortie a{color:var(--or-clair);font-weight:700;}
  .carte-visite{margin-top:12px;font-size:13px;color:var(--dim);}
  @media (prefers-reduced-motion:reduce){.drum{touch-action:pan-y;}}
</style>
</head>
<body>
<div class="top"><a class="back" id="retour" href="fil.html">← Le fil</a><button class="share" id="partager" type="button" hidden>Partager</button></div>
<div class="wrap">
  <div id="etat" class="sortie">Chargement…</div>
  <div id="sortie" class="sortie" hidden>Connecte-toi à KOMYO pour voir les vitrines.<br><a href="inscription.html?mode=login">Se connecter / Créer un compte</a></div>
  <div id="app" hidden>
    <div class="head"><div class="av" id="av"></div><div><h1 class="nom" id="nom"></h1><div class="act" id="act"></div></div></div>
    <div class="stats"><div><b id="sV">0</b><span>vidéos</span></div><div><b id="sVues">0</b><span>vues</span></div><div><b id="sC">0</b><span>cœurs</span></div><div><b id="sA">0</b><span>abonnés</span></div></div>
    <div class="actions" id="actions"></div>

    <div class="scene" id="scene" hidden>
      <div class="drum" id="drum"><div class="sol"></div><div class="ring" id="ring"></div></div>
      <div class="info" id="info"></div>
      <div class="nav-zone"><button class="nav" id="gauche" type="button" aria-label="Vidéo précédente">◀</button><button class="nav" id="droite" type="button" aria-label="Vidéo suivante">▶</button></div>
    </div>
    <p class="hint" id="hint" hidden>Fais tourner du doigt, touche la vidéo de devant pour la regarder.</p>
    <div class="actions" id="plus" hidden><button class="b ligne" id="toutes" type="button">Voir toutes les vidéos</button></div>
    <div class="grille" id="grille" hidden></div>
    <div id="videMsg" class="vide-msg" hidden></div>
  </div>
</div>
<script>
(function(){
  var token = ''; try { token = localStorage.getItem('starvibe_token') || ''; } catch (e) {}
  var $ = function(i){ return document.getElementById(i); };
  var etat = $('etat'), sortie = $('sortie'), app = $('app');
  if (!token){ etat.hidden = true; sortie.hidden = false; return; }
  var q = new URLSearchParams(location.search), P = q.get('p') || 'me';
  var HEART = '<svg class="heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-10-9.3C.4 8 2 4.5 5.6 4c2-.3 3.9.6 6.4 3 2.5-2.4 4.4-3.3 6.4-3C22 4.5 23.6 8 22 11.7 19.5 16.4 12 21 12 21z"/></svg>';
  function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]; }); }
  function fmt(n){ n = Number(n) || 0; return n >= 1000 ? (n / 1000).toFixed(1).replace('.', ',') + ' K' : String(n); }
  function ini(n){ var p = String(n || '?').trim().split(/\s+/); return ((p[0] || '?')[0] + (p[1] ? p[1][0] : '')).toUpperCase(); }
  function api(url, opts){ opts = opts || {}; opts.headers = Object.assign({ 'Authorization': 'Bearer ' + token }, opts.headers || {}); return fetch(url, opts); }
  var reduit = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var videos = [], auteur = null, suivant = 0, fin = true;

  function titre(v){ return v.legende ? v.legende : 'Vidéo de ' + (auteur ? auteur.nom : ''); }
  function vignette(v, cls){
    return v.afficheUrl ? '<img alt="" loading="lazy" decoding="async" src="' + esc(v.afficheUrl) + '">' : '<div class="vide"><i>▶</i>' + esc(titre(v).slice(0, 60)) + '</div>';
  }
  function ouvrirVideo(v){ location.href = 'fil.html?video=' + encodeURIComponent(v.id); }

  // ---------- carrousel ----------
  var N = 0, STEP = 45, R = 235, loop = true, angle = 0, cible = null, enDrag = false, dernier = 0, avant = -1, x0 = 0, bouge = 0, cartes = [];
  var ring = $('ring'), drum = $('drum'), info = $('info');
  function construire(){
    ring.innerHTML = ''; N = videos.length; cartes = [];
    loop = N >= 6; STEP = loop ? 360 / N : 38; R = loop ? Math.max(235, Math.round(80 / Math.tan(Math.PI / N)) + 25) : 235;
    videos.forEach(function(v, i){
      var c = document.createElement('div'); c.className = 'carte'; c.tabIndex = -1; c.innerHTML = vignette(v);
      c.style.transform = 'rotateY(' + (i * STEP) + 'deg) translateZ(' + R + 'px)'; ring.appendChild(c); cartes.push(c);
    });
    angle = 0; cible = null; avant = -1; dessiner();
  }
  function frontIdx(){ if (!N) return 0; if (loop) return ((Math.round(-angle / STEP) % N) + N) % N; return Math.min(N - 1, Math.max(0, Math.round(-angle / STEP))); }
  function bornes(){ if (!loop) angle = Math.min(0, Math.max(-(N - 1) * STEP, angle)); }
  function dessiner(){
    if (!N) return; bornes();
    ring.style.transform = 'translateZ(-' + R + 'px) rotateY(' + angle + 'deg)';
    var f = frontIdx();
    cartes.forEach(function(c, i){ var a = ((i * STEP + angle) % 360 + 540) % 360 - 180, k = Math.cos(a * Math.PI / 180), kk = Math.max(0, k); c.style.opacity = (0.2 + 0.8 * kk).toFixed(2); c.style.filter = 'brightness(' + (0.55 + 0.45 * kk).toFixed(2) + ')'; c.classList.toggle('front', i === f); });
    if (f !== avant){ avant = f; var v = videos[f]; info.innerHTML = '<div class="t">' + esc(titre(v)) + '</div><div class="s"><b>' + fmt(v.vues) + '</b> vues · ' + HEART + fmt(v.likes) + '</div>'; }
  }
  function aller(d){ var base = Math.round((cible === null ? angle : cible) / STEP) * STEP + d * STEP; if (!loop) base = Math.min(0, Math.max(-(N - 1) * STEP, base)); cible = base; dernier = performance.now(); }
  $('gauche').addEventListener('click', function(){ aller(1); });
  $('droite').addEventListener('click', function(){ aller(-1); });
  drum.addEventListener('pointerdown', function(e){ enDrag = true; x0 = e.clientX; bouge = 0; cible = null; drum.classList.add('drag'); try { drum.setPointerCapture(e.pointerId); } catch (x) {} });
  drum.addEventListener('pointermove', function(e){ if (!enDrag) return; var dx = e.clientX - x0; x0 = e.clientX; bouge += Math.abs(dx); angle += dx * 0.45; dernier = performance.now(); });
  drum.addEventListener('pointerup', function(){ if (!enDrag) return; enDrag = false; drum.classList.remove('drag'); if (bouge < 6){ var v = videos[frontIdx()]; if (v) ouvrirVideo(v); } else { cible = Math.round(angle / STEP) * STEP; if (!loop) cible = Math.min(0, Math.max(-(N - 1) * STEP, cible)); } });
  drum.addEventListener('pointercancel', function(){ enDrag = false; drum.classList.remove('drag'); });
  var t0 = performance.now();
  function boucle(t){
    var dt = Math.min(64, t - t0) / 1000; t0 = t;
    if (N && !enDrag && !document.hidden){
      if (cible !== null){ angle += (cible - angle) * 0.12; if (Math.abs(cible - angle) < 0.05){ angle = cible; cible = null; } }
      else if (loop && !reduit && t - dernier > 2500) angle -= 7 * dt;
      dessiner();
    }
    requestAnimationFrame(boucle);
  }

  // ---------- toutes les vidéos ----------
  function ajouterGrille(liste){
    var g = $('grille'); g.hidden = false;
    liste.forEach(function(v){
      var a = document.createElement('a'); a.className = 'th'; a.href = 'fil.html?video=' + encodeURIComponent(v.id); a.setAttribute('aria-label', titre(v));
      a.innerHTML = (v.afficheUrl ? '<img alt="" loading="lazy" decoding="async" src="' + esc(v.afficheUrl) + '">' : '<span class="p">▶</span>') + '<div class="l">' + fmt(v.vues) + ' vues · ' + fmt(v.likes) + ' ♥</div>';
      g.appendChild(a);
    });
  }
  var grilleOuverte = false;
  $('toutes').addEventListener('click', function(){
    var b = this;
    if (!grilleOuverte){ grilleOuverte = true; ajouterGrille(videos); b.textContent = fin ? 'Réduire' : 'Voir plus de vidéos'; if (fin) b.textContent = 'Masquer la liste'; return; }
    if (!fin){ b.disabled = true; charger(suivant, true).then(function(nouvelles){ b.disabled = false; ajouterGrille(nouvelles); b.textContent = fin ? 'Masquer la liste' : 'Voir plus de vidéos'; }); return; }
    grilleOuverte = false; $('grille').innerHTML = ''; $('grille').hidden = true; b.textContent = 'Voir toutes les vidéos';
  });

  // ---------- chargement ----------
  function charger(decalage, ajout){
    return api('/api/starvibe-videos?vitrine=' + encodeURIComponent(P) + '&decalage=' + decalage).then(function(r){
      if (r.status === 401){ try { localStorage.removeItem('starvibe_token'); } catch (e) {} etat.hidden = true; sortie.hidden = false; return null; }
      if (!r.ok) throw new Error('x'); return r.json();
    }).then(function(d){
      if (!d) return [];
      suivant = d.suivant; fin = d.fin;
      if (!ajout){ auteur = d.auteur; videos = d.videos || []; rendreEntete(d); } else { videos = videos.concat(d.videos || []); }
      return d.videos || [];
    });
  }
  function rendreEntete(d){
    etat.hidden = true; app.hidden = false;
    var a = d.auteur, c = d.chiffres;
    document.title = 'KOMYO — ' + a.nom;
    $('av').innerHTML = esc(ini(a.nom)) + (a.photoUrl ? '<img alt="" src="' + esc(a.photoUrl) + '" onerror="this.remove()">' : '');
    $('nom').textContent = a.nom; $('act').textContent = a.activite || '';
    $('sV').textContent = fmt(c.videos); $('sVues').textContent = fmt(c.vues); $('sC').textContent = fmt(c.coeurs); $('sA').textContent = fmt(c.abonnes);
    var ac = $('actions'); ac.innerHTML = '';
    if (a.estMoi){
      ac.innerHTML = '<a class="b or" href="fil.html?publier=1">Publier une vidéo</a><a class="b ligne" href="statistiques.html">Mes statistiques</a>';
    } else {
      var bo = document.createElement('button'); bo.type = 'button'; bo.className = 'b or'; bo.id = 'abo'; bo.textContent = 'S\'abonner'; bo.hidden = true; ac.appendChild(bo);
      initAbo(bo, a.profilId);
      if (a.wa){ var w = document.createElement('a'); w.className = 'b wa'; w.target = '_blank'; w.rel = 'noopener'; w.href = 'https://wa.me/' + String(a.wa).replace(/[^0-9]/g, ''); w.textContent = 'Écrire sur WhatsApp'; ac.appendChild(w); }
    }
    $('partager').hidden = false;
    if (videos.length){
      $('scene').hidden = false; $('hint').hidden = false; construire();
      $('plus').hidden = videos.length < 2 && fin;
      $('toutes').textContent = 'Voir toutes les vidéos';
      if (videos.length <= 3 && fin) $('plus').hidden = true;
    } else {
      var m = $('videMsg'); m.hidden = false;
      m.innerHTML = a.estMoi ? 'Tu n\'as pas encore de vidéo.<br>Publie ta première vidéo : elle apparaîtra ici, dans ton carrousel doré.' : 'Aucune vidéo pour le moment.';
    }
  }
  function initAbo(bo, pid){
    function maj(on){ bo.hidden = false; bo.classList.toggle('on', !!on); bo.classList.toggle('or', !on); bo.textContent = on ? 'Abonné ✓' : 'S\'abonner'; bo.disabled = false; }
    api('/api/starvibe-myo?etat=' + encodeURIComponent(pid)).then(function(r){ return r.ok ? r.json() : null; }).then(function(d){ if (d && d.possible) maj(d.abonne); }).catch(function(){});
    bo.addEventListener('click', function(){
      var on = bo.classList.contains('on');
      if (on && !window.confirm('Ne plus être abonné à cette personne ?')) return;
      bo.disabled = true;
      api('/api/starvibe-myo', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: on ? 'ne_plus_suivre' : 'suivre', profilId: Number(pid) }) })
        .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); })
        .then(function(r){ if (!r.ok){ bo.disabled = false; window.alert(r.d.error || 'Abonnement impossible pour le moment.'); return; } maj(r.d.abonne); var n = $('sA'); n.textContent = fmt((Number(String(n.textContent).replace(/[^0-9]/g, '')) || 0) + (r.d.abonne ? 1 : -1)); })
        .catch(function(){ bo.disabled = false; window.alert('Connexion interrompue. Réessaie.'); });
    });
  }
  $('partager').addEventListener('click', function(){
    if (!auteur) return;
    var lien = location.origin + '/starvibe/vitrine.html?p=' + auteur.profilId, texte = 'Regarde la vitrine de ' + auteur.nom + ' sur KOMYO';
    if (navigator.share){ navigator.share({ title: 'KOMYO', text: texte, url: lien }).catch(function(){}); return; }
    try { navigator.clipboard.writeText(lien).then(function(){ $('partager').textContent = 'Lien copié ✓'; setTimeout(function(){ $('partager').textContent = 'Partager'; }, 2000); }); } catch (e) { window.prompt('Copie ce lien :', lien); }
  });
  try { if (document.referrer && /accueil\.html/.test(document.referrer)) $('retour').setAttribute('href', 'accueil.html'), $('retour').textContent = '← Mon espace'; } catch (e) {}

  charger(0, false).then(function(){ requestAnimationFrame(boucle); }).catch(function(){ etat.textContent = 'Impossible de charger cette vitrine. Vérifie ta connexion puis réessaie.'; });
})();
</script>
</body>
</html>
